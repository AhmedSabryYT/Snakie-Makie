<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SNAKIE: ETERNAL EMPIRE</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        /* ---------------------------------------------------------
        1. STYLING SYSTEM (EXTENSIVE)
        ---------------------------------------------------------
        */
        :root {
            --accent: #a29bfe;
            --danger: #ff7675;
            --success: #55efc4;
            --bg: #020208;
            --panel: rgba(15, 15, 30, 0.95);
            --font: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            outline: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg);
            color: #ffffff;
            font-family: var(--font);
            overflow: hidden;
            touch-action: none;
        }

        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* ---------------------------------------------------------
        2. UI LAYER ANIMATIONS
        ---------------------------------------------------------
        */
        @keyframes slideUp {
            from { transform: translateY(100%) scale(0.9); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 10px rgba(162, 155, 254, 0.3); }
            50% { box-shadow: 0 0 30px rgba(162, 155, 254, 0.6); }
            100% { box-shadow: 0 0 10px rgba(162, 155, 254, 0.3); }
        }

        /* ---------------------------------------------------------
        3. HUD ELEMENTS
        ---------------------------------------------------------
        */
        .hud {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            pointer-events: none;
            z-index: 10;
            display: flex;
            justify-content: space-between;
        }

        .stat-card {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 20px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        #bars {
            position: fixed;
            top: 90px;
            left: 20px;
            width: 250px;
            display: none;
            flex-direction: column;
            gap: 10px;
            z-index: 10;
            pointer-events: none;
        }

        .bar-container {
            width: 100%;
            height: 20px;
            background: rgba(0,0,0,0.7);
            border-radius: 10px;
            border: 1px solid #445;
            overflow: hidden;
            position: relative;
        }

        .bar-fill {
            height: 100%;
            width: 100%;
            transition: width 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #hp-fill { background: linear-gradient(90deg, #ff7675, #d63031); }
        #prog-fill { background: linear-gradient(90deg, #55efc4, #00b894); width: 0%; }

        .bar-label {
            position: absolute;
            width: 100%;
            text-align: center;
            font-size: 10px;
            font-weight: 900;
            line-height: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 1px 2px black;
        }

        /* ---------------------------------------------------------
        4. OVERLAY MENU SYSTEM
        ---------------------------------------------------------
        */
        .screen {
            position: fixed;
            inset: 0;
            background: rgba(2, 2, 10, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            backdrop-filter: blur(12px);
        }

        .window {
            background: var(--panel);
            width: 360px;
            padding: 40px;
            border-radius: 32px;
            border: 1px solid #334;
            text-align: center;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 30px 100px rgba(0,0,0,0.9);
        }

        .window h1 {
            font-size: 38px;
            letter-spacing: 8px;
            color: var(--accent);
            margin-bottom: 5px;
            text-shadow: 0 0 20px rgba(162, 155, 254, 0.5);
        }

        .window p {
            color: #889;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .btn {
            background: linear-gradient(145deg, #22223d, #1a1a2e);
            border: 1px solid #445;
            color: white;
            padding: 18px;
            width: 100%;
            border-radius: 16px;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .btn:hover {
            border-color: var(--accent);
            transform: translateY(-4px);
            background: #28284d;
        }

        .btn-primary {
            background: var(--accent);
            color: #000;
            border: none;
        }

        .btn-primary:hover {
            background: #bab3ff;
            color: #000;
        }

        /* ---------------------------------------------------------
        5. CHAT SYSTEM
        ---------------------------------------------------------
        */
        #chat-engine {
            position: fixed;
            bottom: 30px;
            left: 30px;
            width: 320px;
            z-index: 50;
            pointer-events: none;
        }

        #chat-history {
            height: 180px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 10px;
            mask-image: linear-gradient(to bottom, transparent, black 30%);
        }

        .chat-bubble {
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 15px;
            border-radius: 12px;
            font-size: 13px;
            margin-top: 5px;
            width: fit-content;
            max-width: 80%;
            border: 1px solid rgba(255,255,255,0.05);
            animation: fadeIn 0.3s ease;
        }

        #chat-input-box {
            width: 100%;
            background: rgba(20, 20, 40, 0.95);
            border: 1px solid #445;
            padding: 15px;
            border-radius: 12px;
            color: white;
            pointer-events: auto;
            margin-top: 10px;
            display: none;
        }

        /* ---------------------------------------------------------
        6. MOBILE CONTROLS
        ---------------------------------------------------------
        */
        #attack-trigger {
            position: fixed;
            bottom: 50px;
            right: 50px;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, #ff7675, #d63031);
            border-radius: 50%;
            border: 6px solid rgba(255,255,255,0.2);
            z-index: 50;
            display: none;
            box-shadow: 0 0 40px rgba(214, 48, 49, 0.5);
            color: white;
            font-weight: 900;
            font-size: 16px;
            letter-spacing: 2px;
            transition: 0.1s;
        }

        #attack-trigger:active {
            transform: scale(0.85);
            background: #ff7675;
        }

        .hidden { display: none !important; }

        /* Notification Toast */
        #toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--danger);
            color: white;
            padding: 15px 30px;
            border-radius: 50px;
            font-weight: bold;
            z-index: 2000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: none;
            animation: slideUp 0.3s ease reverse;
        }

    </style>
</head>
<body>

    <canvas id="stage"></canvas>

    <div id="toast">PLAYER DISCONNECTED</div>

    <div class="hud">
        <div class="stat-card">💎 <span id="gem-val">0</span></div>
        <div class="stat-card" id="lvl-card" style="display:none">LVL <span id="lvl-val">1</span></div>
    </div>

    <div id="bars">
        <div class="bar-container">
            <div id="hp-fill" class="bar-fill"></div>
            <div class="bar-label">HEALTH</div>
        </div>
        <div class="bar-container" id="prog-wrap">
            <div id="prog-fill" class="bar-fill"></div>
            <div class="bar-label">PROGRESS <span id="prog-pct">0%</span></div>
        </div>
    </div>

    <div id="chat-engine">
        <div id="chat-history"></div>
        <input type="text" id="chat-input-box" placeholder="Message friend... (Enter)">
    </div>

    <button id="attack-trigger">BLAST</button>

    <div id="sc-main" class="screen">
        <div class="window">
            <h1>SNAKIE</h1>
            <p>v4.5.0 • MEGA EMPIRE</p>
            <button class="btn btn-primary" onclick="UI.toModeSelect(false)">SINGLE PLAYER</button>
            <button class="btn" onclick="UI.toModeSelect(true)">MULTIPLAYER</button>
            <button class="btn" onclick="UI.toggle('sc-skin')">CUSTOMIZE</button>
        </div>
    </div>

    <div id="sc-modes" class="screen hidden">
        <div class="window">
            <h2 id="mode-head">SELECT MODE</h2>
            <button class="btn" onclick="Game.preStart('peaceful')">✨ PEACEFUL</button>
            <button class="btn" onclick="Game.preStart('normal')">⚔️ NORMAL</button>
            <button id="btn-story-mode" class="btn" onclick="Game.preStart('story')">📜 STORY (30 LVLS)</button>
            <button class="btn" style="border:none; color:#667;" onclick="UI.toggle('sc-main')">BACK</button>
        </div>
    </div>

    <div id="sc-multi" class="screen hidden">
        <div class="window">
            <h2>NETWORK LOBBY</h2>
            <p>Share this PIN with your friend:</p>
            <div id="my-pin-display" style="font-size:42px; font-weight:900; color:var(--accent); margin-bottom:20px;">----</div>
            <input type="number" id="friend-id-input" style="width:100%; padding:15px; border-radius:12px; background:#0a0a1a; border:1px solid #445; color:white; text-align:center; font-size:20px; margin-bottom:15px;" placeholder="Friend's PIN">
            <button class="btn btn-primary" onclick="Net.connectToFriend()">CONNECT</button>
            <button class="btn" onclick="UI.toggle('sc-main')">BACK</button>
        </div>
    </div>

    <div id="sc-skin" class="screen hidden">
        <div class="window">
            <h2>BODY GRADIENT</h2>
            <div style="display:flex; gap:15px; margin:25px 0;">
                <input type="color" id="sk-1" value="#a29bfe" style="flex:1; height:60px; border:none; border-radius:12px;">
                <input type="color" id="sk-2" value="#6c5ce7" style="flex:1; height:60px; border:none; border-radius:12px;">
            </div>
            <p>Cost: 10 Gems</p>
            <button class="btn btn-primary" onclick="Game.buySkin()">APPLY SKIN</button>
            <button class="btn" onclick="UI.toggle('sc-main')">CANCEL</button>
        </div>
    </div>

    <div id="sc-dead" class="screen hidden">
        <div class="window">
            <h1 style="color:var(--danger)">DEFEATED</h1>
            <p id="death-reason">You were destroyed.</p>
            <button class="btn btn-primary" onclick="location.reload()">TRY AGAIN</button>
            <button class="btn" onclick="location.reload()">MAIN MENU</button>
        </div>
    </div>

    <script>
        /**
         * @class Particle
         * Handles background stars and combat effects
         */
        class Particle {
            constructor(x, y, color, speedX, speedY, size, life) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.speedX = speedX;
                this.speedY = speedY;
                this.size = size;
                this.maxLife = life;
                this.life = life;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.life--;
            }

            draw(ctx, cam) {
                const alpha = this.life / this.maxLife;
                ctx.globalAlpha = alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x - cam.x, this.y - cam.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }

        /**
         * @class Enemy
         * Handles individual monster logic
         */
        class Enemy {
            constructor(x, y, type, level) {
                this.x = x;
                this.y = y;
                this.type = type; // 'minion' or 'boss'
                this.hp = type === 'boss' ? 50 : 2;
                this.maxHp = this.hp;
                this.level = level;
                this.size = type === 'boss' ? 80 : 30;
                this.angle = 0;
            }

            update() {
                this.x -= (2 + this.level * 0.2); // Enemies move left
                this.angle += 0.05;
            }

            draw(ctx, cam) {
                ctx.save();
                ctx.translate(this.x - cam.x, this.y - cam.y);
                ctx.rotate(this.angle);

                // Detailed Drawing
                ctx.fillStyle = this.type === 'boss' ? '#6c5ce7' : '#d63031';
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;

                // Monster Shape
                ctx.beginPath();
                const sides = this.type === 'boss' ? 8 : 4;
                for(let i=0; i<sides; i++) {
                    const r = i % 2 === 0 ? this.size : this.size * 0.7;
                    const ang = (i / sides) * Math.PI * 2;
                    ctx.lineTo(Math.cos(ang)*r, Math.sin(ang)*r);
                }
                ctx.closePath();
                ctx.fill();

                // Eyes
                ctx.fillStyle = 'white';
                ctx.beginPath(); ctx.arc(-this.size/3, -this.size/4, this.size/6, 0, 7); ctx.fill();
                ctx.beginPath(); ctx.arc(this.size/3, -this.size/4, this.size/6, 0, 7); ctx.fill();
                
                // HP Bar
                ctx.restore();
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(this.x - cam.x - 20, this.y - cam.y - this.size - 10, 40, 5);
                ctx.fillStyle = 'red';
                ctx.fillRect(this.x - cam.x - 20, this.y - cam.y - this.size - 10, (this.hp/this.maxHp)*40, 5);
            }
        }

        /**
         * @class Bullet
         * Fireballs shot by the snake
         */
        class Bullet {
            constructor(x, y, vx, vy) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.life = 100;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life--;
            }
            draw(ctx, cam) {
                ctx.fillStyle = '#ff7675';
                ctx.shadowBlur = 10; ctx.shadowColor = 'orange';
                ctx.beginPath(); ctx.arc(this.x - cam.x, this.y - cam.y, 8, 0, 7); ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        /**
         * @namespace UI
         * UI State Controller
         */
        const UI = {
            toggle: (id) => {
                document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
                if(id) document.getElementById(id).classList.remove('hidden');
            },
            toModeSelect: (multi) => {
                Game.isMulti = multi;
                document.getElementById('btn-story-mode').style.display = multi ? 'none' : 'block';
                if(multi) {
                    Net.init();
                    UI.toggle('sc-multi');
                } else {
                    UI.toggle('sc-modes');
                }
            },
            toast: (msg) => {
                const t = document.getElementById('toast');
                t.innerText = msg;
                t.style.display = 'block';
                setTimeout(() => t.style.display = 'none', 3000);
            },
            addChat: (msg, isMe) => {
                const log = document.getElementById('chat-history');
                const div = document.createElement('div');
                div.className = 'chat-bubble';
                div.style.alignSelf = isMe ? 'flex-end' : 'flex-start';
                div.style.background = isMe ? 'var(--accent)' : 'rgba(255,255,255,0.1)';
                div.style.color = isMe ? '#000' : '#fff';
                div.innerText = msg;
                log.appendChild(div);
                log.scrollTop = log.scrollHeight;
            }
        };

        /**
         * @namespace Net
         * PeerJS Multiplayer Manager
         */
        const Net = {
            peer: null,
            conn: null,
            myId: null,
            friendId: null,
            otherSnake: [],
            otherSkin: {a:'#fff', b:'#fff'},
            vote: null,

            init: () => {
                if(Net.peer) return;
                const pin = Math.floor(1000 + Math.random() * 9000);
                Net.peer = new Peer('snk-' + pin);
                Net.peer.on('open', (id) => {
                    Net.myId = id.split('-')[1];
                    document.getElementById('my-pin-display').innerText = Net.myId;
                });
                Net.peer.on('connection', (c) => {
                    Net.conn = c;
                    Net.setupHandlers();
                });
            },

            connectToFriend: () => {
                const fId = document.getElementById('friend-id-input').value;
                if(!fId) return;
                Net.conn = Net.peer.connect('snk-' + fId);
                Net.setupHandlers();
            },

            setupHandlers: () => {
                UI.toast("CONNECTED TO FRIEND");
                UI.toggle('sc-modes');
                
                Net.conn.on('data', (data) => {
                    if(data.type === 'sync') {
                        Net.otherSnake = data.snake;
                        Net.otherSkin = data.skin;
                    } else if(data.type === 'chat') {
                        UI.addChat(data.msg, false);
                    } else if(data.type === 'vote') {
                        Net.checkVotes(data.mode);
                    } else if(data.type === 'start') {
                        Game.start(data.mode, true);
                    }
                });

                Net.conn.on('close', () => {
                    UI.toast("FRIEND DISCONNECTED");
                    setTimeout(() => location.reload(), 2000);
                });
            },

            sendChat: (msg) => {
                if(Net.conn) Net.conn.send({type:'chat', msg: msg});
            },

            sendSync: () => {
                if(Net.conn) {
                    Net.conn.send({
                        type: 'sync',
                        snake: Game.snake,
                        skin: Game.config.skin
                    });
                }
            },

            checkVotes: (friendMode) => {
                if(!Net.vote) return; // Wait for me to vote
                if(Net.vote === friendMode) {
                    Game.start(Net.vote);
                    Net.conn.send({type:'start', mode: Net.vote});
                } else {
                    // Randomize Choice
                    const modes = [Net.vote, friendMode];
                    const chosen = modes[Math.floor(Math.random() * 2)];
                    Game.start(chosen);
                    Net.conn.send({type:'start', mode: chosen});
                }
            }
        };

        /**
         * @namespace Game
         * Main Logic and Engine
         */
        const Game = {
            isLive: false,
            isMulti: false,
            mode: 'peaceful',
            width: window.innerWidth,
            height: window.innerHeight,
            cam: {x:0, y:0},
            
            // State
            gems: 0,
            hp: 100,
            level: 1,
            progress: 0,
            config: { skin: {a:'#a29bfe', b:'#6c5ce7'} },

            // Entities
            snake: [],
            angle: 0,
            targetAngle: 0,
            fruit: {x:0, y:0},
            enemies: [],
            bullets: [],
            particles: [],

            init: () => {
                const cvs = document.getElementById('stage');
                cvs.width = Game.width;
                cvs.height = Game.height;
                Game.ctx = cvs.getContext('2d');

                // Load Data
                const saved = JSON.parse(localStorage.getItem('snakie_pro_v4') || '{}');
                Game.gems = saved.gems || 0;
                Game.level = saved.level || 1;
                Game.config.skin = saved.skin || Game.config.skin;
                
                document.getElementById('gem-val').innerText = Game.gems;
                document.getElementById('lvl-val').innerText = Game.level;

                // Inputs
                window.addEventListener('touchmove', Game.handleInput);
                window.addEventListener('mousemove', Game.handleInput);
                window.addEventListener('keydown', Game.handleKey);
                document.getElementById('attack-trigger').addEventListener('touchstart', Game.shoot);

                // Background Stars
                for(let i=0; i<100; i++) {
                    Game.particles.push(new Particle(
                        Math.random()*4000-2000, 
                        Math.random()*4000-2000, 
                        '#fff', 0, 0, Math.random()*2, 99999
                    ));
                }

                requestAnimationFrame(Game.loop);
            },

            handleInput: (e) => {
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                Game.targetAngle = Math.atan2(clientY - Game.height/2, clientX - Game.width/2);
            },

            handleKey: (e) => {
                if(e.key === 'Enter') {
                    const box = document.getElementById('chat-input-box');
                    if(box.style.display === 'block') {
                        if(box.value) {
                            UI.addChat(box.value, true);
                            Net.sendChat(box.value);
                            box.value = '';
                        }
                        box.style.display = 'none';
                    } else {
                        box.style.display = 'block';
                        box.focus();
                    }
                }
            },

            preStart: (mode) => {
                if(Game.isMulti && Net.conn) {
                    Net.vote = mode;
                    Net.conn.send({type:'vote', mode: mode});
                    UI.toast("VOTED: " + mode.toUpperCase() + "... WAITING");
                } else {
                    Game.start(mode);
                }
            },

            start: (mode, force=false) => {
                Game.mode = mode;
                Game.isLive = true;
                Game.hp = 100;
                Game.progress = 0;
                Game.snake = Array(25).fill({x:0, y:0});
                
                UI.toggle(null);
                document.getElementById('bars').style.display = 'flex';
                document.getElementById('attack-trigger').style.display = mode === 'story' ? 'block' : 'none';
                document.getElementById('prog-wrap').style.display = mode === 'story' ? 'block' : 'none';
                document.getElementById('lvl-card').style.display = mode === 'story' ? 'flex' : 'none';

                Game.spawnFruit();
            },

            spawnFruit: () => {
                const h = Game.snake[0];
                Game.fruit = {
                    x: h.x + (Math.random()*1200 - 600),
                    y: h.y + (Math.random()*1200 - 600)
                };
            },

            shoot: () => {
                if(Game.mode !== 'story') return;
                const h = Game.snake[0];
                Game.bullets.push(new Bullet(
                    h.x, h.y, 
                    Math.cos(Game.angle)*15, 
                    Math.sin(Game.angle)*15
                ));
            },

            die: (msg) => {
                Game.isLive = false;
                document.getElementById('death-reason').innerText = msg;
                UI.toggle('sc-dead');
            },

            buySkin: () => {
                if(Game.gems >= 10) {
                    Game.gems -= 10;
                    Game.config.skin.a = document.getElementById('sk-1').value;
                    Game.config.skin.b = document.getElementById('sk-2').value;
                    Game.save();
                    UI.toggle('sc-main');
                } else {
                    alert("Need 10 Gems!");
                }
            },

            save: () => {
                localStorage.setItem('snakie_pro_v4', JSON.stringify({
                    gems: Game.gems,
                    level: Game.level,
                    skin: Game.config.skin
                }));
                document.getElementById('gem-val').innerText = Game.gems;
            },

            update: () => {
                if(!Game.isLive) return;

                // 1. ANGLE SMOOTHING
                let diff = Game.targetAngle - Game.angle;
                while(diff < -Math.PI) diff += Math.PI*2;
                while(diff > Math.PI) diff -= Math.PI*2;
                Game.angle += diff * 0.12;

                // 2. MOVEMENT
                const head = {
                    x: Game.snake[0].x + Math.cos(Game.angle) * 5.5,
                    y: Game.snake[0].y + Math.sin(Game.angle) * 5.5
                };
                Game.snake.unshift(head);

                // 3. COLLISION: FRUIT
                if(Math.hypot(head.x - Game.fruit.x, head.y - Game.fruit.y) < 35) {
                    Game.gems++;
                    Game.spawnFruit();
                    Game.save();
                } else {
                    Game.snake.pop();
                }

                // 4. BOUNDARIES & HEALTH
                if(Game.mode !== 'peaceful') {
                    const limit = 2000;
                    if(Math.abs(head.x) > limit || Math.abs(head.y) > limit) Game.die("You left the Red Zone!");
                    
                    // Self-Hit
                    for(let i=15; i<Game.snake.length; i++) {
                        if(Math.hypot(head.x - Game.snake[i].x, head.y - Game.snake[i].y) < 15) Game.die("Bitten tail!");
                    }

                    document.getElementById('hp-fill').style.width = Game.hp + "%";
                    if(Game.hp <= 0) Game.die("Out of Health!");
                }

                // 5. STORY MODE LOGIC
                if(Game.mode === 'story') {
                    if(Game.enemies.length < 5 && Math.random() < 0.03) {
                        Game.enemies.push(new Enemy(
                            head.x + 1000, 
                            head.y + (Math.random()*800-400), 
                            Game.level === 30 ? 'boss' : 'minion',
                            Game.level
                        ));
                    }

                    Game.enemies.forEach((e, ei) => {
                        e.update();
                        if(Math.hypot(head.x - e.x, head.y - e.y) < 40) {
                            Game.hp -= (e.type === 'boss' ? 30 : 15);
                            Game.enemies.splice(ei, 1);
                        }
                    });

                    Game.bullets.forEach((b, bi) => {
                        b.update();
                        Game.enemies.forEach((e, ei) => {
                            if(Math.hypot(b.x - e.x, b.y - e.y) < 45) {
                                e.hp--;
                                Game.bullets.splice(bi, 1);
                                if(e.hp <= 0) {
                                    Game.enemies.splice(ei, 1);
                                    Game.progress += (e.type === 'boss' ? 100 : 10);
                                    if(Game.progress >= 100) {
                                        Game.level++;
                                        Game.progress = 0;
                                        Game.save();
                                        document.getElementById('lvl-val').innerText = Game.level;
                                        if(Game.level > 30) alert("UNIVERSE CONQUERED!");
                                    }
                                }
                            }
                        });
                        if(b.life <= 0) Game.bullets.splice(bi, 1);
                    });

                    document.getElementById('prog-fill').style.width = Game.progress + "%";
                    document.getElementById('prog-pct').innerText = Game.progress + "%";
                }

                // 6. CAMERA
                Game.cam.x += (head.x - Game.width/2 - Game.cam.x) * 0.1;
                Game.cam.y += (head.y - Game.height/2 - Game.cam.y) * 0.1;

                // 7. NET SYNC
                if(Game.isMulti) Net.sendSync();
            },

            draw: () => {
                const ctx = Game.ctx;
                ctx.fillStyle = '#020208';
                ctx.fillRect(0,0,Game.width, Game.height);

                // Moon
                Game.drawMoon(ctx);

                ctx.save();
                ctx.translate(-Game.cam.x, -Game.cam.y);

                // Boundary
                if(Game.mode !== 'peaceful') {
                    ctx.strokeStyle = '#ff7675'; ctx.lineWidth = 10;
                    ctx.strokeRect(-2000, -2000, 4000, 4000);
                }

                // Stars
                Game.particles.forEach(p => p.draw(ctx, {x:Game.cam.x*0.5, y:Game.cam.y*0.5}));

                // Fruit
                ctx.fillStyle = '#ff7675';
                ctx.shadowBlur = 15; ctx.shadowColor = 'red';
                ctx.beginPath(); ctx.arc(Game.fruit.x, Game.fruit.y, 15, 0, 7); ctx.fill();
                ctx.shadowBlur = 0;

                // Other Player & Arrow
                if(Game.isMulti && Net.otherSnake.length) {
                    Game.drawSnake(Net.otherSnake, Net.otherSkin);
                    // RED ARROW
                    const dx = Net.otherSnake[0].x - Game.snake[0].x;
                    const dy = Net.otherSnake[0].y - Game.snake[0].y;
                    const arrowAng = Math.atan2(dy, dx);
                    
                    ctx.restore(); ctx.save();
                    ctx.translate(Game.width/2 + Math.cos(arrowAng)*100, Game.height/2 + Math.sin(arrowAng)*100);
                    ctx.rotate(arrowAng);
                    ctx.fillStyle = 'red';
                    ctx.beginPath(); ctx.moveTo(20, 0); ctx.lineTo(-10, 15); ctx.lineTo(-10, -15); ctx.fill();
                    ctx.restore(); ctx.save(); ctx.translate(-Game.cam.x, -Game.cam.y);
                }

                // Fireballs & Enemies
                Game.bullets.forEach(b => b.draw(ctx, {x:0, y:0}));
                Game.enemies.forEach(e => e.draw(ctx, {x:0, y:0}));

                // Local Snake
                Game.drawSnake(Game.snake, Game.config.skin, Game.angle);

                ctx.restore();
            },

            drawSnake: (body, skin, headAngle=0) => {
                const ctx = Game.ctx;
                const grad = ctx.createLinearGradient(body[0].x, body[0].y, body[body.length-1].x, body[body.length-1].y);
                grad.addColorStop(0, skin.a); grad.addColorStop(1, skin.b);
                
                ctx.strokeStyle = grad;
                ctx.lineWidth = 30;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                
                ctx.beginPath();
                for(let i=0; i<body.length; i++) {
                    const wiggle = Math.sin(Date.now()/200 + i*0.4) * 4;
                    ctx.lineTo(body[i].x + wiggle, body[i].y + wiggle);
                }
                ctx.stroke();

                // Eyes
                const h = body[0];
                ctx.fillStyle = 'white';
                ctx.beginPath(); ctx.arc(h.x + Math.cos(headAngle+0.5)*12, h.y + Math.sin(headAngle+0.5)*12, 6, 0, 7); ctx.fill();
                ctx.beginPath(); ctx.arc(h.x + Math.cos(headAngle-0.5)*12, h.y + Math.sin(headAngle-0.5)*12, 6, 0, 7); ctx.fill();
            },

            drawMoon: (ctx) => {
                ctx.fillStyle = '#dfe6e9';
                ctx.shadowBlur = 30; ctx.shadowColor = 'white';
                ctx.beginPath(); ctx.arc(Game.width-100, 100, 40, 0, 7); ctx.fill();
                ctx.shadowBlur = 0;
            },

            loop: () => {
                Game.update();
                Game.draw();
                requestAnimationFrame(Game.loop);
            }
        };

        // RUN
        window.onload = Game.init;

    </script>
</body>
</html>
