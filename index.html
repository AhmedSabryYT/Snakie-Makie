<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snakie Makie - StrikerJoy</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; background: #000b18; color: #00d4ff; font-family: 'Segoe UI', sans-serif; overflow: hidden; touch-action: none; }
        canvas { display: block; position: absolute; top: 0; left: 0; }
        .ui { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; pointer-events: none; text-align: center; }
        .panel { background: rgba(0, 15, 40, 0.9); border: 2px solid #00d4ff; padding: 25px; border-radius: 15px; pointer-events: auto; width: 280px; box-shadow: 0 0 30px rgba(0, 212, 255, 0.2); }
        button, input { background: #001d3d; border: 1px solid #00d4ff; color: #00d4ff; padding: 12px; margin: 8px; width: 100%; border-radius: 5px; font-weight: bold; }
        button:active { transform: scale(0.95); }
        #chat-ui { position: fixed; bottom: 10px; left: 10px; width: 200px; pointer-events: auto; z-index: 110; display: none; }
        #msgs { height: 70px; overflow-y: auto; background: rgba(0,0,0,0.6); font-size: 11px; padding: 5px; color: #fff; }
        .hidden { display: none !important; }
        #colorPicker { width: 100%; height: 40px; border: none; cursor: pointer; }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="menu" class="ui">
    <div class="panel">
        <h1 style="margin:0; font-size: 28px;">SNAKIE MAKIE</h1>
        <p style="font-size:10px; margin-bottom:20px;">STRIKERJOY STUDIOS</p>
        
        <p>💰 COINS: <span id="coin-count">0</span></p>
        
        <button onclick="startGame(false)">SINGLE PLAYER</button>
        <button onclick="showMulti()">MULTIPLAYER</button>
        <button onclick="showCustomizer()">CHANGE COLOR (10 💰)</button>
        
        <div style="font-size: 9px; margin-top: 20px; opacity: 0.6;">Ahmed Sabry --- StrikerJoy Studios</div>
    </div>
</div>

<div id="customizer" class="ui hidden">
    <div class="panel">
        <h3>CHOOSE SKIN COLOR</h3>
        <input type="color" id="colorPicker" value="#00d4ff">
        <button onclick="applyColor()">APPLY & SAVE</button>
        <button onclick="closeUI()" style="background:transparent; border:none;">BACK</button>
    </div>
</div>

<div id="multi-panel" class="ui hidden">
    <div class="panel">
        <p>YOUR ROOM PIN: <b id="my-pin">----</b></p>
        <input type="number" id="join-pin" placeholder="FRIEND'S PIN">
        <button onclick="startJoin()">JOIN ROOM</button>
        <button onclick="closeUI()" style="background:transparent;">BACK</button>
    </div>
</div>

<div id="chat-ui">
    <div id="msgs"></div>
    <input type="text" id="chat-in" placeholder="Message..." onkeypress="if(event.key==='Enter') sendChat()">
</div>

<script>
    const canvas = document.getElementById('gameCanvas'), ctx = canvas.getContext('2d');
    let peer, conn, isPlaying = false, isMulti = false, angle = 0;
    let mySnake = [], otherSnake = [], fruit = {x: 200, y: 200};
    
    // DATA PERSISTENCE
    let data = JSON.parse(localStorage.getItem('snakie_pro')) || { coins: 0, skin: '#00d4ff' };
    const badWords = ['harmful', 'badword1', 'badword2']; // Add more here

    function save() { localStorage.setItem('snakie_pro', JSON.stringify(data)); document.getElementById('coin-count').innerText = data.coins; }
    save();

    // ENVIRONMENT ELEMENTS
    let stars = [], breezes = [];
    function initEnv() {
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        stars = Array(80).fill(0).map(() => ({x: Math.random()*canvas.width, y: Math.random()*canvas.height, s: Math.random()*2}));
        breezes = Array(10).fill(0).map(() => ({x: Math.random()*canvas.width, y: Math.random()*canvas.height, l: 30 + Math.random()*50}));
    }
    initEnv();

    // PEER SETUP
    const pin = Math.floor(1000 + Math.random()*9000).toString();
    peer = new Peer('snakie-' + pin);
    peer.on('open', () => document.getElementById('my-pin').innerText = pin);
    peer.on('connection', c => { conn = c; isMulti = true; setupConn(); startGame(true); });

    function setupConn() {
        conn.on('data', d => {
            if(d.type === 'move') { otherSnake = d.body; otherSkin = d.color; }
            if(d.type === 'chat') addMsg("Friend: " + censor(d.txt));
        });
    }

    function startJoin() {
        const p = document.getElementById('join-pin').value;
        conn = peer.connect('snakie-' + p);
        isMulti = true; setupConn(); startGame(true);
    }

    function startGame(multi) {
        isMulti = multi;
        mySnake = Array(15).fill(0).map((_,i) => ({x: canvas.width/2, y: canvas.height/2 + i*2}));
        isPlaying = true;
        document.getElementById('menu').classList.add('hidden');
        document.getElementById('multi-panel').classList.add('hidden');
        if(isMulti) document.getElementById('chat-ui').style.display = 'block';
    }

    function showMulti() { document.getElementById('menu').classList.add('hidden'); document.getElementById('multi-panel').classList.remove('hidden'); }
    function showCustomizer() { document.getElementById('menu').classList.add('hidden'); document.getElementById('customizer').classList.remove('hidden'); }
    function closeUI() { document.querySelectorAll('.ui').forEach(u => u.classList.add('hidden')); document.getElementById('menu').classList.remove('hidden'); }

    function applyColor() {
        if(data.coins >= 10) {
            data.coins -= 10;
            data.skin = document.getElementById('colorPicker').value;
            save();
            alert("Color Changed!");
            closeUI();
        } else { alert("Need 10 coins!"); }
    }

    function censor(text) {
        let regex = new RegExp(badWords.join('|'), 'gi');
        return text.replace(regex, "****");
    }

    function sendChat() {
        const i = document.getElementById('chat-in');
        if(!i.value) return;
        let clean = censor(i.value);
        addMsg("You: " + clean);
        if(conn) conn.send({type:'chat', txt: clean});
        i.value = '';
    }

    function addMsg(t) { const m = document.getElementById('msgs'); m.innerHTML += `<div>${t}</div>`; m.scrollTop = m.scrollHeight; }

    window.addEventListener('touchmove', e => {
        angle = Math.atan2(e.touches[0].clientY - window.innerHeight/2, e.touches[0].clientX - window.innerWidth/2);
    });

    function drawFruit(x, y) {
        // Draw Apple using Canvas
        ctx.fillStyle = '#ff3333';
        ctx.beginPath(); ctx.arc(x, y, 10, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#44ff44'; // Leaf
        ctx.fillRect(x-2, y-14, 4, 6);
    }

    function drawMoon() {
        ctx.fillStyle = '#fdfdfd';
        ctx.shadowBlur = 30; ctx.shadowColor = '#fff';
        ctx.beginPath(); ctx.arc(80, 80, 30, 0, Math.PI*2); ctx.fill();
        ctx.shadowBlur = 0;
    }

    function loop() {
        ctx.fillStyle = '#000b18'; ctx.fillRect(0,0,canvas.width,canvas.height);
        
        // Stars & Moon
        ctx.fillStyle = "white";
        stars.forEach(s => { ctx.beginPath(); ctx.arc(s.x, s.y, s.s, 0, 7); ctx.fill(); });
        drawMoon();

        // Breeze Animation
        ctx.strokeStyle = "rgba(255,255,255,0.05)";
        breezes.forEach(b => {
            ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x + b.l, b.y); ctx.stroke();
            b.x += 1; if(b.x > canvas.width) b.x = -b.l;
        });

        if(isPlaying) {
            // Smooth slow movement (Speed 1.8)
            const head = { x: mySnake[0].x + Math.cos(angle)*1.8, y: mySnake[0].y + Math.sin(angle)*1.8 };
            
            // Wall Wrap
            if(head.x<0) head.x=canvas.width; if(head.x>canvas.width) head.x=0;
            if(head.y<0) head.y=canvas.height; if(head.y>canvas.height) head.y=0;

            mySnake.unshift(head);
            if(Math.hypot(head.x - fruit.x, head.y - fruit.y) < 15) {
                fruit = {x: 50 + Math.random()*(canvas.width-100), y: 50 + Math.random()*(canvas.height-100)};
                data.coins++; save();
            } else { mySnake.pop(); }

            if(isMulti && conn) conn.send({type:'move', body:mySnake, color:data.skin});

            // Draw Snakes
            ctx.lineWidth = 14; ctx.lineCap = 'round';
            if(isMulti && otherSnake.length) {
                ctx.strokeStyle = '#ff0055'; ctx.beginPath(); otherSnake.forEach(p => ctx.lineTo(p.x, p.y)); ctx.stroke();
            }
            ctx.strokeStyle = data.skin; ctx.beginPath(); mySnake.forEach(p => ctx.lineTo(p.x, p.y)); ctx.stroke();
            
            drawFruit(fruit.x, fruit.y);
        }
        requestAnimationFrame(loop);
    }
    let otherSkin = '#ff0055';
    loop();
    window.onresize = initEnv;
</script>
</body>
</html>
