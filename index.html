<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snakie Makie - Room Code</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; background: #0b0b0b; color: #00ffcc; font-family: 'Courier New', monospace; overflow: hidden; touch-action: none; }
        canvas { display: block; }
        .menu, .pop-up { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; }
        input, button { background: #111; border: 2px solid #00ffcc; color: #00ffcc; padding: 15px; margin: 10px; border-radius: 8px; font-size: 20px; width: 200px; text-align: center; }
        button { background: #00ffcc; color: #000; font-weight: bold; cursor: pointer; }
        #countdown { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 100px; z-index: 50; text-shadow: 0 0 20px #00ffcc; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="countdown" class="hidden"></div>

<div id="menu" class="menu">
    <h1>SNAKIE MAKIE</h1>
    <p>GAME PIN:</p>
    <h1 id="display-id" style="font-size: 50px; margin: 0; letter-spacing: 5px;">----</h1>
    <hr style="width: 80%; border: 0.5px solid #333; margin: 20px;">
    <input type="number" id="join-id" placeholder="0000" pattern="\d*">
    <button onclick="startJoin()">JOIN ROOM</button>
</div>

<div id="game-over" class="pop-up hidden">
    <h1 id="status-msg">ELIMINATED</h1>
    <button onclick="location.reload()">PLAY AGAIN</button>
</div>

<canvas id="c"></canvas>

<script>
    const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
    let peer, conn, isPlaying = false, canMove = false, angle = 0;
    let mySnake = [], otherSnake = [], fruit = {x: 150, y: 150};

    // Generate a 4-digit Kahoot-style Pin
    const roomPin = Math.floor(1000 + Math.random() * 9000).toString();
    // We use a prefix so your code doesn't clash with other people's games
    peer = new Peer('snakie-' + roomPin);

    peer.on('open', id => { 
        document.getElementById('display-id').innerText = roomPin; 
    });

    peer.on('error', err => {
        if(err.type === 'unavailable-id') location.reload(); // Refresh if PIN taken
    });

    peer.on('connection', c => {
        conn = c;
        setupConn();
        // Host tells Joiner to start
        conn.on('open', () => {
            conn.send({type: 'start-sync'});
            preStart();
        });
    });

    function startJoin() {
        const pin = document.getElementById('join-id').value;
        conn = peer.connect('snakie-' + pin);
        setupConn();
    }

    function setupConn() {
        conn.on('data', data => {
            if(data.type === 'start-sync') preStart();
            if(data.type === 'move') otherSnake = data.body;
            if(data.type === 'dead') win();
        });
    }

    function preStart() {
        document.getElementById('menu').classList.add('hidden');
        document.getElementById('game-over').classList.add('hidden');
        mySnake = Array(15).fill({x: window.innerWidth/2, y: window.innerHeight/2});
        isPlaying = true;
        
        let count = 3;
        const cd = document.getElementById('countdown');
        cd.classList.remove('hidden');
        const timer = setInterval(() => {
            cd.innerText = count || "GO!";
            if(count <= 0) {
                clearInterval(timer);
                setTimeout(() => cd.classList.add('hidden'), 500);
                canMove = true;
            }
            count--;
        }, 1000);
    }

    function die() {
        if(!canMove) return;
        isPlaying = false; canMove = false;
        document.getElementById('status-msg').innerText = "ELIMINATED";
        document.getElementById('game-over').classList.remove('hidden');
        if(conn) conn.send({type: 'dead'});
    }

    function win() {
        isPlaying = false; canMove = false;
        document.getElementById('status-msg').innerText = "YOU WON!";
        document.getElementById('game-over').classList.remove('hidden');
    }

    window.addEventListener('touchmove', e => {
        const t = e.touches[0];
        angle = Math.atan2(t.clientY - window.innerHeight/2, t.clientX - window.innerWidth/2);
    });

    function loop() {
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        ctx.fillStyle = '#0b0b0b'; ctx.fillRect(0,0,canvas.width,canvas.height);

        if(isPlaying) {
            if(canMove) {
                const head = { x: mySnake[0].x + Math.cos(angle)*3, y: mySnake[0].y + Math.sin(angle)*3 };
                if(head.x < 0 || head.x > canvas.width || head.y < 0 || head.y > canvas.height) die();
                mySnake.unshift(head);
                mySnake.pop();
            }
            if(conn && conn.open) conn.send({type: 'move', body: mySnake});

            ctx.lineWidth = 15; ctx.lineCap = 'round';
            ctx.strokeStyle = '#ff0055'; ctx.beginPath(); otherSnake.forEach(p => ctx.lineTo(p.x, p.y)); ctx.stroke();
            ctx.strokeStyle = '#00ffcc'; ctx.beginPath(); mySnake.forEach(p => ctx.lineTo(p.x, p.y)); ctx.stroke();
        }
        requestAnimationFrame(loop);
    }
    loop();
</script>
</body>
</html>
