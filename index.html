<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SNAKIE: ETERNAL</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --accent: #a29bfe; --danger: #ff7675; --bg: #020208; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; overflow: hidden; touch-action: none; }
        canvas { display: block; position: fixed; inset: 0; }

        /* HUD & UI */
        .hud-layer { position: fixed; top: 0; left: 0; right: 0; padding: 20px; pointer-events: none; display: flex; justify-content: space-between; z-index: 50; }
        .stat-box { background: rgba(0, 0, 0, 0.6); padding: 10px 20px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(4px); font-weight: bold; display: flex; align-items: center; gap: 10px; }
        
        /* Health Bar */
        #health-container { position: fixed; top: 70px; left: 20px; width: 200px; height: 20px; background: rgba(0,0,0,0.5); border-radius: 10px; border: 2px solid #555; overflow: hidden; display: none; z-index: 50; }
        #health-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #ff7675, #d63031); transition: width 0.2s; }

        /* Controls */
        #fire-btn { 
            position: fixed; bottom: 40px; right: 40px; width: 80px; height: 80px; 
            background: radial-gradient(circle, #e17055, #d63031); 
            border: 4px solid rgba(255,255,255,0.4); border-radius: 50%; 
            color: white; font-weight: 900; z-index: 100; display: none; 
            pointer-events: auto; box-shadow: 0 0 25px #d63031;
            font-size: 14px; letter-spacing: 1px;
        }
        
        /* Menus */
        .overlay { position: fixed; inset: 0; background: rgba(2, 2, 8, 0.85); display: flex; align-items: center; justify-content: center; z-index: 200; backdrop-filter: blur(10px); transition: opacity 0.3s; }
        .panel { background: rgba(20, 20, 35, 0.95); border: 1px solid #445; padding: 30px; border-radius: 24px; width: 340px; text-align: center; box-shadow: 0 0 60px rgba(0,0,0,0.8); position: relative; }
        
        h1 { margin: 0 0 10px; color: var(--accent); letter-spacing: 5px; text-shadow: 0 0 20px var(--accent); font-size: 32px; }
        h3 { margin: 0 0 20px; color: #889; font-weight: 400; font-size: 14px; }
        
        button { 
            background: linear-gradient(145deg, #1e1e30, #161625); 
            border: 1px solid #334; color: #fff; padding: 15px; margin: 8px 0; width: 100%; 
            border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 16px; 
            transition: 0.2s; 
        }
        button:hover { border-color: var(--accent); transform: translateY(-2px); background: #252545; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        input[type="text"], input[type="number"] { background: #0a0a15; border: 1px solid #445; color: #fff; padding: 12px; width: 100%; border-radius: 8px; margin-bottom: 10px; text-align: center; font-size: 18px; }
        
        /* Chat */
        #chat-wrap { position: fixed; bottom: 20px; left: 20px; width: 300px; z-index: 150; pointer-events: none; }
        #chat-log { height: 150px; overflow-y: auto; display: flex; flex-direction: column; justify-content: flex-end; mask-image: linear-gradient(to bottom, transparent, black 20%); }
        .msg { background: rgba(0,0,0,0.6); padding: 5px 10px; margin: 2px 0; border-radius: 5px; font-size: 13px; color: #ddd; width: fit-content; }
        #chat-input { pointer-events: auto; width: 100%; background: rgba(20,20,30,0.9); border: 1px solid #445; color: white; padding: 10px; border-radius: 8px; margin-top: 5px; display: none; }

        .hidden { display: none !important; opacity: 0; pointer-events: none; }
    </style>
</head>
<body>

<canvas id="g"></canvas>

<div class="hud-layer">
    <div class="stat-box">💎 <span id="gem-ui">0</span></div>
    <div class="stat-box" id="level-ui" style="display:none">LVL <span id="lvl-val">1</span></div>
</div>
<div id="health-container"><div id="health-fill"></div></div>
<button id="fire-btn" onmousedown="fire()" ontouchstart="fire()">BLAST</button>

<div id="chat-wrap">
    <div id="chat-log"></div>
    <input type="text" id="chat-input" placeholder="Type message...">
</div>

<div id="m-main" class="overlay">
    <div class="panel">
        <h1>SNAKIE</h1>
        <h3>ETERNAL EDITION</h3>
        <button onclick="toModeSel(false)">SINGLE PLAYER</button>
        <button onclick="toModeSel(true)">MULTIPLAYER</button>
        <button onclick="toggle('m-skin')">CUSTOMIZE</button>
    </div>
</div>

<div id="m-modes" class="overlay hidden">
    <div class="panel">
        <h2 id="mode-title">SELECT MODE</h2>
        <button onclick="startGame('peaceful')">PEACEFUL</button>
        <button onclick="startGame('normal')">NORMAL (SURVIVAL)</button>
        <button id="btn-story" onclick="startGame('story')">STORY (30 LVLS)</button>
        <button onclick="toggle('m-main')" style="margin-top:20px; border:none; background:transparent; color:#889;">BACK</button>
    </div>
</div>

<div id="m-multi" class="overlay hidden">
    <div class="panel">
        <h2>MULTIPLAYER SETUP</h2>
        <p>Your ID: <strong id="my-pin" style="color:var(--accent); font-size:24px;">...</strong></p>
        <input type="number" id="friend-pin" placeholder="Enter Friend ID">
        <button onclick="connectPeer()">CONNECT</button>
        <button onclick="toggle('m-main')">BACK</button>
    </div>
</div>

<div id="m-skin" class="overlay hidden">
    <div class="panel">
        <h2>SKIN SHOP</h2>
        <div style="display:flex; gap:10px; margin:20px 0;">
            <input type="color" id="c1" value="#a29bfe" style="height:50px; flex:1; border:none; border-radius:8px;">
            <input type="color" id="c2" value="#6c5ce7" style="height:50px; flex:1; border:none; border-radius:8px;">
        </div>
        <p style="font-size:12px; color:#aaa;">Costs 10 Gems</p>
        <button onclick="saveSkin()">APPLY SKIN</button>
        <button onclick="toggle('m-main')">CANCEL</button>
    </div>
</div>

<div id="m-dead" class="overlay hidden">
    <div class="panel">
        <h1 style="color:var(--danger)">YOU DIED</h1>
        <p id="death-msg">Game Over</p>
        <button onclick="location.reload()">MAIN MENU</button>
    </div>
</div>

<script>
/** * SNAKIE ETERNAL CORE
 * Contains: Detailed Rendering, PeerJS Multiplayer, Persistent Story, Health System
 */

const cvs = document.getElementById('g');
const ctx = cvs.getContext('2d');

// --- GAME STATE ---
const game = {
    active: false,
    mode: 'peaceful', // peaceful, normal, story
    multi: false,
    width: 0, height: 0,
    cam: {x:0, y:0},
    gems: 0,
    skin: {a:'#a29bfe', b:'#6c5ce7'},
    
    // Story Data
    level: 1,
    storyProg: 0, // 0 to 100
    
    // Physics
    snake: [],
    angle: 0,
    targetAngle: 0,
    
    // Entities
    fruit: {x:0, y:0},
    enemies: [],
    fireballs: [],
    parts: [], // particles
    
    // Stats
    hp: 100,
    maxHp: 100
};

// --- MULTIPLAYER VARS ---
let peer, conn;
let otherSnake = [];
let otherSkin = {a:'#fff', b:'#fff'};
let lastMultiUpdate = 0;

// --- INITIALIZATION & SAVING ---
function init() {
    // Load Save
    const save = JSON.parse(localStorage.getItem('snakie_save_v4') || '{}');
    game.gems = save.gems || 0;
    game.skin = save.skin || game.skin;
    game.level = save.level || 1; // RESTORES LEVEL ON REFRESH
    
    document.getElementById('gem-ui').innerText = game.gems;
    document.getElementById('c1').value = game.skin.a;
    document.getElementById('c2').value = game.skin.b;
    
    resize();
    window.addEventListener('resize', resize);
    requestAnimationFrame(loop);
}

function saveGame() {
    localStorage.setItem('snakie_save_v4', JSON.stringify({
        gems: game.gems,
        skin: game.skin,
        level: game.level
    }));
}

function resize() {
    game.width = window.innerWidth;
    game.height = window.innerHeight;
    cvs.width = game.width;
    cvs.height = game.height;
}

// --- UI FUNCTIONS ---
function toggle(id) {
    document.querySelectorAll('.overlay').forEach(o => o.classList.add('hidden'));
    if(id) document.getElementById(id).classList.remove('hidden');
}

function toModeSel(isMulti) {
    game.multi = isMulti;
    document.getElementById('btn-story').style.display = isMulti ? 'none' : 'block'; // No Story in Multi
    
    if(isMulti) {
        initPeer();
        toggle('m-multi');
    } else {
        toggle('m-modes');
    }
}

function saveSkin() {
    if(game.gems >= 10) {
        game.gems -= 10;
        game.skin.a = document.getElementById('c1').value;
        game.skin.b = document.getElementById('c2').value;
        saveGame();
        document.getElementById('gem-ui').innerText = game.gems;
        toggle('m-main');
    } else {
        alert("Need 10 Gems!");
    }
}

function addMsg(txt, color='#fff') {
    const log = document.getElementById('chat-log');
    const d = document.createElement('div');
    d.className = 'msg';
    d.style.color = color;
    d.innerText = txt;
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
}

// --- PEERJS LOGIC ---
function initPeer() {
    const id = Math.floor(Math.random() * 9000) + 1000;
    peer = new Peer('snakie_' + id);
    peer.on('open', (id) => {
        document.getElementById('my-pin').innerText = id.split('_')[1];
    });
    peer.on('connection', (c) => {
        conn = c;
        setupConn();
        toggle('m-modes'); // Go to mode select after connecting
    });
}

function connectPeer() {
    const pid = document.getElementById('friend-pin').value;
    if(!pid) return;
    conn = peer.connect('snakie_' + pid);
    conn.on('open', () => {
        setupConn();
        toggle('m-modes');
    });
}

function setupConn() {
    addMsg("Connected to friend!", "#a29bfe");
    conn.on('data', (d) => {
        if(d.t === 'm') { // Movement
            otherSnake = d.snk;
            otherSkin = d.skn;
        } else if (d.t === 'c') { // Chat
            addMsg("Friend: " + d.msg, "#fab1a0");
        } else if (d.t === 'start') { // Sync Start
            startGame(d.mode, true);
        }
    });
}

// --- GAME LOGIC ---
function startGame(mode, fromRemote=false) {
    game.mode = mode;
    game.active = true;
    game.snake = Array(20).fill({x:0, y:0});
    game.hp = 100;
    game.storyProg = 0;
    game.enemies = [];
    game.fireballs = [];
    
    toggle(null); // Hide menus
    
    // Mode Specific Setup
    if(mode === 'story') {
        document.getElementById('level-ui').style.display = 'block';
        document.getElementById('lvl-val').innerText = game.level;
        document.getElementById('fire-btn').style.display = 'block';
        document.getElementById('health-container').style.display = 'block';
    } else if (mode === 'normal') {
        document.getElementById('health-container').style.display = 'block';
        document.getElementById('fire-btn').style.display = 'none';
    } else {
        // Peaceful
        document.getElementById('health-container').style.display = 'none';
        document.getElementById('fire-btn').style.display = 'none';
    }

    if(game.multi && conn && !fromRemote) {
        conn.send({t:'start', mode: mode});
    }
    
    spawnFruit();
    
    // Spawn breeze/stars
    for(let i=0; i<50; i++) game.parts.push({
        x: Math.random()*2000-1000, 
        y: Math.random()*2000-1000, 
        s: Math.random()*2, 
        a: Math.random()
    });
}

function spawnFruit() {
    const head = game.snake[0] || {x:0,y:0};
    game.fruit = {
        x: head.x + (Math.random()*1000 - 500),
        y: head.y + (Math.random()*1000 - 500)
    };
}

function die(reason) {
    game.active = false;
    document.getElementById('death-msg').innerText = reason;
    toggle('m-dead');
}

function fire() {
    if(game.mode !== 'story') return;
    const head = game.snake[0];
    game.fireballs.push({
        x: head.x, y: head.y,
        vx: Math.cos(game.angle)*15, vy: Math.sin(game.angle)*15,
        life: 60
    });
}

// --- UPDATE LOOP ---
window.addEventListener('touchmove', e => {
    const t = e.touches[0];
    game.targetAngle = Math.atan2(t.clientY - game.height/2, t.clientX - game.width/2);
});
window.addEventListener('mousemove', e => {
    game.targetAngle = Math.atan2(e.clientY - game.height/2, e.clientX - game.width/2);
});

// Chat Input Key
window.addEventListener('keydown', e => {
    if(e.key === 'Enter') {
        const inp = document.getElementById('chat-input');
        if(inp.style.display === 'block') {
            if(inp.value && conn) {
                conn.send({t:'c', msg: inp.value});
                addMsg("Me: " + inp.value, "#a29bfe");
            }
            inp.value = ''; inp.style.display = 'none';
        } else {
            inp.style.display = 'block'; inp.focus();
        }
    }
});

function loop() {
    requestAnimationFrame(loop);
    
    // Render Background
    ctx.fillStyle = game.active ? '#020208' : '#050510';
    ctx.fillRect(0, 0, game.width, game.height);
    
    drawMoon();
    
    if(!game.active) return;
    
    // Logic
    const head = game.snake[0];
    
    // Smooth Turn
    let diff = game.targetAngle - game.angle;
    while(diff < -Math.PI) diff += Math.PI*2;
    while(diff > Math.PI) diff -= Math.PI*2;
    game.angle += diff * 0.1;
    
    // Move
    const speed = 5;
    const newHead = {
        x: head.x + Math.cos(game.angle) * speed,
        y: head.y + Math.sin(game.angle) * speed
    };
    game.snake.unshift(newHead);
    
    // Fruit Collision
    if(Math.hypot(newHead.x - game.fruit.x, newHead.y - game.fruit.y) < 30) {
        game.gems++;
        document.getElementById('gem-ui').innerText = game.gems;
        spawnFruit();
        saveGame();
    } else {
        game.snake.pop();
    }
    
    // Camera Follow
    game.cam.x += (newHead.x - game.width/2 - game.cam.x) * 0.1;
    game.cam.y += (newHead.y - game.height/2 - game.cam.y) * 0.1;
    
    // --- MODE SPECIFIC LOGIC ---
    
    // Normal/Story Boundary
    if(game.mode !== 'peaceful') {
        const limit = 1500;
        if(Math.abs(newHead.x) > limit || Math.abs(newHead.y) > limit) die("You left the safe zone!");
        
        // Update Health UI
        document.getElementById('health-fill').style.width = game.hp + "%";
        if(game.hp <= 0) die("You took too much damage!");
    }
    
    // Story Logic
    if(game.mode === 'story') {
        // Spawn Enemies
        if(game.enemies.length < 5 + (game.level * 0.5) && Math.random() < 0.05) {
            game.enemies.push({
                x: newHead.x + 1000, 
                y: newHead.y + (Math.random()*800-400),
                hp: 1, 
                type: game.level === 30 ? 'boss' : 'mob',
                offset: Math.random() * 10
            });
        }
        
        // Enemy Logic
        for(let i = game.enemies.length - 1; i >= 0; i--) {
            let e = game.enemies[i];
            e.x -= (2 + (game.level * 0.1)); // Gets faster
            
            // Hit Player?
            if(Math.hypot(e.x - newHead.x, e.y - newHead.y) < 40) {
                game.hp -= (game.level === 30 ? 25 : 15); // 5-7 hits to die
                game.enemies.splice(i, 1);
                continue;
            }
            
            // Hit by Fireball?
            for(let f = game.fireballs.length - 1; f >= 0; f--) {
                let fb = game.fireballs[f];
                if(Math.hypot(e.x - fb.x, e.y - fb.y) < 50) {
                    game.fireballs.splice(f, 1);
                    game.enemies.splice(i, 1);
                    game.storyProg += 5;
                    if(game.storyProg >= 100) {
                        game.level++;
                        game.storyProg = 0;
                        saveGame();
                        document.getElementById('lvl-val').innerText = game.level;
                        if(game.level > 30) die("YOU BEAT THE GAME! LEGEND!");
                    }
                    break;
                }
            }
            
            // Cleanup offscreen
            if(e.x < newHead.x - 1000) game.enemies.splice(i, 1);
        }
        
        // Fireball Logic
        for(let f = game.fireballs.length - 1; f >= 0; f--) {
            let fb = game.fireballs[f];
            fb.x += fb.vx; fb.y += fb.vy;
            fb.life--;
            if(fb.life <= 0) game.fireballs.splice(f, 1);
        }
    }
    
    // Multiplayer Sync
    if(game.multi && conn && conn.open) {
        const now = Date.now();
        if(now - lastMultiUpdate > 50) { // Limit to 20fps net update
            conn.send({t:'m', snk: game.snake, skn: game.skin});
            lastMultiUpdate = now;
        }
    }

    // --- DRAWING ---
    ctx.save();
    ctx.translate(-game.cam.x, -game.cam.y);
    
    // Draw Breeze Particles
    game.parts.forEach(p => {
        let px = (p.x + game.cam.x*0.5) % 3000;
        let py = (p.y + game.cam.y*0.5) % 3000;
        ctx.fillStyle = `rgba(255,255,255,${p.a * 0.5})`;
        ctx.beginPath(); ctx.arc(newHead.x + px - 1500, newHead.y + py - 1500, p.s, 0, Math.PI*2); ctx.fill();
    });
    
    // Draw Border (Red Zone)
    if(game.mode !== 'peaceful') {
        ctx.strokeStyle = '#ff7675'; ctx.lineWidth = 4;
        ctx.setLineDash([20, 20]);
        ctx.strokeRect(-1500, -1500, 3000, 3000);
        ctx.setLineDash([]);
    }
    
    // Draw Enemies (Detailed Canvas)
    game.enemies.forEach(e => drawDetailedEnemy(e));
    
    // Draw Fireballs
    game.fireballs.forEach(f => {
        ctx.fillStyle = '#fab1a0';
        ctx.shadowBlur = 15; ctx.shadowColor = '#e17055';
        ctx.beginPath(); ctx.arc(f.x, f.y, 10, 0, Math.PI*2); ctx.fill();
        ctx.shadowBlur = 0;
    });

    // Draw Other Player (Multiplayer)
    if(game.multi && otherSnake.length) drawSnake(otherSnake, otherSkin, true);
    
    // Draw Self
    drawSnake(game.snake, game.skin, false);
    
    // Draw Fruit
    drawDetailedFruit(game.fruit.x, game.fruit.y);
    
    ctx.restore();
}

// --- RENDER HELPERS ---

function drawDetailedEnemy(e) {
    ctx.save();
    ctx.translate(e.x, e.y);
    
    // Boss Scaling
    const s = e.type === 'boss' ? 3 : 1;
    ctx.scale(s, s);
    
    // Spiky Body
    ctx.fillStyle = '#d63031';
    ctx.beginPath();
    for(let i=0; i<8; i++) {
        const a = (i/8)*Math.PI*2 + (Date.now()/500); // Spin
        const r = 20 + (i%2===0 ? 5 : -5); // Spikes
        ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r);
    }
    ctx.closePath();
    ctx.fill();
    
    // Glowing Eyes
    ctx.fillStyle = '#fff';
    ctx.shadowBlur = 10; ctx.shadowColor = '#ffeaa7';
    ctx.beginPath(); ctx.arc(-8, -5, 4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(8, -5, 4, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    
    // Angry Eyebrows
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-12,-10); ctx.lineTo(-4,-4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(12,-10); ctx.lineTo(4,-4); ctx.stroke();
    
    ctx.restore();
}

function drawSnake(body, skin, isOther) {
    if(!body.length) return;
    
    // Gradient Body
    const grad = ctx.createLinearGradient(body[0].x, body[0].y, body[body.length-1].x, body[body.length-1].y);
    grad.addColorStop(0, skin.a); grad.addColorStop(1, skin.b);
    
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.lineWidth = 26;
    ctx.strokeStyle = grad;
    
    ctx.beginPath();
    body.forEach(p => ctx.lineTo(p.x, p.y));
    ctx.stroke();
    
    // Detailed Head (Eyes)
    const h = body[0];
    const ang = game.angle; // Note: For other player, we might want to calculate angle from p0-p1
    
    ctx.save();
    ctx.translate(h.x, h.y);
    // If it's the other player, we estimate rotation, else use our angle
    ctx.rotate(isOther ? 0 : ang); 
    
    // Eyes
    const drawEye = (yOff) => {
        ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(6, yOff, 6, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = 'black'; ctx.beginPath(); ctx.arc(8, yOff, 3, 0, Math.PI*2); ctx.fill(); // Pupil
        ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(7, yOff-1, 1.5, 0, Math.PI*2); ctx.fill(); // Shine
    };
    drawEye(-5);
    drawEye(5);
    
    ctx.restore();
}

function drawDetailedFruit(x, y) {
    ctx.save();
    ctx.translate(x, y);
    // Glow
    ctx.shadowColor = '#ff7675'; ctx.shadowBlur = 15;
    // Apple Body
    ctx.fillStyle = '#ff4d4d';
    ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    // Leaf
    ctx.fillStyle = '#55efc4';
    ctx.beginPath(); ctx.ellipse(4, -12, 6, 3, 0.5, 0, Math.PI*2); ctx.fill();
    ctx.restore();
}

function drawMoon() {
    ctx.save();
    // Static position on screen
    const mx = game.width - 120, my = 120;
    
    // Moon Glow
    const g = ctx.createRadialGradient(mx, my, 20, mx, my, 60);
    g.addColorStop(0, '#dfe6e9'); g.addColorStop(1, 'transparent');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(mx, my, 60, 0, Math.PI*2); ctx.fill();
    
    // Moon Body
    ctx.fillStyle = '#b2bec3'; ctx.beginPath(); ctx.arc(mx, my, 40, 0, Math.PI*2); ctx.fill();
    
    // Craters
    ctx.fillStyle = '#636e72';
    [[10, -5, 6], [-15, 10, 8], [5, 20, 4]].forEach(c => {
        ctx.beginPath(); ctx.arc(mx+c[0], my+c[1], c[2], 0, Math.PI*2); ctx.fill();
    });
    ctx.restore();
}

// Start Up
init();

</script>
</body>
</html>
