<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snakie Makie - StrikerJoy</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; background: #000; color: #0f0; font-family: 'Courier New', monospace; overflow: hidden; touch-action: none; }
        canvas { display: block; }
        .menu, .screen { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; }
        .btn { background: #000; border: 2px solid #0f0; color: #0f0; padding: 12px; margin: 8px; width: 240px; font-weight: bold; text-transform: uppercase; cursor: pointer; box-shadow: 0 0 10px #0f0; }
        .footer { position: absolute; bottom: 20px; font-size: 10px; letter-spacing: 2px; }
        .coin-display { position: absolute; top: 20px; font-size: 18px; color: #ff0; }
        #chat-ui { position: fixed; bottom: 10px; left: 10px; z-index: 60; width: 200px; background: rgba(0,20,0,0.8); border: 1px solid #0f0; display: none; }
        .hidden { display: none !important; }
        .shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; }
        .tab-btn { width: 115px; font-size: 12px; }
    </style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<div id="menu" class="menu">
    <div class="coin-display">💰 COINS: <span id="menu-coins">0</span></div>
    <h1 style="font-size: 40px; margin: 0; text-shadow: 0 0 20px #0f0;">SNAKIE MAKIE</h1>
    <p id="pin-display">PIN: ----</p>
    
    <button class="btn" onclick="startSingle()">Single Player</button>
    <button class="btn" onclick="showMulti()">Multiplayer</button>
    <button class="btn" onclick="showShop()">Shop</button>

    <div class="footer">Ahmed Sabry ----- StrikerJoy Studios</div>
</div>

<div id="multi-menu" class="screen hidden">
    <input type="number" id="join-id" placeholder="ENTER ROOM PIN" style="background:#000; border:1px solid #0f0; color:#0f0; padding:10px; text-align:center;">
    <button class="btn" onclick="startJoin()">Connect to Friend</button>
    <button class="btn" onclick="hideScreens()">Back</button>
</div>

<div id="shop" class="screen hidden">
    <h2>STRIKERJOY SHOP</h2>
    <div id="shop-tabs">
        <button class="btn tab-btn" onclick="showTab('skins')">Skins</button>
        <button class="btn tab-btn" onclick="showTab('potions')">Potions</button>
    </div>
    <div id="shop-content" class="shop-grid"></div>
    <button class="btn" onclick="hideScreens()">Exit Shop</button>
</div>

<div id="chat-ui">
    <div id="msgs" style="height:60px; overflow-y:auto; font-size:10px; padding:5px;"></div>
    <input type="text" id="chat-in" style="width:100%; background:#000; color:#0f0; border:none; border-top:1px solid #0f0;" placeholder="Say something..." onkeypress="if(event.key==='Enter') sendChat()">
</div>

<canvas id="c"></canvas>

<script>
    const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
    const bgCanvas = document.getElementById('bgCanvas'), bgCtx = bgCanvas.getContext('2d');
    let peer, conn, isPlaying = false, isMulti = false, angle = 0;
    let mySnake = [], otherSnake = [], fruit = {x: 100, y: 100};

    // --- DATA SAVING ---
    let data = JSON.parse(localStorage.getItem('snakieData')) || { coins: 0, skin: '#0f0', ownedSkins: ['#0f0'], speedBoost: 1 };
    function save() { localStorage.setItem('snakieData', JSON.stringify(data)); updateUI(); }
    function updateUI() { document.getElementById('menu-coins').innerText = data.coins; }
    updateUI();

    // --- MATRIX BACKGROUND ---
    const chars = "01"; 
    const fontSize = 14;
    let columns;
    let drops = [];

    function initMatrix() {
        bgCanvas.width = window.innerWidth; bgCanvas.height = window.innerHeight;
        columns = bgCanvas.width / fontSize;
        drops = Array(Math.floor(columns)).fill(1);
    }
    initMatrix();

    function drawMatrix() {
        bgCtx.fillStyle = "rgba(0, 0, 0, 0.05)";
        bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
        bgCtx.fillStyle = "#0f0";
        bgCtx.font = fontSize + "px monospace";
        for (let i = 0; i < drops.length; i++) {
            const text = chars.charAt(Math.floor(Math.random() * chars.length));
            bgCtx.fillText(text, i * fontSize, drops[i] * fontSize);
            if (drops[i] * fontSize > bgCanvas.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        }
    }

    // --- PEER LOGIC ---
    const roomPin = Math.floor(1000 + Math.random() * 9000).toString();
    peer = new Peer('snakie-' + roomPin);
    peer.on('open', () => document.getElementById('pin-display').innerText = "PIN: " + roomPin);
    peer.on('connection', c => { conn = c; isMulti = true; setupConn(); preStart(); });

    function setupConn() {
        conn.on('data', d => {
            if(d.type === 'move') otherSnake = d.body;
            if(d.type === 'chat') addMsg("Them: " + d.txt);
        });
    }

    function startJoin() {
        const pin = document.getElementById('join-id').value;
        conn = peer.connect('snakie-' + pin);
        isMulti = true; setupConn(); preStart();
    }

    function startSingle() { isMulti = false; preStart(); }

    function preStart() {
        hideScreens();
        mySnake = Array(15).fill({x: canvas.width/2, y: canvas.height/2});
        isPlaying = true;
        if(isMulti) document.getElementById('chat-ui').style.display = 'block';
    }

    function hideScreens() {
        document.querySelectorAll('.menu, .screen').forEach(s => s.classList.add('hidden'));
        document.getElementById('menu').classList.remove('hidden'); // default back to menu unless playing
        if(isPlaying) document.getElementById('menu').classList.add('hidden');
    }

    function showMulti() { hideScreens(); document.getElementById('multi-menu').classList.remove('hidden'); }
    function showShop() { 
        hideScreens(); 
        document.getElementById('shop').classList.remove('hidden'); 
        showTab('skins');
    }

    function showTab(tab) {
        const content = document.getElementById('shop-content');
        content.innerHTML = '';
        if(tab === 'skins') {
            const skins = [ {n:'Default', c:'#0f0', p:0}, {n:'Blue', c:'#00f', p:10}, {n:'Gold', c:'#ff0', p:50} ];
            skins.forEach(s => {
                content.innerHTML += `<div class="btn tab-btn" onclick="buySkin('${s.c}', ${s.p})">${s.n}<br>${s.p}💰</div>`;
            });
        } else {
            content.innerHTML = `<div class="btn tab-btn" onclick="buyPotion()">Speed Potion<br>20💰</div>`;
        }
    }

    function buySkin(col, price) {
        if(data.coins >= price) { data.coins -= price; data.skin = col; save(); alert("Skin Equipped!"); }
    }

    // --- GAME LOOP ---
    window.addEventListener('touchmove', e => {
        const t = e.touches[0];
        angle = Math.atan2(t.clientY - window.innerHeight/2, t.clientX - window.innerWidth/2);
    });

    function loop() {
        drawMatrix();
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if(isPlaying) {
            // VERY SLOW SMOOTH MOVEMENT (Speed 2)
            const head = { x: mySnake[0].x + Math.cos(angle)*2, y: mySnake[0].y + Math.sin(angle)*2 };
            
            if(head.x < 0) head.x = canvas.width; if(head.x > canvas.width) head.x = 0;
            if(head.y < 0) head.y = canvas.height; if(head.y > canvas.height) head.y = 0;

            mySnake.unshift(head);
            if(Math.hypot(head.x - fruit.x, head.y - fruit.y) < 20) {
                fruit = {x: Math.random()*canvas.width, y: Math.random()*canvas.height};
                data.coins++; save();
            } else { mySnake.pop(); }

            if(isMulti && conn) conn.send({type:'move', body:mySnake});

            // Draw Snakes
            ctx.lineWidth = 12; ctx.lineCap = 'round';
            ctx.strokeStyle = data.skin; ctx.beginPath(); mySnake.forEach(p => ctx.lineTo(p.x, p.y)); ctx.stroke();
            if(isMulti) {
                ctx.strokeStyle = '#f0f'; ctx.beginPath(); otherSnake.forEach(p => ctx.lineTo(p.x, p.y)); ctx.stroke();
            }

            // Draw Fruit
            ctx.fillStyle = '#ff0'; ctx.beginPath(); ctx.arc(fruit.x, fruit.y, 8, 0, 7); ctx.fill();
        }
        requestAnimationFrame(loop);
    }
    loop();
    window.onresize = initMatrix;
</script>
</body>
</html>
