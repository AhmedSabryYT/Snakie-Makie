<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snakie Makie PRO</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; background: #0b0b0b; color: #00ffcc; font-family: sans-serif; overflow: hidden; touch-action: none; }
        canvas { display: block; }
        .menu, .pop-up { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; }
        input, button { background: #111; border: 2px solid #00ffcc; color: #00ffcc; padding: 15px; margin: 10px; border-radius: 8px; font-size: 16px; }
        button { background: #00ffcc; color: #000; font-weight: bold; cursor: pointer; box-shadow: 0 0 10px #00ffcc; }
        #countdown { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 80px; font-weight: bold; z-index: 50; pointer-events: none; }
        #chat-ui { position: fixed; bottom: 10px; left: 10px; z-index: 60; width: 220px; }
        #msgs { height: 80px; overflow-y: auto; background: rgba(0,0,0,0.5); font-size: 12px; padding: 5px; margin-bottom: 5px; text-align: left; }
        #leaderboard { position: fixed; top: 10px; right: 10px; background: rgba(0,0,0,0.8); padding: 10px; border: 1px solid #00ffcc; font-size: 14px; z-index: 60; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="countdown" class="hidden"></div>

<div id="menu" class="menu">
    <h1>SNAKIE MAKIE</h1>
    <p>Your ID: <b id="display-id">...</b></p>
    <input type="text" id="join-id" placeholder="Friend's ID">
    <button onclick="startJoin()">CONNECT & PLAY</button>
</div>

<div id="game-over" class="pop-up hidden">
    <h1 id="status-msg">ELIMINATED</h1>
    <button onclick="requestRevenge()">REVENGE</button>
    <button onclick="location.reload()">MENU</button>
</div>

<div id="leaderboard">YOU: 0 | THEM: 0</div>

<div id="chat-ui">
    <div id="msgs"></div>
    <input type="text" id="chat-in" placeholder="Tap to chat..." onkeypress="if(event.key==='Enter') sendChat()">
</div>

<canvas id="c"></canvas>

<script>
    const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
    let peer = new Peer(), conn, isPlaying = false, canMove = false, angle = 0;
    let mySnake = [], otherSnake = [], fruit = {x: 150, y: 150};
    let myScore = 0, enemyScore = 0;

    peer.on('open', id => { document.getElementById('display-id').innerText = id; });
    peer.on('connection', c => { conn = c; setupConn(); preStart(); });

    function startJoin() {
        const id = document.getElementById('join-id').value;
        if(!id) return alert("Enter ID!");
        conn = peer.connect(id);
        setupConn(); preStart();
    }

    function setupConn() {
        conn.on('data', data => {
            if(data.type === 'move') otherSnake = data.body;
            if(data.type === 'fruit') fruit = data.pos;
            if(data.type === 'chat') addMsg("Them: " + data.txt);
            if(data.type === 'dead') win();
            if(data.type === 'revenge') location.reload();
        });
    }

    function preStart() {
        document.getElementById('menu').classList.add('hidden');
        document.getElementById('game-over').classList.add('hidden');
        mySnake = Array(15).fill({x: window.innerWidth/2, y: window.innerHeight/2});
        isPlaying = true;
        
        // 3 Second Countdown
        let count = 3;
        const cd = document.getElementById('countdown');
        cd.classList.remove('hidden');
        const timer = setInterval(() => {
            cd.innerText = count;
            if(count <= 0) {
                clearInterval(timer);
                cd.classList.add('hidden');
                canMove = true;
            }
            count--;
        }, 1000);
    }

    function sendChat() {
        const i = document.getElementById('chat-in');
        if(!i.value) return;
        addMsg("You: " + i.value);
        if(conn) conn.send({type: 'chat', txt: i.value});
        i.value = '';
    }

    function addMsg(t) {
        const m = document.getElementById('msgs');
        m.innerHTML += `<div>${t}</div>`;
        m.scrollTop = m.scrollHeight;
    }

    function requestRevenge() { if(conn) conn.send({type: 'revenge'}); location.reload(); }

    function die() {
        if(!canMove) return;
        isPlaying = false; canMove = false;
        document.getElementById('status-msg').innerText = "ELIMINATED";
        document.getElementById('game-over').classList.remove('hidden');
        if(conn) conn.send({type: 'dead'});
    }

    function win() {
        isPlaying = false; canMove = false;
        document.getElementById('status-msg').innerText = "YOU WON!";
        document.getElementById('game-over').classList.remove('hidden');
        myScore++;
        document.getElementById('leaderboard').innerText = `YOU: ${myScore} | THEM: ${enemyScore}`;
    }

    window.addEventListener('touchmove', e => {
        const t = e.touches[0];
        angle = Math.atan2(t.clientY - window.innerHeight/2, t.clientX - window.innerWidth/2);
    });

    function loop() {
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        ctx.fillStyle = '#0b0b0b'; ctx.fillRect(0,0,canvas.width,canvas.height);

        // Grid
        ctx.strokeStyle = '#1a1a1a';
        for(let i=0; i<canvas.width; i+=50) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke(); }
        for(let i=0; i<canvas.height; i+=50) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(canvas.width,i); ctx.stroke(); }

        if(isPlaying) {
            if(canMove) {
                const head = { x: mySnake[0].x + Math.cos(angle)*2.5, y: mySnake[0].y + Math.sin(angle)*2.5 };
                
                // Death Zone (Edge of your specific screen)
                if(head.x < 0 || head.x > canvas.width || head.y < 0 || head.y > canvas.height) die();

                mySnake.unshift(head);
                if(Math.hypot(head.x - fruit.x, head.y - fruit.y) < 20) {
                    fruit = {x: Math.random()*canvas.width, y: Math.random()*canvas.height};
                    if(conn) conn.send({type: 'fruit', pos: fruit});
                } else { mySnake.pop(); }
            }

            if(conn && conn.open) conn.send({type: 'move', body: mySnake});

            // Draw Fruit
            ctx.fillStyle = '#ff0055'; ctx.shadowBlur = 10; ctx.shadowColor = '#ff0055';
            ctx.beginPath(); ctx.arc(fruit.x, fruit.y, 10, 0, Math.PI*2); ctx.fill();
            ctx.shadowBlur = 0;

            // Draw Snakes
            ctx.lineWidth = 12; ctx.lineCap = 'round';
            ctx.strokeStyle = '#ff0055'; ctx.beginPath(); otherSnake.forEach(p => ctx.lineTo(p.x, p.y)); ctx.stroke();
            ctx.strokeStyle = '#00ffcc'; ctx.beginPath(); mySnake.forEach(p => ctx.lineTo(p.x, p.y)); ctx.stroke();
        }
        requestAnimationFrame(loop);
    }
    loop();
</script>
</body>
</html>
