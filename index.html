<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snakie - Midnight Social</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --accent: #a29bfe; --bg: #020208; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; overflow: hidden; touch-action: none; }
        canvas { display: block; }
        
        /* UI Containers */
        .ui-layer { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 100; pointer-events: none; }
        .panel { background: rgba(10, 10, 20, 0.98); border: 1px solid #334; padding: 25px; border-radius: 20px; pointer-events: auto; width: 320px; text-align: center; box-shadow: 0 0 40px #000; }
        
        /* Buttons & Inputs */
        button { background: #1a1a2e; border: 1px solid #445; color: #fff; padding: 12px; margin: 5px 0; width: 100%; border-radius: 12px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:disabled { opacity: 0.3; cursor: not-allowed; }
        button:hover:not(:disabled) { border-color: var(--accent); background: #252545; }
        input[type="number"] { background: #000; border: 1px solid #445; color: #fff; padding: 12px; width: 80%; border-radius: 8px; text-align: center; font-size: 18px; }

        /* Chat System */
        #chat-box { position: fixed; bottom: 20px; left: 20px; width: 250px; pointer-events: none; z-index: 200; }
        #chat-log { height: 120px; overflow-y: auto; font-size: 12px; background: rgba(0,0,0,0.5); padding: 5px; border-radius: 5px; margin-bottom: 5px; color: #ccc; }
        #chat-input { pointer-events: auto; width: 100%; background: rgba(20,20,40,0.8); border: 1px solid #445; color: #fff; padding: 8px; border-radius: 5px; display: none; }

        /* HUD */
        #hud { position: fixed; top: 20px; left: 20px; font-size: 18px; text-shadow: 0 2px 4px #000; z-index: 50; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<canvas id="g"></canvas>
<div id="hud">💎 Gems: <span id="gem-count">0</span></div>

<div id="chat-box">
    <div id="chat-log"></div>
    <input type="text" id="chat-input" placeholder="Press Enter to Chat...">
</div>

<div id="m" class="ui-layer">
    <div class="panel">
        <h1 style="letter-spacing:8px; color:var(--accent); margin:0;">SNAKIE</h1>
        <p style="font-size:10px; opacity:0.5; margin-bottom:20px;">PRO VERSION</p>
        
        <button onclick="startGame(false)">SINGLE PLAYER</button>
        <button onclick="toggleLayer('mp')">MULTIPLAYER</button>
        <button onclick="toggleLayer('color-menu')">CHANGE SKIN (10💎)</button>
        <button onclick="toggleLayer('shop')">OPEN SHOP</button>
    </div>
</div>

<div id="color-menu" class="ui-layer hidden">
    <div class="panel">
        <h3>CHOOSE GRADIENT</h3>
        <input type="color" id="c1" value="#a29bfe" style="width:100%; height:40px; border:none; border-radius:8px; cursor:pointer;">
        <div style="margin: 10px 0;">to</div>
        <input type="color" id="c2" value="#6c5ce7" style="width:100%; height:40px; border:none; border-radius:8px; cursor:pointer;">
        <p id="gem-warn" style="color:#ff7675; font-size:11px;"></p>
        <button id="buy-color-btn" onclick="saveGradient()">APPLY (10💎)</button>
        <button onclick="toggleLayer('m')" style="border:none; opacity:0.5;">CANCEL</button>
    </div>
</div>

<div id="mp" class="ui-layer hidden">
    <div class="panel">
        <p>YOUR PIN</p>
        <h1 id="pin-display" style="font-size:42px; color:var(--accent); margin:10px 0;">----</h1>
        <input type="number" id="friend-pin" placeholder="Enter Friend Pin">
        <button onclick="connectToFriend()">JOIN FRIEND</button>
        <button onclick="toggleLayer('m')" style="border:none; opacity:0.5;">BACK</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('g'), ctx = canvas.getContext('2d');
    let peer, conn, isGame = false, isMulti = false;
    let snake = [], otherSnake = [], fruit = {x:0, y:0};
    let angle = 0, currAngle = 0, otherAngle = 0;
    let cam = {x: 0, y: 0}, gems = 0;
    
    // Customization & Persistence
    let myConfig = {
        color1: '#a29bfe',
        color2: '#6c5ce7',
        gems: 0
    };

    // Load Data
    const saved = localStorage.getItem('snakie_data');
    if(saved) {
        myConfig = JSON.parse(saved);
        gems = myConfig.gems;
        document.getElementById('gem-count').innerText = gems;
        document.getElementById('c1').value = myConfig.color1;
        document.getElementById('c2').value = myConfig.color2;
    }

    function saveData() {
        myConfig.gems = gems;
        localStorage.setItem('snakie_data', JSON.stringify(myConfig));
    }

    // --- UI LOGIC ---
    function toggleLayer(id) {
        document.querySelectorAll('.ui-layer').forEach(l => l.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
        if(gems < 10) {
            document.getElementById('buy-color-btn').disabled = true;
            document.getElementById('gem-warn').innerText = "Need 10 Gems!";
        } else {
            document.getElementById('buy-color-btn').disabled = false;
            document.getElementById('gem-warn').innerText = "";
        }
    }

    function saveGradient() {
        if(gems >= 10) {
            gems -= 10;
            myConfig.color1 = document.getElementById('c1').value;
            myConfig.color2 = document.getElementById('c2').value;
            saveData();
            document.getElementById('gem-count').innerText = gems;
            toggleLayer('m');
        }
    }

    // --- CHAT LOGIC ---
    window.addEventListener('keydown', e => {
        if(e.key === 'Enter') {
            const input = document.getElementById('chat-input');
            if(input.style.display === 'block') {
                if(input.value && conn) {
                    conn.send({t:'c', msg: input.value});
                    addChatMessage("Me: " + input.value);
                }
                input.value = '';
                input.style.display = 'none';
            } else {
                input.style.display = 'block';
                input.focus();
            }
        }
    });

    function addChatMessage(txt) {
        const log = document.getElementById('chat-log');
        log.innerHTML += `<div>${txt}</div>`;
        log.scrollTop = log.scrollHeight;
    }

    // --- NETWORKING ---
    function initNetworking() {
        const pin = Math.floor(1000 + Math.random() * 8999);
        peer = new Peer('snk-' + pin);
        peer.on('open', () => document.getElementById('pin-display').innerText = pin);
        peer.on('connection', c => { conn = c; setupConn(); startGame(true); });
    }

    function connectToFriend() {
        const p = document.getElementById('friend-pin').value;
        conn = peer.connect('snk-' + p);
        conn.on('open', () => { setupConn(); startGame(true); });
    }

    function setupConn() {
        isMulti = true;
        document.getElementById('chat-input').style.display = 'none';
        conn.on('data', d => {
            if(d.t === 'm') { otherSnake = d.p; window.otherCol = d.c; otherAngle = d.a; }
            if(d.t === 'c') { addChatMessage("Friend: " + d.msg); }
        });
    }

    // --- DRAWING ASSETS ---
    function drawDetailedMoon() {
        ctx.save();
        ctx.translate(canvas.width - 120, 120);
        ctx.rotate(Date.now() * 0.0001); // Slow spin
        
        // Main Body
        const grad = ctx.createRadialGradient(-10, -10, 0, 0, 0, 50);
        grad.addColorStop(0, '#fff'); grad.addColorStop(1, '#a29bfe33');
        ctx.fillStyle = '#e1e1e1'; ctx.beginPath(); ctx.arc(0,0,50,0,7); ctx.fill();
        
        // Craters
        ctx.fillStyle = '#ccc';
        const craters = [[15, 10, 8], [-10, -20, 12], [-25, 15, 6], [5, -30, 4]];
        craters.forEach(c => {
            ctx.beginPath(); ctx.arc(c[0], c[1], c[2], 0, 7); ctx.fill();
        });
        ctx.restore();
    }

    function drawApple(x, y) {
        ctx.save(); ctx.translate(x, y);
        ctx.fillStyle = '#ff4d4d'; ctx.beginPath(); ctx.arc(0,0,12,0,7); ctx.fill(); // Fruit
        ctx.strokeStyle = '#4d2600'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(0,-8); ctx.lineTo(0,-16); ctx.stroke(); // Stem
        ctx.fillStyle = '#2ecc71'; ctx.beginPath(); ctx.ellipse(5,-13,6,3,1,0,7); ctx.fill(); // Leaf
        ctx.restore();
    }

    function drawEyes(h, ang) {
        const drawE = (side) => {
            let ex = h.x + Math.cos(ang + 0.5 * side) * 10;
            let ey = h.y + Math.sin(ang + 0.5 * side) * 10;
            
            // White
            ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(ex, ey, 6, 0, 7); ctx.fill();
            // Pupil
            ctx.fillStyle = 'black'; 
            ctx.beginPath(); ctx.arc(ex + Math.cos(ang)*2.5, ey + Math.sin(ang)*2.5, 3, 0, 7); ctx.fill();
            // Shine
            ctx.fillStyle = 'rgba(255,255,255,0.8)';
            ctx.beginPath(); ctx.arc(ex - 1, ey - 1, 1.5, 0, 7); ctx.fill();
        };
        drawE(1); drawE(-1);
    }

    // --- GAME LOOP ---
    let particles = Array(60).fill(0).map(() => ({x:Math.random()*2000, y:Math.random()*2000, s:Math.random()*2, o:Math.random()}));

    function startGame(m) {
        isGame = true; isMulti = m;
        document.querySelectorAll('.ui-layer').forEach(l => l.classList.add('hidden'));
        snake = Array(20).fill({x: 0, y: 0});
        spawnFruit();
    }

    function spawnFruit() { fruit = { x: snake[0].x + (Math.random()*800-400), y: snake[0].y + (Math.random()*800-400) }; }

    window.addEventListener('touchmove', e => {
        angle = Math.atan2(e.touches[0].clientY - window.innerHeight/2, e.touches[0].clientX - window.innerWidth/2);
    });

    function loop() {
        requestAnimationFrame(loop);
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        ctx.fillStyle = '#020208'; ctx.fillRect(0,0,canvas.width,canvas.height);

        drawDetailedMoon();

        if(!isGame) {
            if(isMulti) initNetworking(); 
            return;
        }

        cam.x += (snake[0].x - canvas.width/2 - cam.x) * 0.1;
        cam.y += (snake[0].y - canvas.height/2 - cam.y) * 0.1;

        ctx.save(); ctx.translate(-cam.x, -cam.y);

        // Breeze/Stars Canvas
        particles.forEach(p => {
            let px = (p.x - cam.x * 0.3) % 2000; if(px<0) px+=2000;
            let py = (p.y - cam.y * 0.3) % 2000; if(py<0) py+=2000;
            ctx.fillStyle = `rgba(255,255,255,${p.o})`;
            ctx.beginPath(); ctx.arc(cam.x + px - 1000, cam.y + py - 1000, p.s, 0, 7); ctx.fill();
        });

        // Move
        let d = angle - currAngle;
        while(d < -Math.PI) d += Math.PI*2; while(d > Math.PI) d -= Math.PI*2;
        currAngle += d * 0.08;
        const h = { x: snake[0].x + Math.cos(currAngle)*4, y: snake[0].y + Math.sin(currAngle)*4 };
        snake.unshift(h);
        
        if(Math.hypot(h.x-fruit.x, h.y-fruit.y) < 25) { 
            spawnFruit(); gems++; document.getElementById('gem-count').innerText = gems; saveData(); 
        } else if(Math.hypot(h.x-fruit.x, h.y-fruit.y) > 1500) { spawnFruit(); }
        else { snake.pop(); }

        if(isMulti && conn && conn.open) conn.send({t:'m', p:snake, c:[myConfig.color1, myConfig.color2], a:currAngle});

        const drawS = (b, colors, ang) => {
            if(!b.length) return;
            let g = ctx.createLinearGradient(b[0].x, b[0].y, b[b.length-1].x, b[b.length-1].y);
            g.addColorStop(0, colors[0]); g.addColorStop(1, colors[1]);
            ctx.lineCap='round'; ctx.lineWidth=24; ctx.strokeStyle=g;
            ctx.beginPath(); b.forEach(p=>ctx.lineTo(p.x,p.y)); ctx.stroke();
            drawEyes(b[0], ang);
        };

        if(isMulti) drawS(otherSnake, (window.otherCol || ['#fff','#fff']), otherAngle);
        drawS(snake, [myConfig.color1, myConfig.color2], currAngle);
        drawApple(fruit.x, fruit.y);

        ctx.restore();

        // --- ARROW HUD LOGIC ---
        if (isMulti && otherSnake.length > 0) {
            let dx = otherSnake[0].x - snake[0].x;
            let dy = otherSnake[0].y - snake[0].y;
            let dist = Math.hypot(dx, dy);
            if (dist > 300) {
                let pointAngle = Math.atan2(dy, dx);
                let arrowDist = 120;
                let cx = canvas.width / 2 + Math.cos(pointAngle) * arrowDist;
                let cy = canvas.height / 2 + Math.sin(pointAngle) * arrowDist;
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(pointAngle);
                ctx.fillStyle = '#ff7675';
                ctx.beginPath(); ctx.moveTo(15, 0); ctx.lineTo(-10, -8); ctx.lineTo(-10, 8); ctx.fill();
                ctx.rotate(-pointAngle);
                ctx.fillStyle = '#fff'; ctx.font = 'bold 12px Arial'; ctx.textAlign = 'center';
                ctx.fillText(Math.round(dist/10) + "m", 0, 25);
                ctx.restore();
            }
        }
    }
    initNetworking();
    loop();
</script>
</body>
</html>
