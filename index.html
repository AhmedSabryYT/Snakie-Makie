<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SNAKIE: ETERNAL EDITIONS</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --accent: #a29bfe; --bg: #020208; --panel-bg: rgba(10, 10, 25, 0.98); }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; touch-action: none; }
        canvas { display: block; width: 100vw; height: 100vh; }

        /* UI SYSTEM */
        .overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 1000; pointer-events: none; }
        .panel { 
            background: var(--panel-bg); 
            border: 2px solid #334; 
            padding: 30px; 
            border-radius: 24px; 
            pointer-events: auto; 
            width: 340px; 
            text-align: center; 
            box-shadow: 0 0 50px rgba(0,0,0,0.8), 0 0 20px rgba(162, 155, 254, 0.1);
            animation: panelFade 0.4s ease-out;
        }
        @keyframes panelFade { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

        h1 { font-size: 32px; letter-spacing: 10px; color: var(--accent); margin: 0 0 10px 0; text-shadow: 0 0 15px var(--accent); }
        h2 { font-size: 18px; color: #889; margin-bottom: 25px; font-weight: 300; }
        
        button { 
            background: #1a1a2e; 
            border: 1px solid #445; 
            color: #fff; 
            padding: 14px; 
            margin: 6px 0; 
            width: 100%; 
            border-radius: 12px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 14px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        button:hover { border-color: var(--accent); background: #252545; transform: translateY(-2px); }
        button:active { transform: translateY(0); }
        button.primary { background: var(--accent); color: #000; border: none; }
        button.danger { border-color: #ff7675; color: #ff7675; }

        /* HUD ELEMENTS */
        #hud { position: fixed; top: 20px; left: 20px; z-index: 500; pointer-events: none; display: flex; flex-direction: column; gap: 5px; }
        .hud-item { background: rgba(0,0,0,0.5); padding: 8px 15px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(5px); }
        #fire-btn { 
            position: fixed; bottom: 40px; right: 40px; width: 90px; height: 90px; 
            background: radial-gradient(circle, #ff7675, #d63031); 
            border: 4px solid rgba(255,255,255,0.3); border-radius: 50%; 
            color: white; font-weight: 900; z-index: 2000; display: none; 
            pointer-events: auto; box-shadow: 0 0 30px rgba(214, 48, 49, 0.6);
        }

        /* CHAT SYSTEM */
        #chat-ui { position: fixed; bottom: 20px; left: 20px; width: 280px; z-index: 2000; pointer-events: none; }
        #chat-log { height: 140px; overflow-y: auto; font-size: 13px; background: rgba(0,0,0,0.4); border-radius: 10px; padding: 10px; margin-bottom: 8px; border: 1px solid #334; }
        #chat-input { pointer-events: auto; width: 100%; background: #112; border: 1px solid #445; color: #fff; padding: 10px; border-radius: 8px; display: none; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<canvas id="g"></canvas>

<div id="hud">
    <div class="hud-item">💎 Gems: <span id="gem-count">0</span></div>
    <div class="hud-item" id="mode-display" style="display:none">Mode: <span id="mode-name">---</span></div>
    <div class="hud-item" id="story-stat" style="display:none">Level: <span id="lvl-val">1</span> | Progress: <span id="prog-val">0</span>%</div>
</div>

<button id="fire-btn">FIRE</button>

<div id="chat-ui">
    <div id="chat-log"></div>
    <input type="text" id="chat-input" placeholder="Enter message...">
</div>

<div id="screen-main" class="overlay">
    <div class="panel">
        <h1>SNAKIE</h1>
        <h2>Midnight Edition</h2>
        <button class="primary" onclick="showModeSelector(false)">SINGLE PLAYER</button>
        <button onclick="showModeSelector(true)">MULTIPLAYER</button>
        <button onclick="toggleScreen('screen-skin')">SKINS & CUSTOMIZE</button>
    </div>
</div>

<div id="screen-modes" class="overlay hidden">
    <div class="panel">
        <h1 id="mode-header">MODES</h1>
        <button onclick="initGame('peaceful')">✨ PEACEFUL MODE</button>
        <button onclick="initGame('normal')">⚔️ NORMAL MODE</button>
        <button onclick="initGame('story')">📜 STORY MODE</button>
        <button class="danger" onclick="toggleScreen('screen-main')">BACK</button>
    </div>
</div>

<div id="screen-skin" class="overlay hidden">
    <div class="panel">
        <h1>SKINS</h1>
        <p>Pick your Gradient (10💎)</p>
        <div style="display:flex; gap:10px; margin:15px 0;">
            <input type="color" id="color1" value="#a29bfe" style="flex:1; height:50px; border-radius:8px; border:none;">
            <input type="color" id="color2" value="#6c5ce7" style="flex:1; height:50px; border-radius:8px; border:none;">
        </div>
        <button onclick="buySkin()">APPLY CHANGES</button>
        <button onclick="toggleScreen('screen-main')">BACK</button>
    </div>
</div>

<div id="screen-death" class="overlay hidden">
    <div class="panel">
        <h1 style="color:#ff7675">GAME OVER</h1>
        <p id="death-reason"></p>
        <button class="primary" onclick="location.reload()">PLAY AGAIN</button>
        <button onclick="location.reload()">MENU</button>
    </div>
</div>

<script>
/**
 * SNAKIE ENGINE v3.0
 * EXTREME EDITION
 */

const canvas = document.getElementById('g');
const ctx = canvas.getContext('2d');
const fireBtn = document.getElementById('fire-btn');

// --- GAME STATE ---
let state = {
    isLive: false,
    mode: 'peaceful', // peaceful, normal, story
    isMulti: false,
    gems: 0,
    config: { c1: '#a29bfe', c2: '#6c5ce7' },
    level: 1,
    storyProgress: 0,
    camera: { x: 0, y: 0 },
    mouse: { angle: 0, current: 0 }
};

let player = {
    body: [],
    length: 20,
    speed: 4,
    alive: true
};

let entities = {
    fruit: { x: 0, y: 0 },
    enemies: [],
    fireballs: [],
    particles: []
};

// --- DATA PERSISTENCE ---
function loadData() {
    const data = localStorage.getItem('snakie_pro_save');
    if (data) {
        const p = JSON.parse(data);
        state.gems = p.gems || 0;
        state.config = p.config || state.config;
        document.getElementById('gem-count').innerText = state.gems;
        document.getElementById('color1').value = state.config.c1;
        document.getElementById('color2').value = state.config.c2;
    }
}

function saveData() {
    localStorage.setItem('snakie_pro_save', JSON.stringify({
        gems: state.gems,
        config: state.config
    }));
}

// --- UI LOGIC ---
function toggleScreen(id) {
    document.querySelectorAll('.overlay').forEach(s => s.classList.add('hidden'));
    if(id !== 'none') document.getElementById(id).classList.remove('hidden');
}

function showModeSelector(multi) {
    state.isMulti = multi;
    document.getElementById('mode-header').innerText = multi ? "NET MODES" : "SOLO MODES";
    toggleScreen('screen-modes');
}

function buySkin() {
    if (state.gems >= 10) {
        state.gems -= 10;
        state.config.c1 = document.getElementById('color1').value;
        state.config.c2 = document.getElementById('color2').value;
        document.getElementById('gem-count').innerText = state.gems;
        saveData();
        alert("Skin Applied!");
    } else {
        alert("Need 10 Gems! Eat more apples.");
    }
}

// --- CORE GAME ENGINE ---
function initGame(mode) {
    state.mode = mode;
    state.isLive = true;
    toggleScreen('none');
    
    // Reset Player
    player.body = Array(20).fill({x: 0, y: 0});
    player.alive = true;
    
    // HUD Setup
    document.getElementById('mode-display').style.display = 'block';
    document.getElementById('mode-name').innerText = mode.toUpperCase();
    if(mode === 'story') {
        document.getElementById('story-stat').style.display = 'block';
        fireBtn.style.display = 'block';
    }
    
    // Initial Spawns
    spawnFruit();
    spawnStars();
}

function spawnFruit() {
    entities.fruit = {
        x: player.body[0].x + (Math.random() * 1000 - 500),
        y: player.body[0].y + (Math.random() * 1000 - 500)
    };
}

function spawnStars() {
    entities.particles = [];
    for(let i=0; i<80; i++) {
        entities.particles.push({
            x: Math.random() * 3000 - 1500,
            y: Math.random() * 3000 - 1500,
            size: Math.random() * 2 + 1,
            alpha: Math.random()
        });
    }
}

function gameOver(reason) {
    state.isLive = false;
    document.getElementById('death-reason').innerText = reason;
    toggleScreen('screen-death');
}

// --- INPUTS ---
window.addEventListener('touchmove', e => {
    const t = e.touches[0];
    state.mouse.angle = Math.atan2(t.clientY - window.innerHeight/2, t.clientX - window.innerWidth/2);
});

fireBtn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    shoot();
});

function shoot() {
    if(state.mode !== 'story') return;
    entities.fireballs.push({
        x: player.body[0].x,
        y: player.body[0].y,
        vx: Math.cos(state.mouse.current) * 12,
        vy: Math.sin(state.mouse.current) * 12,
        life: 100
    });
}

// --- DRAWING HELPERS ---
function drawMoon() {
    ctx.save();
    ctx.translate(canvas.width - 100, 100);
    // Glow
    ctx.shadowBlur = 20; ctx.shadowColor = "white";
    ctx.fillStyle = "#e1e1e1";
    ctx.beginPath(); ctx.arc(0,0,45,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    // Craters
    ctx.fillStyle = "#ccc";
    [[10,-10,8], [-15,5,10], [5,20,5], [-5,-25,4]].forEach(c => {
        ctx.beginPath(); ctx.arc(c[0], c[1], c[2], 0, 7); ctx.fill();
    });
    ctx.restore();
}

function drawDetailedApple(x, y) {
    ctx.save();
    ctx.translate(x, y);
    // Shadow
    ctx.fillStyle = "rgba(0,0,0,0.3)";
    ctx.beginPath(); ctx.ellipse(0, 15, 12, 5, 0, 0, 7); ctx.fill();
    // Body
    ctx.fillStyle = "#ff4d4d";
    ctx.beginPath(); ctx.arc(0,0,13,0,7); ctx.fill();
    // Stem
    ctx.strokeStyle = "#4d2600"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0,-10); ctx.lineTo(2,-18); ctx.stroke();
    // Leaf
    ctx.fillStyle = "#2ecc71";
    ctx.beginPath(); ctx.ellipse(5,-15,6,3,0.5,0,7); ctx.fill();
    ctx.restore();
}

function drawSnakeEyes(head, ang) {
    const sides = [0.5, -0.5];
    sides.forEach(s => {
        let ex = head.x + Math.cos(ang + s) * 10;
        let ey = head.y + Math.sin(ang + s) * 10;
        // White
        ctx.fillStyle = "white";
        ctx.beginPath(); ctx.arc(ex, ey, 6, 0, 7); ctx.fill();
        // Pupil
        ctx.fillStyle = "black";
        ctx.beginPath(); ctx.arc(ex + Math.cos(ang)*3, ey + Math.sin(ang)*3, 3, 0, 7); ctx.fill();
        // Shine
        ctx.fillStyle = "white";
        ctx.beginPath(); ctx.arc(ex-1, ey-1, 1.5, 0, 7); ctx.fill();
    });
}

// --- MAIN LOOP ---
function update() {
    if (!state.isLive) return;

    // 1. ANGLE SMOOTHING
    let diff = state.mouse.angle - state.mouse.current;
    while(diff < -Math.PI) diff += Math.PI*2;
    while(diff > Math.PI) diff -= Math.PI*2;
    state.mouse.current += diff * 0.1;

    // 2. MOVEMENT
    const head = {
        x: player.body[0].x + Math.cos(state.mouse.current) * player.speed,
        y: player.body[0].y + Math.sin(state.mouse.current) * player.speed
    };
    player.body.unshift(head);

    // 3. COLLISION: FRUIT
    let dToFruit = Math.hypot(head.x - entities.fruit.x, head.y - entities.fruit.y);
    if (dToFruit < 25) {
        state.gems++;
        document.getElementById('gem-count').innerText = state.gems;
        spawnFruit();
        saveData();
    } else if (dToFruit > 1500) {
        spawnFruit(); // Prevent fruit from being lost
    } else {
        player.body.pop();
    }

    // 4. MODE LOGIC: NORMAL (RED ZONE & SELF-HIT)
    if (state.mode === 'normal') {
        const limit = 1000;
        if (Math.abs(head.x) > limit || Math.abs(head.y) > limit) {
            gameOver("You crossed the Red Zone line!");
        }
        // Self hit check
        for(let i=10; i<player.body.length; i++) {
            if(Math.hypot(head.x - player.body[i].x, head.y - player.body[i].y) < 15) {
                gameOver("You bit your own tail!");
            }
        }
    }

    // 5. MODE LOGIC: STORY
    if (state.mode === 'story') {
        // Spawn Enemies from right
        if(Math.random() < 0.02 + (state.level * 0.005)) {
            entities.enemies.push({
                x: head.x + 800,
                y: head.y + (Math.random() * 800 - 400),
                hp: Math.ceil(state.level/5),
                type: state.level === 30 ? 'boss' : 'minion'
            });
        }

        // Handle Fireballs
        entities.fireballs.forEach((f, fi) => {
            f.x += f.vx; f.y += f.vy;
            f.life--;
            if(f.life <= 0) entities.fireballs.splice(fi, 1);
            
            entities.enemies.forEach((e, ei) => {
                if(Math.hypot(f.x - e.x, f.y - e.y) < 40) {
                    e.hp--;
                    entities.fireballs.splice(fi, 1);
                    if(e.hp <= 0) {
                        entities.enemies.splice(ei, 1);
                        state.storyProgress += 5;
                        if(state.storyProgress >= 100) {
                            state.level++;
                            state.storyProgress = 0;
                            if(state.level > 30) alert("YOU WON THE STORY!");
                        }
                    }
                }
            });
        });

        // Enemy collision with player
        entities.enemies.forEach(e => {
            e.x -= 3;
            if(Math.hypot(head.x - e.x, head.y - e.y) < 30) {
                gameOver("An enemy killed you!");
            }
        });

        document.getElementById('lvl-val').innerText = state.level;
        document.getElementById('prog-val').innerText = Math.floor(state.storyProgress);
    }

    // 6. CAMERA
    state.camera.x += (head.x - canvas.width/2 - state.camera.x) * 0.1;
    state.camera.y += (head.y - canvas.height/2 - state.camera.y) * 0.1;
}

function render() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    ctx.fillStyle = "#020208";
    ctx.fillRect(0,0,canvas.width, canvas.height);

    drawMoon();

    if(!state.isLive) return;

    ctx.save();
    ctx.translate(-state.camera.x, -state.camera.y);

    // Border (Normal Mode)
    if(state.mode === 'normal') {
        ctx.strokeStyle = "red"; ctx.lineWidth = 10;
        ctx.strokeRect(-1000, -1000, 2000, 2000);
    }

    // Stars
    entities.particles.forEach(p => {
        ctx.fillStyle = `rgba(255,255,255,${p.alpha})`;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 7); ctx.fill();
    });

    // Fireballs
    entities.fireballs.forEach(f => {
        ctx.fillStyle = "#ff7675";
        ctx.shadowBlur = 10; ctx.shadowColor = "orange";
        ctx.beginPath(); ctx.arc(f.x, f.y, 8, 0, 7); ctx.fill();
        ctx.shadowBlur = 0;
    });

    // Enemies
    entities.enemies.forEach(e => {
        ctx.fillStyle = e.type === 'boss' ? "#6c5ce7" : "#ff4757";
        ctx.beginPath(); 
        if(e.type === 'boss') ctx.rect(e.x-30, e.y-30, 60, 60);
        else ctx.rect(e.x-15, e.y-15, 30, 30);
        ctx.fill();
    });

    // Snake
    if (player.body.length > 0) {
        const grad = ctx.createLinearGradient(
            player.body[0].x, player.body[0].y, 
            player.body[player.body.length-1].x, player.body[player.body.length-1].y
        );
        grad.addColorStop(0, state.config.c1);
        grad.addColorStop(1, state.config.c2);
        
        ctx.strokeStyle = grad;
        ctx.lineWidth = 24;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.beginPath();
        player.body.forEach(p => ctx.lineTo(p.x, p.y));
        ctx.stroke();

        drawSnakeEyes(player.body[0], state.mouse.current);
    }

    drawDetailedApple(entities.fruit.x, entities.fruit.y);

    ctx.restore();
}

function heartBeat() {
    update();
    render();
    requestAnimationFrame(heartBeat);
}

// Start
loadData();
heartBeat();

</script>
</body>
</html>
