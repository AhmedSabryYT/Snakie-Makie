<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snakie Makie Pro</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --neon: #00d4ff; --bg: #000b18; }
        body { margin: 0; background: var(--bg); color: var(--neon); font-family: 'Segoe UI', sans-serif; overflow: hidden; touch-action: none; }
        canvas { display: block; position: absolute; top: 0; left: 0; }
        
        /* Cooler & Simple Menu */
        .ui { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 100; pointer-events: none; }
        .panel { 
            background: rgba(0, 20, 50, 0.7); backdrop-filter: blur(15px); 
            border: 1px solid rgba(0, 212, 255, 0.3); padding: 40px; border-radius: 30px; 
            pointer-events: auto; width: 320px; text-align: center;
            box-shadow: 0 0 50px rgba(0, 212, 255, 0.1);
        }
        h1 { font-size: 32px; letter-spacing: 4px; margin: 0; text-shadow: 0 0 15px var(--neon); }
        .sub { font-size: 9px; opacity: 0.5; margin-bottom: 30px; }
        
        button { 
            background: rgba(0, 212, 255, 0.1); border: 1px solid var(--neon); color: var(--neon); 
            padding: 15px; margin: 10px 0; width: 100%; border-radius: 12px; 
            font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        button:hover { background: var(--neon); color: #000; box-shadow: 0 0 20px var(--neon); }
        
        #leaderboard { position: fixed; top: 20px; left: 20px; font-weight: bold; font-size: 18px; z-index: 110; display: none; }
        .hidden { display: none !important; }
        input { background: transparent; border: 1px solid var(--neon); color: #fff; padding: 12px; width: 80%; border-radius: 10px; text-align: center; margin-bottom: 10px; }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>
<div id="leaderboard">SCORE: 0</div>

<div id="menu" class="ui">
    <div class="panel">
        <h1>SNAKIE</h1>
        <div class="sub">STRIKERJOY STUDIOS</div>
        <button onclick="goMode('single')">SINGLE PLAYER</button>
        <button onclick="goMode('multi')">MULTIPLAYER</button>
        <button onclick="showSkins()" style="border:none; font-size:12px; opacity:0.7;">CHANGE COLOR</button>
    </div>
</div>

<div id="mode-select" class="ui hidden">
    <div class="panel">
        <h3>CHOOSE MODE</h3>
        <button onclick="start('peaceful')">PEACEFUL</button>
        <button onclick="start('survival')">3 LIVES</button>
    </div>
</div>

<div id="multi-ui" class="ui hidden">
    <div class="panel">
        <p>YOUR PIN</p>
        <h2 id="my-pin" style="font-size: 40px; margin: 10px 0;">....</h2>
        <input type="number" id="join-pin" placeholder="ENTER FRIEND PIN">
        <button onclick="connect()">JOIN GAME</button>
        <button onclick="location.reload()" style="border:none; font-size:11px;">BACK</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas'), ctx = canvas.getContext('2d');
    let peer, conn, isPlaying = false, isMulti = false, angle = 0, currentAngle = 0;
    let mySnake = [], otherSnake = [], fruit = {x: 100, y: 100};
    let camera = {x: 0, y: 0}, score = 0, enemyScore = 0, gMode = 'peaceful';
    let data = JSON.parse(localStorage.getItem('snakie_save')) || { skin: '#00d4ff' };

    // --- CONNECTION FIX ---
    function initPeer() {
        const pin = Math.floor(1000 + Math.random()*8999);
        // Using a direct, simple ID to avoid PeerJS server confusion
        peer = new Peer('sm-' + pin); 
        peer.on('open', id => document.getElementById('my-pin').innerText = id.split('-')[1]);
        peer.on('connection', c => { conn = c; isMulti = true; setupConn(); start(gMode); });
        peer.on('error', () => initPeer()); // If ID taken, instantly try another
    }
    initPeer();

    function setupConn() {
        conn.on('data', d => { if(d.type === 'move') otherSnake = d.body; });
    }

    function connect() {
        const p = document.getElementById('join-pin').value;
        if(!p) return;
        conn = peer.connect('sm-' + p);
        setupConn();
        isMulti = true;
        start(gMode);
    }

    function goMode(type) {
        isMulti = type === 'multi';
        document.getElementById('menu').classList.add('hidden');
        document.getElementById('mode-select').classList.remove('hidden');
    }

    function start(m) {
        gMode = m;
        if(isMulti && !conn) {
            document.getElementById('mode-select').classList.add('hidden');
            document.getElementById('multi-ui').classList.remove('hidden');
            return;
        }
        isPlaying = true;
        mySnake = Array(15).fill({x: 0, y: 0});
        document.querySelectorAll('.ui').forEach(u => u.classList.add('hidden'));
        document.getElementById('leaderboard').style.display = 'block';
        spawnFruit();
    }

    // --- INFINITE APPLE LOGIC ---
    function spawnFruit() {
        fruit = { 
            x: mySnake[0].x + (Math.random() * 600 - 300), 
            y: mySnake[0].y + (Math.random() * 600 - 300) 
        };
    }

    let stars = Array(150).fill(0).map(() => ({ x: Math.random()*2000, y: Math.random()*2000, s: Math.random()*2 }));
    let breezes = Array(15).fill(0).map(() => ({ x: Math.random()*2000, y: Math.random()*2000, l: 200 }));

    window.addEventListener('touchmove', e => {
        angle = Math.atan2(e.touches[0].clientY - window.innerHeight/2, e.touches[0].clientX - window.innerWidth/2);
    });

    function loop() {
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        ctx.fillStyle = '#000b18'; ctx.fillRect(0,0,canvas.width,canvas.height);

        if(isPlaying) {
            camera.x += (mySnake[0].x - canvas.width/2 - camera.x) * 0.1;
            camera.y += (mySnake[0].y - canvas.height/2 - camera.y) * 0.1;
            ctx.save(); ctx.translate(-camera.x, -camera.y);

            // Infinite Stars & THICK BREEZE
            ctx.fillStyle = "white";
            stars.forEach(s => {
                let sx = (s.x + camera.x * 0.8) % 2000; if(sx < 0) sx += 2000;
                let sy = (s.y + camera.y * 0.8) % 2000; if(sy < 0) sy += 2000;
                ctx.beginPath(); ctx.arc(camera.x + sx - 1000, camera.y + sy - 1000, s.s, 0, 7); ctx.fill();
            });

            ctx.strokeStyle = "rgba(0, 212, 255, 0.4)"; ctx.lineWidth = 8;
            breezes.forEach(b => {
                let bx = (b.x + camera.x) % 2000; if(bx < 0) bx += 2000;
                ctx.beginPath(); ctx.moveTo(camera.x + bx - 1000, b.y); ctx.lineTo(camera.x + bx - 1000 + b.l, b.y); ctx.stroke();
            });

            // Smooth Mobility
            let diff = angle - currentAngle;
            while(diff < -Math.PI) diff += Math.PI*2;
            while(diff > Math.PI) diff -= Math.PI*2;
            currentAngle += diff * 0.08;

            const head = { x: mySnake[0].x + Math.cos(currentAngle)*3, y: mySnake[0].y + Math.sin(currentAngle)*3 };
            mySnake.unshift(head);
            if(Math.hypot(head.x - fruit.x, head.y - fruit.y) < 25) { spawnFruit(); score++; } else { mySnake.pop(); }

            if(isMulti && conn) conn.send({type:'move', body:mySnake});

            // Draw Snakes + Eyes
            [otherSnake, mySnake].forEach((s, i) => {
                if(!s.length) return;
                ctx.lineWidth = 16; ctx.lineCap = 'round';
                ctx.strokeStyle = (i===0 && isMulti) ? '#ff0055' : data.skin;
                ctx.beginPath(); s.forEach(p => ctx.lineTo(p.x, p.y)); ctx.stroke();
                
                // Eyes
                const h = s[0];
                ctx.fillStyle = 'white';
                ctx.beginPath(); ctx.arc(h.x + Math.cos(currentAngle+0.5)*7, h.y + Math.sin(currentAngle+0.5)*7, 4, 0, 7); ctx.fill();
                ctx.beginPath(); ctx.arc(h.x + Math.cos(currentAngle-0.5)*7, h.y + Math.sin(currentAngle-0.5)*7, 4, 0, 7); ctx.fill();
            });

            ctx.fillStyle = '#ff3333'; ctx.beginPath(); ctx.arc(fruit.x, fruit.y, 12, 0, 7); ctx.fill();
            ctx.restore();

            // HUD
            document.getElementById('leaderboard').innerText = `SCORE: ${score}`;
            if(isMulti && otherSnake.length) {
                const cx = canvas.width - 60, cy = canvas.height - 60;
                const dx = otherSnake[0].x - mySnake[0].x, dy = otherSnake[0].y - mySnake[0].y;
                ctx.strokeStyle = var(--neon); ctx.beginPath(); ctx.arc(cx, cy, 30, 0, 7); ctx.stroke();
                ctx.save(); ctx.translate(cx, cy); ctx.rotate(Math.atan2(dy, dx));
                ctx.fillStyle = '#ff0055'; ctx.beginPath(); ctx.moveTo(15,0); ctx.lineTo(-10,-8); ctx.lineTo(-10,8); ctx.fill(); ctx.restore();
            }
        }
        requestAnimationFrame(loop);
    }
    loop();
</script>
</body>
</html>
