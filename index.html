<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SNAKIE: ETERNAL EMPIRE FIXED</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --accent: #a29bfe;
            --danger: #ff7675;
            --success: #55efc4;
            --bg: #020208;
            --panel: rgba(15, 15, 30, 0.98);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; margin: 0; padding: 0; }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; overflow: hidden; touch-action: none; }
        canvas { display: block; position: fixed; inset: 0; z-index: 1; }

        /* --- UI ANIMATIONS --- */
        @keyframes slideIn { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        /* HUD */
        .hud { position: fixed; top: 0; left: 0; width: 100%; padding: 15px; pointer-events: none; z-index: 10; display: flex; justify-content: space-between; }
        .stat { background: rgba(0, 0, 0, 0.7); padding: 10px 18px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px); font-weight: bold; font-size: 14px; }
        
        #bars-container { position: fixed; top: 75px; left: 15px; width: 200px; display: none; flex-direction: column; gap: 8px; z-index: 10; }
        .bar-bg { width: 100%; height: 16px; background: rgba(0,0,0,0.8); border-radius: 8px; border: 1px solid #334; overflow: hidden; position: relative; }
        .bar-fill { height: 100%; width: 100%; transition: width 0.3s ease; }
        #hp-fill { background: linear-gradient(90deg, #ff7675, #d63031); }
        #prog-fill { background: linear-gradient(90deg, #55efc4, #00b894); width: 0%; }
        .bar-txt { position: absolute; width: 100%; text-align: center; font-size: 9px; font-weight: 900; line-height: 16px; text-shadow: 0 1px 2px #000; }

        /* SCREENS */
        .overlay { position: fixed; inset: 0; background: rgba(2, 2, 8, 0.9); display: flex; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(15px); }
        .modal { background: var(--panel); width: 90%; max-width: 360px; padding: 35px; border-radius: 24px; border: 1px solid #445; text-align: center; animation: slideIn 0.4s ease; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        
        h1 { font-size: 32px; color: var(--accent); letter-spacing: 4px; margin-bottom: 20px; text-shadow: 0 0 15px var(--accent); }
        .btn { background: #1e1e30; border: 1px solid #445; color: #fff; padding: 16px; width: 100%; border-radius: 12px; font-weight: bold; margin-bottom: 10px; cursor: pointer; transition: 0.2s; font-size: 15px; }
        .btn-main { background: var(--accent); color: #000; border: none; }
        .btn:active { transform: scale(0.95); opacity: 0.8; }

        /* CHAT & CONTROLS */
        #chat-box { position: fixed; bottom: 20px; left: 20px; width: 260px; z-index: 50; pointer-events: none; }
        #chat-msgs { height: 120px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; margin-bottom: 10px; mask-image: linear-gradient(transparent, black 40%); }
        .msg { background: rgba(0,0,0,0.4); padding: 5px 12px; border-radius: 8px; font-size: 12px; margin-top: 4px; width: fit-content; animation: slideIn 0.2s ease; }
        #chat-in { width: 100%; padding: 12px; background: #112; border: 1px solid #445; border-radius: 10px; color: #fff; pointer-events: auto; display: none; }

        #fire-btn { position: fixed; bottom: 40px; right: 40px; width: 85px; height: 85px; background: radial-gradient(circle, #ff7675, #d63031); border-radius: 50%; border: 4px solid #fff3; z-index: 60; display: none; box-shadow: 0 10px 30px rgba(214,48,49,0.4); color: #fff; font-weight: 900; }

        #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--danger); padding: 12px 25px; border-radius: 50px; z-index: 1000; display: none; font-weight: bold; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <canvas id="stage"></canvas>
    <div id="toast">FRIEND DISCONNECTED</div>

    <div class="hud">
        <div class="stat">💎 <span id="gem-ui">0</span></div>
        <div class="stat" id="lvl-card" style="display:none">LVL <span id="lvl-ui">1</span></div>
    </div>

    <div id="bars-container">
        <div class="bar-bg"><div id="hp-fill" class="bar-fill"></div><div class="bar-txt">HEALTH</div></div>
        <div class="bar-bg" id="prog-wrap"><div id="prog-fill" class="bar-fill"></div><div class="bar-txt">PROGRESS <span id="prog-pct">0%</span></div></div>
    </div>

    <div id="chat-box">
        <div id="chat-msgs"></div>
        <input type="text" id="chat-in" placeholder="Press Enter to Chat...">
    </div>

    <button id="fire-btn">BLAST</button>

    <div id="m-main" class="overlay">
        <div class="modal">
            <h1>SNAKIE</h1>
            <button class="btn btn-main" onclick="UI.showModes(false)">SINGLE PLAYER</button>
            <button class="btn" onclick="UI.showModes(true)">MULTIPLAYER</button>
            <button class="btn" onclick="UI.toggle('m-skin')">SKINS (10💎)</button>
        </div>
    </div>

    <div id="m-modes" class="overlay hidden">
        <div class="modal">
            <h2 style="margin-bottom:20px;">CHOOSE MODE</h2>
            <button class="btn" onclick="Game.preStart('peaceful')">PEACEFUL</button>
            <button class="btn" onclick="Game.preStart('normal')">NORMAL</button>
            <button id="btn-story" class="btn" onclick="Game.preStart('story')">STORY MODE</button>
            <button class="btn" style="border:none; color:#667;" onclick="UI.toggle('m-main')">BACK</button>
        </div>
    </div>

    <div id="m-multi" class="overlay hidden">
        <div class="modal">
            <h2>LOBBY</h2>
            <p style="color:#889; margin:15px 0;">Your PIN:</p>
            <h1 id="my-id-display">----</h1>
            <input type="number" id="join-id" style="width:100%; padding:15px; border-radius:12px; background:#000; border:1px solid #445; color:#fff; text-align:center; font-size:20px; margin-bottom:15px;" placeholder="Friend's PIN">
            <button class="btn btn-main" onclick="Net.connect()">CONNECT</button>
            <button class="btn" onclick="UI.toggle('m-main')">BACK</button>
        </div>
    </div>

    <div id="m-dead" class="overlay hidden">
        <div class="modal">
            <h1 style="color:var(--danger)">WRECKED</h1>
            <p id="death-msg" style="margin-bottom:20px; color:#889;">You crashed.</p>
            <button class="btn btn-main" onclick="location.reload()">RETRY</button>
        </div>
    </div>

    <div id="m-skin" class="overlay hidden">
        <div class="modal">
            <h2>CUSTOMIZE</h2>
            <div style="display:flex; gap:10px; margin:20px 0;">
                <input type="color" id="c1" value="#a29bfe" style="flex:1; height:60px; border:none; border-radius:10px;">
                <input type="color" id="c2" value="#6c5ce7" style="flex:1; height:60px; border:none; border-radius:10px;">
            </div>
            <button class="btn btn-main" onclick="Game.buySkin()">SAVE SKIN</button>
            <button class="btn" onclick="UI.toggle('m-main')">CANCEL</button>
        </div>
    </div>

    <script>
        /** * FIXING THE "SINGLE REFERENCE" BUG: 
         * Instead of Array.fill({}), we use .map() to create unique objects.
         */

        const UI = {
            toggle: (id) => {
                document.querySelectorAll('.overlay').forEach(o => o.classList.add('hidden'));
                if(id) document.getElementById(id).classList.remove('hidden');
            },
            showModes: (multi) => {
                Game.isMulti = multi;
                document.getElementById('btn-story').style.display = multi ? 'none' : 'block';
                if(multi) { Net.init(); UI.toggle('m-multi'); }
                else UI.toggle('m-modes');
            },
            toast: (msg) => {
                const t = document.getElementById('toast');
                t.innerText = msg; t.style.display = 'block';
                setTimeout(() => t.style.display = 'none', 3000);
            }
        };

        const Net = {
            peer: null, conn: null, otherSnake: [], otherSkin: {a:'#fff',b:'#fff'},
            init: () => {
                if(Net.peer) return;
                const pin = Math.floor(1000 + Math.random()*8999);
                Net.peer = new Peer('snk-'+pin);
                Net.peer.on('open', id => document.getElementById('my-id-display').innerText = id.split('-')[1]);
                Net.peer.on('connection', c => { Net.conn = c; Net.listen(); });
            },
            connect: () => {
                const id = document.getElementById('join-id').value;
                Net.conn = Net.peer.connect('snk-'+id);
                Net.listen();
            },
            listen: () => {
                UI.toast("CONNECTED!");
                UI.toggle('m-modes');
                Net.conn.on('data', data => {
                    if(data.type === 'sync') { Net.otherSnake = data.s; Net.otherSkin = data.k; }
                    if(data.type === 'start') Game.start(data.mode);
                    if(data.type === 'chat') Game.addChat(data.msg, false);
                });
                Net.conn.on('close', () => { UI.toast("FRIEND LEFT"); setTimeout(() => location.reload(), 2000); });
            }
        };

        const Game = {
            active: false, isMulti: false, mode: 'peaceful',
            width: window.innerWidth, height: window.innerHeight,
            cam: {x:0, y:0}, gems: 0, level: 1, hp: 100, prog: 0,
            snake: [], angle: 0, targetAngle: 0,
            skin: {a:'#a29bfe', b:'#6c5ce7'},
            fruit: {x:200, y:200}, enemies: [], bullets: [],
            
            init: () => {
                const cvs = document.getElementById('stage');
                cvs.width = Game.width; cvs.height = Game.height;
                Game.ctx = cvs.getContext('2d');

                const save = JSON.parse(localStorage.getItem('snk_v5') || '{}');
                Game.gems = save.gems || 0;
                Game.level = save.level || 1;
                Game.skin = save.skin || Game.skin;
                document.getElementById('gem-ui').innerText = Game.gems;

                window.addEventListener('touchstart', e => Game.targetAngle = Math.atan2(e.touches[0].clientY - Game.height/2, e.touches[0].clientX - Game.width/2));
                window.addEventListener('touchmove', e => Game.targetAngle = Math.atan2(e.touches[0].clientY - Game.height/2, e.touches[0].clientX - Game.width/2));
                
                document.getElementById('fire-btn').addEventListener('touchstart', Game.shoot);
                
                window.addEventListener('keydown', e => {
                    if(e.key === 'Enter') {
                        const i = document.getElementById('chat-in');
                        if(i.style.display === 'block') {
                            if(i.value) Game.addChat(i.value, true);
                            i.value = ''; i.style.display = 'none';
                        } else { i.style.display = 'block'; i.focus(); }
                    }
                });

                requestAnimationFrame(Game.loop);
            },

            preStart: (mode) => {
                if(Game.isMulti && Net.conn) {
                    Net.conn.send({type:'start', mode: mode});
                }
                Game.start(mode);
            },

            start: (mode) => {
                Game.mode = mode;
                Game.active = true;
                Game.hp = 100; Game.prog = 0;
                // FIX: Unique objects per segment
                Game.snake = Array.from({length: 20}, () => ({x:0, y:0}));
                
                UI.toggle(null);
                document.getElementById('bars-container').style.display = 'flex';
                document.getElementById('prog-wrap').style.display = (mode === 'story') ? 'block' : 'none';
                document.getElementById('lvl-card').style.display = (mode === 'story') ? 'flex' : 'none';
                document.getElementById('fire-btn').style.display = (mode === 'story') ? 'block' : 'none';
                document.getElementById('lvl-ui').innerText = Game.level;
            },

            addChat: (msg, me) => {
                const box = document.getElementById('chat-msgs');
                const d = document.createElement('div');
                d.className = 'msg';
                d.style.alignSelf = me ? 'flex-end' : 'flex-start';
                d.style.background = me ? 'var(--accent)' : '#334';
                d.style.color = me ? '#000' : '#fff';
                d.innerText = msg;
                box.appendChild(d);
                if(me && Net.conn) Net.conn.send({type:'chat', msg: msg});
            },

            shoot: () => {
                const h = Game.snake[0];
                Game.bullets.push({x: h.x, y: h.y, vx: Math.cos(Game.angle)*12, vy: Math.sin(Game.angle)*12, l: 60});
            },

            buySkin: () => {
                if(Game.gems >= 10) {
                    Game.gems -= 10;
                    Game.skin.a = document.getElementById('c1').value;
                    Game.skin.b = document.getElementById('c2').value;
                    localStorage.setItem('snk_v5', JSON.stringify({gems: Game.gems, level: Game.level, skin: Game.skin}));
                    document.getElementById('gem-ui').innerText = Game.gems;
                    UI.toggle('m-main');
                }
            },

            update: () => {
                if(!Game.active) return;

                // Angle Smooth
                let d = Game.targetAngle - Game.angle;
                while(d < -Math.PI) d += Math.PI*2;
                while(d > Math.PI) d -= Math.PI*2;
                Game.angle += d * 0.15;

                // Move Head
                const head = {
                    x: Game.snake[0].x + Math.cos(Game.angle) * 5,
                    y: Game.snake[0].y + Math.sin(Game.angle) * 5
                };
                Game.snake.unshift(head);

                // Fruit Logic
                if(Math.hypot(head.x - Game.fruit.x, head.y - Game.fruit.y) < 30) {
                    Game.gems++; Game.fruit = {x: head.x + (Math.random()*800-400), y: head.y + (Math.random()*800-400)};
                    document.getElementById('gem-ui').innerText = Game.gems;
                } else {
                    Game.snake.pop();
                }

                // Camera
                Game.cam.x += (head.x - Game.width/2 - Game.cam.x) * 0.1;
                Game.cam.y += (head.y - Game.height/2 - Game.cam.y) * 0.1;

                // Enemies & Combat
                if(Game.mode === 'story') {
                    if(Game.enemies.length < 4 && Math.random() < 0.02) {
                        Game.enemies.push({x: head.x + 800, y: head.y + (Math.random()*600-300), hp: 2});
                    }
                    Game.enemies.forEach((e, i) => {
                        e.x -= 3;
                        if(Math.hypot(head.x - e.x, head.y - e.y) < 40) { Game.hp -= 20; Game.enemies.splice(i, 1); }
                        Game.bullets.forEach((b, bi) => {
                            if(Math.hypot(b.x - e.x, b.y - e.y) < 40) {
                                e.hp--; Game.bullets.splice(bi,1);
                                if(e.hp <= 0) {
                                    Game.enemies.splice(i,1); Game.prog += 15;
                                    if(Game.prog >= 100) { Game.level++; Game.prog = 0; Game.hp = 100; document.getElementById('lvl-ui').innerText = Game.level; }
                                }
                            }
                        });
                    });
                }

                Game.bullets.forEach((b,i) => { b.x += b.vx; b.y += b.vy; b.l--; if(b.l<=0) Game.bullets.splice(i,1); });

                document.getElementById('hp-fill').style.width = Game.hp + "%";
                document.getElementById('prog-fill').style.width = Game.prog + "%";
                document.getElementById('prog-pct').innerText = Game.prog + "%";
                if(Game.hp <= 0) { Game.active = false; UI.toggle('m-dead'); }

                if(Game.isMulti && Net.conn) Net.conn.send({type:'sync', s: Game.snake, k: Game.skin});
            },

            draw: () => {
                const ctx = Game.ctx;
                ctx.fillStyle = '#020208';
                ctx.fillRect(0,0,Game.width, Game.height);

                ctx.save();
                ctx.translate(-Game.cam.x, -Game.cam.y);

                // Draw World
                ctx.fillStyle = '#ff7675'; ctx.beginPath(); ctx.arc(Game.fruit.x, Game.fruit.y, 12, 0, 7); ctx.fill();

                // Other Player & Arrow
                if(Game.isMulti && Net.otherSnake.length) {
                    Game.drawSnake(Net.otherSnake, Net.otherSkin);
                    const dx = Net.otherSnake[0].x - Game.snake[0].x;
                    const dy = Net.otherSnake[0].y - Game.snake[0].y;
                    const ang = Math.atan2(dy, dx);
                    ctx.restore(); ctx.save();
                    ctx.translate(Game.width/2 + Math.cos(ang)*80, Game.height/2 + Math.sin(ang)*80);
                    ctx.rotate(ang);
                    ctx.fillStyle = 'red'; ctx.beginPath(); ctx.moveTo(15,0); ctx.lineTo(-10,10); ctx.lineTo(-10,-10); ctx.fill();
                    ctx.restore(); ctx.save(); ctx.translate(-Game.cam.x, -Game.cam.y);
                }

                // Bullets & Enemies
                ctx.fillStyle = 'orange'; Game.bullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, 6, 0, 7); ctx.fill(); });
                ctx.fillStyle = '#d63031'; Game.enemies.forEach(e => { ctx.fillRect(e.x-15, e.y-15, 30, 30); });

                // My Snake
                Game.drawSnake(Game.snake, Game.skin);

                ctx.restore();
            },

            drawSnake: (s, k) => {
                const ctx = Game.ctx;
                const g = ctx.createLinearGradient(s[0].x, s[0].y, s[s.length-1].x, s[s.length-1].y);
                g.addColorStop(0, k.a); g.addColorStop(1, k.b);
                ctx.strokeStyle = g; ctx.lineWidth = 25; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                ctx.beginPath();
                s.forEach((p, i) => {
                    const w = Math.sin(Date.now()/200 + i*0.5) * 4;
                    ctx.lineTo(p.x + w, p.y + w);
                });
                ctx.stroke();
            },

            loop: () => {
                Game.update(); Game.draw();
                requestAnimationFrame(Game.loop);
            }
        };

        window.onload = Game.init;
    </script>
</body>
</html>
