<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snakie Makie - Infinite Pro</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; background: #000b18; color: #00d4ff; font-family: 'Segoe UI', sans-serif; overflow: hidden; touch-action: none; }
        canvas { display: block; position: absolute; top: 0; left: 0; }
        .ui { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; pointer-events: none; text-align: center; }
        .panel { background: rgba(0, 15, 40, 0.9); border: 2px solid #00d4ff; padding: 25px; border-radius: 15px; pointer-events: auto; width: 280px; box-shadow: 0 0 30px rgba(0, 212, 255, 0.2); }
        button, input { background: #001d3d; border: 1px solid #00d4ff; color: #00d4ff; padding: 12px; margin: 8px; width: 100%; border-radius: 5px; font-weight: bold; }
        #leaderboard { position: fixed; top: 15px; right: 15px; background: rgba(0, 29, 61, 0.7); padding: 10px; border: 1px solid #00d4ff; border-radius: 8px; font-size: 14px; z-index: 110; display: none; }
        #chat-ui { position: fixed; bottom: 80px; left: 10px; width: 200px; pointer-events: auto; z-index: 110; display: none; }
        #msgs { height: 70px; overflow-y: auto; background: rgba(0,0,0,0.6); font-size: 11px; padding: 5px; color: #fff; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="leaderboard">SCORE: 0</div>

<div id="menu" class="ui">
    <div class="panel">
        <h1 style="margin:0; font-size: 28px;">SNAKIE MAKIE</h1>
        <p style="font-size:10px; margin-bottom:20px;">STRIKERJOY STUDIOS</p>
        <p>💰 COINS: <span id="coin-count">0</span></p>
        <button onclick="showModeMenu(false)">SINGLE PLAYER</button>
        <button onclick="showModeMenu(true)">MULTIPLAYER</button>
        <button onclick="showCustomizer()">CHANGE COLOR (10 💰)</button>
        <div style="font-size: 9px; margin-top: 20px; opacity: 0.6;">Ahmed Sabry --- StrikerJoy Studios</div>
    </div>
</div>

<div id="mode-menu" class="ui hidden">
    <div class="panel">
        <h3>WHICH MODE?</h3>
        <button onclick="setGameMode('peaceful')">PEACEFUL MODE</button>
        <button onclick="setGameMode('survival')">3 LIVES MODE</button>
        <button onclick="closeUI()">BACK</button>
    </div>
</div>

<div id="customizer" class="ui hidden">
    <div class="panel">
        <h3>CHOOSE SKIN COLOR</h3>
        <input type="color" id="colorPicker" value="#00d4ff">
        <button onclick="applyColor()">APPLY & SAVE</button>
        <button onclick="closeUI()">BACK</button>
    </div>
</div>

<div id="multi-panel" class="ui hidden">
    <div class="panel">
        <p>YOUR ROOM PIN: <b id="my-pin">LOADING...</b></p>
        <input type="number" id="join-pin" placeholder="FRIEND'S PIN">
        <button onclick="startJoin()">JOIN ROOM</button>
        <button onclick="closeUI()">BACK</button>
    </div>
</div>

<div id="chat-ui">
    <div id="msgs"></div>
    <input type="text" id="chat-in" placeholder="Message..." onkeypress="if(event.key==='Enter') sendChat()">
</div>

<script>
    const canvas = document.getElementById('gameCanvas'), ctx = canvas.getContext('2d');
    let peer, conn, isPlaying = false, isMulti = false, angle = 0, currentAngle = 0;
    let mySnake = [], otherSnake = [], fruit = {x: 200, y: 200};
    let camera = {x: 0, y: 0}, lives = 3, mode = 'peaceful', score = 0, enemyScore = 0;
    
    let data = JSON.parse(localStorage.getItem('snakie_pro')) || { coins: 0, skin: '#00d4ff' };
    const badWords = ['harmful', 'badword1']; 

    function save() { localStorage.setItem('snakie_pro', JSON.stringify(data)); document.getElementById('coin-count').innerText = data.coins; }
    save();

    let stars = [], breezes = [];
    function initEnv() {
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        stars = Array(160).fill(0).map(() => ({ x: Math.random() * 2000, y: Math.random() * 2000, s: Math.random() * 2 }));
        breezes = Array(12).fill(0).map(() => ({ x: Math.random() * 2000, y: Math.random() * 2000, l: 100 + Math.random() * 100 }));
    }
    initEnv();

    // Fixed PIN Generation
    function initPeer() {
        const pin = Math.floor(1000 + Math.random()*9000).toString();
        peer = new Peer('snakie-' + pin);
        peer.on('open', () => document.getElementById('my-pin').innerText = pin);
        peer.on('error', () => initPeer()); // Retry if PIN taken
        peer.on('connection', c => { conn = c; isMulti = true; setupConn(); startGame(); });
    }
    initPeer();

    function setupConn() {
        conn.on('data', d => {
            if(d.type === 'move') { otherSnake = d.body; }
            if(d.type === 'chat') addMsg("Friend: " + censor(d.txt));
            if(d.type === 'sync-req') { conn.send({type:'sync-mode', m: mode}); startGame(); }
            if(d.type === 'sync-mode') { mode = d.m; startGame(); }
            if(d.type === 'score-up') { enemyScore = d.val; updateLB(); }
        });
        conn.on('close', () => { alert("Player 2 left"); location.reload(); });
    }

    function showModeMenu(m) { isMulti = m; document.getElementById('menu').classList.add('hidden'); document.getElementById('mode-menu').classList.remove('hidden'); }
    function setGameMode(m) { mode = m; if(isMulti) { document.getElementById('mode-menu').classList.add('hidden'); document.getElementById('multi-panel').classList.remove('hidden'); } else { startGame(); } }
    function startJoin() { conn = peer.connect('snakie-' + document.getElementById('join-pin').value); setupConn(); }
    function showCustomizer() { document.getElementById('menu').classList.add('hidden'); document.getElementById('customizer').classList.remove('hidden'); }
    function closeUI() { document.querySelectorAll('.ui').forEach(u => u.classList.add('hidden')); document.getElementById('menu').classList.remove('hidden'); }

    function startGame() {
        lives = 3; score = 0; enemyScore = 0; isPlaying = true;
        mySnake = Array(15).fill({x: 0, y: 0});
        document.querySelectorAll('.ui').forEach(u => u.classList.add('hidden'));
        document.getElementById('leaderboard').style.display = 'block';
        if(isMulti) document.getElementById('chat-ui').style.display = 'block';
        spawnFruit();
        updateLB();
    }

    function updateLB() { 
        document.getElementById('leaderboard').innerText = isMulti ? `YOU: ${score} | THEM: ${enemyScore}` : `SCORE: ${score}`;
    }

    function spawnFruit() {
        // Infinite Spawn Fix: Always places fruit in front/near player
        fruit = {
            x: mySnake[0].x + (Math.random() * 600 - 300),
            y: mySnake[0].y + (Math.random() * 600 - 300)
        };
    }

    function applyColor() {
        if(data.coins >= 10) { data.coins -= 10; data.skin = document.getElementById('colorPicker').value; save(); closeUI(); }
        else { alert("Need 10 coins!"); }
    }

    function censor(text) {
        let regex = new RegExp(badWords.join('|'), 'gi');
        return text.replace(regex, "****");
    }

    function sendChat() {
        const i = document.getElementById('chat-in'); if(!i.value) return;
        let clean = censor(i.value); addMsg("You: " + clean);
        if(conn) conn.send({type:'chat', txt: clean}); i.value = '';
    }

    function addMsg(t) { const m = document.getElementById('msgs'); m.innerHTML += `<div>${t}</div>`; m.scrollTop = m.scrollHeight; }

    // Improved Mobility: Smooth turning
    window.addEventListener('touchmove', e => {
        angle = Math.atan2(e.touches[0].clientY - window.innerHeight/2, e.touches[0].clientX - window.innerWidth/2);
    });

    function drawSnake(body, color) {
        if(!body.length) return;
        ctx.lineWidth = 14; ctx.lineCap = 'round'; ctx.strokeStyle = color;
        ctx.beginPath(); body.forEach(p => ctx.lineTo(p.x, p.y)); ctx.stroke();
        
        // Add Eyes using Canvas
        const head = body[0];
        ctx.fillStyle = 'white';
        ctx.beginPath(); ctx.arc(head.x + Math.cos(currentAngle+0.5)*5, head.y + Math.sin(currentAngle+0.5)*5, 3, 0, 7); ctx.fill();
        ctx.beginPath(); ctx.arc(head.x + Math.cos(currentAngle-0.5)*5, head.y + Math.sin(currentAngle-0.5)*5, 3, 0, 7); ctx.fill();
        ctx.fillStyle = 'black';
        ctx.beginPath(); ctx.arc(head.x + Math.cos(currentAngle+0.5)*6, head.y + Math.sin(currentAngle+0.5)*6, 1.5, 0, 7); ctx.fill();
        ctx.beginPath(); ctx.arc(head.x + Math.cos(currentAngle-0.5)*6, head.y + Math.sin(currentAngle-0.5)*6, 1.5, 0, 7); ctx.fill();
    }

    function loop() {
        ctx.fillStyle = '#000b18'; ctx.fillRect(0,0,canvas.width,canvas.height);

        if(isPlaying) {
            camera.x += (mySnake[0].x - canvas.width/2 - camera.x) * 0.1;
            camera.y += (mySnake[0].y - canvas.height/2 - camera.y) * 0.1;
            
            ctx.save(); ctx.translate(-camera.x, -camera.y);

            // Infinite Parallax Environment
            ctx.fillStyle = "white";
            stars.forEach(s => {
                let sx = (s.x + camera.x * 0.8) % 2000; if(sx < 0) sx += 2000;
                let sy = (s.y + camera.y * 0.8) % 2000; if(sy < 0) sy += 2000;
                ctx.beginPath(); ctx.arc(camera.x + sx - 1000, camera.y + sy - 1000, s.s, 0, 7); ctx.fill();
            });
            
            ctx.strokeStyle = "rgba(255,255,255,0.25)"; ctx.lineWidth = 4;
            breezes.forEach(b => {
                let bx = (b.x + camera.x) % 2000; if(bx < 0) bx += 2000;
                ctx.beginPath(); ctx.moveTo(camera.x + bx - 1000, b.y); ctx.lineTo(camera.x + bx - 1000 + b.l, b.y); ctx.stroke();
            });

            // Smooth Turning Logic
            let diff = angle - currentAngle;
            while (diff < -Math.PI) diff += Math.PI * 2;
            while (diff > Math.PI) diff -= Math.PI * 2;
            currentAngle += diff * 0.1;

            const head = { x: mySnake[0].x + Math.cos(currentAngle)*2.2, y: mySnake[0].y + Math.sin(currentAngle)*2.2 };
            mySnake.unshift(head);
            
            if(Math.hypot(head.x - fruit.x, head.y - fruit.y) < 22) {
                spawnFruit(); score++; data.coins++; save(); updateLB();
                if(conn) conn.send({type: 'score-up', val: score});
            } else { mySnake.pop(); }

            if(isMulti && conn) conn.send({type:'move', body:mySnake});
            if(isMulti) drawSnake(otherSnake, '#ff0055');
            drawSnake(mySnake, data.skin);

            // Fruit
            ctx.fillStyle = '#ff3333'; ctx.beginPath(); ctx.arc(fruit.x, fruit.y, 11, 0, 7); ctx.fill();
            ctx.fillStyle = '#44ff44'; ctx.fillRect(fruit.x-2, fruit.y-15, 4, 7);

            ctx.restore();

            // HUD Moon
            ctx.fillStyle = '#fff'; ctx.shadowBlur = 30; ctx.shadowColor = '#fff';
            ctx.beginPath(); ctx.arc(80, 80, 30, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
        }
        requestAnimationFrame(loop);
    }
    loop();
</script>
</body>
</html>
