<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snakie Makie - Space</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; background: #000814; color: #00d4ff; font-family: 'Segoe UI', sans-serif; overflow: hidden; touch-action: none; }
        canvas { display: block; background: radial-gradient(circle, #001d3d 0%, #000814 100%); }
        .menu, .pop-up, .shop-screen { position: fixed; inset: 0; background: rgba(0,8,20,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; }
        input, button { background: #001d3d; border: 2px solid #00d4ff; color: #00d4ff; padding: 12px; margin: 5px; border-radius: 8px; font-size: 16px; width: 220px; }
        button { background: #00d4ff; color: #000814; font-weight: bold; cursor: pointer; box-shadow: 0 0 10px rgba(0,212,255,0.3); }
        .hidden { display: none !important; }
        #chat-ui { position: fixed; bottom: 10px; left: 10px; z-index: 60; width: 200px; }
        #msgs { height: 80px; overflow-y: auto; background: rgba(0,29,61,0.8); font-size: 11px; padding: 5px; border-radius: 5px; border: 1px solid #00d4ff; }
        #stats { position: fixed; top: 10px; right: 10px; background: rgba(0,29,61,0.8); padding: 10px; border: 1px solid #00d4ff; border-radius: 5px; font-size: 12px; }
        .skin-item { display: inline-block; padding: 10px; border: 1px solid #00d4ff; margin: 5px; border-radius: 5px; width: 80px; }
    </style>
</head>
<body>

<div id="stats" class="hidden">SCORE: <span id="my-score">0</span> | FRUITS: <span id="fruit-count">0</span></div>

<div id="menu" class="menu">
    <h1 style="color:#00d4ff; text-shadow: 0 0 20px #00d4ff;">SNAKIE MAKIE</h1>
    <p>PIN: <b id="display-id" style="font-size: 24px;">----</b></p>
    <div>
        <button id="btn-p" onclick="setMode('peaceful')">PEACEFUL</button>
        <button id="btn-s" onclick="setMode('survival')">3 LIVES</button>
    </div>
    <input type="number" id="join-id" placeholder="ENTER PIN">
    <button onclick="startJoin()">JOIN ROOM</button>
    <button onclick="toggleShop(true)" style="background:#ffc300; border-color:#ffc300">SKINS SHOP</button>
</div>

<div id="shop" class="shop-screen hidden">
    <h2>SKINS SHOP</h2>
    <p>Fruits: <span id="shop-fruits">0</span></p>
    <div class="skin-item" onclick="buySkin('#00d4ff', 0)">Cyan (Free)</div>
    <div class="skin-item" onclick="buySkin('#ffc300', 5)">Gold (5)</div>
    <div class="skin-item" onclick="buySkin('#7209b7', 10)">Purple (10)</div>
    <div class="skin-item" onclick="buySkin('#4cc9f0', 15)">Neon (15)</div>
    <br><button onclick="toggleShop(false)">BACK</button>
</div>

<div id="game-over" class="pop-up hidden">
    <h1 id="status-msg">ELIMINATED</h1>
    <button onclick="rematch()">REMATCH</button>
    <button onclick="location.reload()">MENU</button>
</div>

<div id="chat-ui" class="hidden">
    <div id="msgs"></div>
    <input type="text" id="chat-in" style="width:100%" placeholder="Chat..." onkeypress="if(event.key==='Enter') sendChat()">
</div>

<canvas id="c"></canvas>

<script>
    const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
    let peer, conn, isPlaying = false, angle = 0, stars = [];
    let mySnake = [], otherSnake = [], fruit = {x: 100, y: 100};
    let score = 0, enemyScore = 0, totalFruits = localStorage.getItem('fruits') || 0;
    let myColor = localStorage.getItem('skin') || '#00d4ff', gameMode = 'peaceful';

    const roomPin = Math.floor(1000 + Math.random() * 9000).toString();
    peer = new Peer('snakie-' + roomPin);
    peer.on('open', id => { document.getElementById('display-id').innerText = roomPin; });
    peer.on('connection', c => { conn = c; setupConn(); conn.on('open', () => { conn.send({type:'sync', mode:gameMode, color:myColor}); preStart(); }); });

    function setMode(m) { gameMode = m; document.getElementById('btn-p').style.opacity = m==='peaceful'?'1':'0.5'; }
    function toggleShop(show) { document.getElementById('shop').className = show ? 'shop-screen' : 'shop-screen hidden'; document.getElementById('shop-fruits').innerText = totalFruits; }
    function buySkin(c, p) { if(totalFruits >= p) { myColor = c; totalFruits -= p; localStorage.setItem('fruits', totalFruits); localStorage.setItem('skin', c); toggleShop(false); } else { alert("Not enough fruits!"); } }

    function startJoin() { conn = peer.connect('snakie-' + document.getElementById('join-id').value); setupConn(); }
    function setupConn() {
        conn.on('data', data => {
            if(data.type === 'sync') { gameMode = data.mode; enemyColor = data.color; preStart(); }
            if(data.type === 'move') { otherSnake = data.body; otherColor = data.color; }
            if(data.type === 'fruit') fruit = data.pos;
            if(data.type === 'chat') addMsg("Them: " + data.txt);
            if(data.type === 'dead') win();
            if(data.type === 'rematch') preStart();
        });
    }

    function preStart() {
        document.getElementById('menu').classList.add('hidden');
        document.getElementById('stats').classList.remove('hidden');
        document.getElementById('chat-ui').classList.remove('hidden');
        mySnake = Array(15).fill({x: canvas.width/2, y: canvas.height/2});
        isPlaying = true;
    }

    function addMsg(t) { const m = document.getElementById('msgs'); m.innerHTML += `<div>${t}</div>`; m.scrollTop = m.scrollHeight; }
    function sendChat() { const i = document.getElementById('chat-in'); if(conn) conn.send({type:'chat', txt:i.value}); addMsg("You: "+i.value); i.value=''; }

    function die() {
        if(gameMode === 'peaceful') return; 
        isPlaying = false; document.getElementById('status-msg').innerText = "ELIMINATED";
        document.getElementById('game-over').classList.remove('hidden');
        if(conn) conn.send({type:'dead'});
    }
    function win() { isPlaying = false; document.getElementById('status-msg').innerText = "YOU WON!"; document.getElementById('game-over').classList.remove('hidden'); }
    function rematch() { if(conn) conn.send({type:'rematch'}); preStart(); }

    // Init Stars
    for(let i=0; i<100; i++) stars.push({x: Math.random()*2000, y: Math.random()*2000, s: Math.random()*2});

    window.addEventListener('touchmove', e => { angle = Math.atan2(e.touches[0].clientY - window.innerHeight/2, e.touches[0].clientX - window.innerWidth/2); });

    function loop() {
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        ctx.fillStyle = '#000814'; ctx.fillRect(0,0,canvas.width,canvas.height);
        
        // Draw Stars
        ctx.fillStyle = "white";
        stars.forEach(s => { ctx.beginPath(); ctx.arc(s.x % canvas.width, s.y % canvas.height, s.s, 0, 7); ctx.fill(); });

        if(isPlaying) {
            const head = { x: mySnake[0].x + Math.cos(angle)*3, y: mySnake[0].y + Math.sin(angle)*3 };
            if(head.x < 0 || head.x > canvas.width || head.y < 0 || head.y > canvas.height) die();
            mySnake.unshift(head);
            if(Math.hypot(head.x - fruit.x, head.y - fruit.y) < 20) {
                fruit = {x: Math.random()*canvas.width, y: Math.random()*canvas.height};
                totalFruits++; score++; localStorage.setItem('fruits', totalFruits);
                if(conn) { conn.send({type:'fruit', pos:fruit}); }
            } else { mySnake.pop(); }
            if(conn) conn.send({type:'move', body:mySnake, color:myColor});

            document.getElementById('my-score').innerText = score;
            document.getElementById('fruit-count').innerText = totalFruits;

            // Draw Snakes
            ctx.lineWidth = 12; ctx.lineCap = 'round';
            ctx.strokeStyle = otherColor || '#ff0055'; ctx.beginPath(); otherSnake.forEach(p => ctx.lineTo(p.x, p.y)); ctx.stroke();
            ctx.strokeStyle = myColor; ctx.beginPath(); mySnake.forEach(p => ctx.lineTo(p.x, p.y)); ctx.stroke();
            
            // Draw Fruit (Glowy)
            ctx.fillStyle = '#ffc300'; ctx.shadowBlur = 15; ctx.shadowColor = '#ffc300';
            ctx.beginPath(); ctx.arc(fruit.x, fruit.y, 8, 0, 7); ctx.fill();
            ctx.shadowBlur = 0;
        }
        requestAnimationFrame(loop);
    }
    let otherColor, enemyColor;
    loop();
</script>
</body>
</html>
