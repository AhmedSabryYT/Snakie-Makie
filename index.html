<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snakie Makie - Ultimate</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; background: #050505; color: #00ffcc; font-family: 'Segoe UI', sans-serif; overflow: hidden; touch-action: none; }
        canvas { display: block; }
        .menu, .pop-up { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; padding: 20px; }
        input, button { background: #111; border: 2px solid #00ffcc; color: #00ffcc; padding: 12px; margin: 5px; border-radius: 8px; font-size: 16px; width: 220px; }
        button { background: #00ffcc; color: #000; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:active { transform: scale(0.95); box-shadow: 0 0 20px #00ffcc; }
        .mode-btn { background: #111; color: #00ffcc; width: 105px; display: inline-block; font-size: 12px; }
        .active-mode { background: #00ffcc; color: #000; }
        #chat-ui { position: fixed; bottom: 10px; left: 10px; z-index: 60; width: 200px; }
        #msgs { height: 80px; overflow-y: auto; background: rgba(0,0,0,0.8); font-size: 11px; padding: 5px; border-radius: 5px; border: 1px solid #333; }
        #leaderboard { position: fixed; top: 10px; right: 10px; background: rgba(0,0,0,0.8); padding: 10px; border: 1px solid #00ffcc; font-size: 14px; z-index: 60; border-radius: 5px; }
        #lives-ui { position: fixed; top: 10px; left: 10px; font-size: 18px; color: #ff0055; text-shadow: 0 0 10px #ff0055; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="lives-ui" class="hidden">❤❤❤</div>
<div id="leaderboard" class="hidden">YOU: 0 | THEM: 0</div>

<div id="menu" class="menu">
    <h1 style="letter-spacing: 3px;">SNAKIE MAKIE</h1>
    <p>GAME PIN: <b id="display-id" style="font-size: 24px; color:#fff">----</b></p>
    
    <div id="host-options">
        <p>SELECT MODE:</p>
        <button id="btn-p" class="mode-btn active-mode" onclick="setMode('peaceful')">PEACEFUL</button>
        <button id="btn-s" class="mode-btn" onclick="setMode('survival')">3 LIVES</button>
    </div>

    <input type="number" id="join-id" placeholder="ENTER PIN">
    <button onclick="startJoin()">JOIN ROOM</button>
    <button style="background: #333; color: #fff; border: none;">SHOP (COMING SOON)</button>
</div>

<div id="game-over" class="pop-up hidden">
    <h1 id="status-msg">GAME OVER</h1>
    <button onclick="rematch()">REMATCH (REVENGE)</button>
    <button onclick="location.reload()">QUIT TO MENU</button>
</div>

<div id="chat-ui" class="hidden">
    <div id="msgs"></div>
    <input type="text" id="chat-in" style="width:100%; box-sizing:border-box" placeholder="Message..." onkeypress="if(event.key==='Enter') sendChat()">
</div>

<canvas id="c"></canvas>

<script>
    const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
    let peer, conn, isPlaying = false, canMove = false, angle = 0;
    let mySnake = [], otherSnake = [], fruit = {x: 150, y: 150};
    let myScore = 0, enemyScore = 0, myLives = 3, gameMode = 'peaceful';

    const roomPin = Math.floor(1000 + Math.random() * 9000).toString();
    peer = new Peer('snakie-' + roomPin);

    peer.on('open', id => { document.getElementById('display-id').innerText = roomPin; });
    peer.on('connection', c => { 
        conn = c; setupConn(); 
        conn.on('open', () => { conn.send({type: 'sync', mode: gameMode}); preStart(); });
    });

    function setMode(m) {
        gameMode = m;
        document.getElementById('btn-p').className = 'mode-btn' + (m==='peaceful'?' active-mode':'');
        document.getElementById('btn-s').className = 'mode-btn' + (m==='survival'?' active-mode':'');
    }

    function startJoin() {
        const pin = document.getElementById('join-id').value;
        conn = peer.connect('snakie-' + pin);
        setupConn();
    }

    function setupConn() {
        conn.on('data', data => {
            if(data.type === 'sync') { gameMode = data.mode; preStart(); }
            if(data.type === 'move') otherSnake = data.body;
            if(data.type === 'fruit') fruit = data.pos;
            if(data.type === 'chat') addMsg("Them: " + data.txt);
            if(data.type === 'life-lost') { enemyScore++; updateUI(); }
            if(data.type === 'rematch') preStart();
            if(data.type === 'scored') { enemyScore++; updateUI(); }
        });
    }

    function preStart() {
        document.getElementById('menu').classList.add('hidden');
        document.getElementById('game-over').classList.add('hidden');
        document.getElementById('chat-ui').classList.remove('hidden');
        document.getElementById('leaderboard').classList.remove('hidden');
        if(gameMode === 'survival') document.getElementById('lives-ui').classList.remove('hidden');
        
        mySnake = Array(15).fill({x: window.innerWidth/2, y: window.innerHeight/2});
        myLives = 3; updateUI();
        isPlaying = true; canMove = true;
    }

    function sendChat() {
        const i = document.getElementById('chat-in');
        if(!i.value) return;
        addMsg("You: " + i.value);
        if(conn) conn.send({type: 'chat', txt: i.value});
        i.value = '';
    }

    function addMsg(t) {
        const m = document.getElementById('msgs');
        m.innerHTML += `<div>${t}</div>`;
        m.scrollTop = m.scrollHeight;
    }

    function handleDeath() {
        if(gameMode === 'peaceful') {
            mySnake = Array(15).fill({x: window.innerWidth/2, y: window.innerHeight/2});
            return;
        }
        myLives--;
        updateUI();
        if(conn) conn.send({type: 'life-lost'});
        if(myLives <= 0) {
            isPlaying = false;
            document.getElementById('status-msg').innerText = "ELIMINATED";
            document.getElementById('game-over').classList.remove('hidden');
        } else {
            mySnake = Array(15).fill({x: window.innerWidth/2, y: window.innerHeight/2});
        }
    }

    function updateUI() {
        document.getElementById('leaderboard').innerText = `YOU: ${myScore} | THEM: ${enemyScore}`;
        document.getElementById('lives-ui').innerText = "❤".repeat(myLives);
    }

    function rematch() { if(conn) conn.send({type: 'rematch'}); preStart(); }

    window.addEventListener('touchmove', e => {
        const t = e.touches[0];
        angle = Math.atan2(t.clientY - window.innerHeight/2, t.clientX - window.innerWidth/2);
    });

    function loop() {
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        ctx.fillStyle = '#050505'; ctx.fillRect(0,0,canvas.width,canvas.height);

        if(isPlaying) {
            const head = { x: mySnake[0].x + Math.cos(angle)*3, y: mySnake[0].y + Math.sin(angle)*3 };
            
            if(head.x < 0 || head.x > canvas.width || head.y < 0 || head.y > canvas.height) handleDeath();

            mySnake.unshift(head);
            if(Math.hypot(head.x - fruit.x, head.y - fruit.y) < 20) {
                fruit = {x: Math.random()*canvas.width, y: Math.random()*canvas.height};
                myScore++; updateUI();
                if(conn) { conn.send({type: 'fruit', pos: fruit}); conn.send({type: 'scored'}); }
            } else { mySnake.pop(); }

            if(conn && conn.open) conn.send({type: 'move', body: mySnake});

            ctx.fillStyle = '#ff0055'; ctx.beginPath(); ctx.arc(fruit.x, fruit.y, 10, 0, Math.PI*2); ctx.fill();
            ctx.lineWidth = 12; ctx.lineCap = 'round';
            ctx.strokeStyle = '#ff0055'; ctx.beginPath(); otherSnake.forEach(p => ctx.lineTo(p.x, p.y)); ctx.stroke();
            ctx.strokeStyle = '#00ffcc'; ctx.beginPath(); mySnake.forEach(p => ctx.lineTo(p.x, p.y)); ctx.stroke();
        }
        requestAnimationFrame(loop);
    }
    loop();
</script>
</body>
</html>
