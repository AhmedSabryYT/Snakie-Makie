<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snakie - Midnight Social</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --accent: #a29bfe; --bg: #020208; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; overflow: hidden; touch-action: none; }
        canvas { display: block; }
        .ui-layer { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 100; pointer-events: none; }
        .panel { background: rgba(10, 10, 20, 0.98); border: 1px solid #334; padding: 25px; border-radius: 20px; pointer-events: auto; width: 320px; text-align: center; box-shadow: 0 0 40px #000; }
        button { background: #1a1a2e; border: 1px solid #445; color: #fff; padding: 12px; margin: 5px 0; width: 100%; border-radius: 12px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover:not(:disabled) { border-color: var(--accent); background: #252545; }
        #chat-box { position: fixed; bottom: 20px; left: 20px; width: 250px; pointer-events: none; z-index: 200; }
        #chat-log { height: 120px; overflow-y: auto; font-size: 12px; background: rgba(0,0,0,0.5); padding: 5px; border-radius: 5px; margin-bottom: 5px; color: #ccc; }
        #chat-input { pointer-events: auto; width: 100%; background: rgba(20,20,40,0.8); border: 1px solid #445; color: #fff; padding: 8px; border-radius: 5px; display: none; }
        #hud { position: fixed; top: 20px; left: 20px; font-size: 18px; text-shadow: 0 2px 4px #000; z-index: 50; }
        #fire-btn { position: fixed; bottom: 40px; right: 40px; width: 80px; height: 80px; background: rgba(255,69,0,0.6); border: 2px solid orange; border-radius: 50%; color: white; font-weight: bold; z-index: 300; display: none; pointer-events: auto; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<canvas id="g"></canvas>
<div id="hud">💎 Gems: <span id="gem-count">0</span> <span id="mode-text"></span></div>
<button id="fire-btn" onmousedown="fireBall()" ontouchstart="fireBall()">FIRE</button>

<div id="chat-box">
    <div id="chat-log"></div>
    <input type="text" id="chat-input" placeholder="Press Enter to Chat...">
</div>

<div id="m" class="ui-layer">
    <div class="panel">
        <h1 style="letter-spacing:8px; color:var(--accent); margin:0;">SNAKIE</h1>
        <button onclick="pickMode(false)">SINGLE PLAYER</button>
        <button onclick="pickMode(true)">MULTIPLAYER</button>
        <button onclick="toggleLayer('color-menu')">CHANGE SKIN (10💎)</button>
    </div>
</div>

<div id="mode-selector" class="ui-layer hidden">
    <div class="panel">
        <h2 id="target-mode-title">SELECT MODE</h2>
        <button onclick="startGame('peaceful')">PEACEFUL MODE</button>
        <button onclick="startGame('normal')">NORMAL MODE</button>
        <button onclick="startGame('story')">STORY MODE (30 LVLS)</button>
        <button onclick="toggleLayer('m')">BACK</button>
    </div>
</div>

<div id="game-over" class="ui-layer hidden">
    <div class="panel">
        <h1 style="color:#ff7675">GAME OVER</h1>
        <button onclick="location.reload()">RETRY</button>
        <button onclick="location.reload()">MAIN MENU</button>
    </div>
</div>

<div id="color-menu" class="ui-layer hidden">
    <div class="panel">
        <h3>CHOOSE GRADIENT</h3>
        <input type="color" id="c1" value="#a29bfe" style="width:100%; height:40px; border:none; border-radius:8px;">
        <input type="color" id="c2" value="#6c5ce7" style="width:100%; height:40px; border:none; border-radius:8px;">
        <button id="buy-color-btn" onclick="saveGradient()">APPLY (10💎)</button>
        <button onclick="toggleLayer('m')">CANCEL</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('g'), ctx = canvas.getContext('2d');
    let peer, conn, isGame = false, isMulti = false, gameMode = 'peaceful';
    let snake = [], otherSnake = [], fruit = {x:0, y:0};
    let enemies = [], fireballs = [], level = 1, storyProgress = 0;
    let angle = 0, currAngle = 0, otherAngle = 0, cam = {x: 0, y: 0}, gems = 0;
    
    let myConfig = { color1: '#a29bfe', color2: '#6c5ce7', gems: 0 };
    const saved = localStorage.getItem('snakie_data');
    if(saved) { myConfig = JSON.parse(saved); gems = myConfig.gems; document.getElementById('gem-count').innerText = gems; }

    function toggleLayer(id) {
        document.querySelectorAll('.ui-layer').forEach(l => l.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
    }

    function pickMode(multi) {
        isMulti = multi;
        document.getElementById('target-mode-title').innerText = multi ? "MULTIPLAYER MODE" : "SINGLEPLAYER MODE";
        toggleLayer('mode-selector');
    }

    function startGame(mode) {
        gameMode = mode;
        isGame = true;
        document.getElementById('mode-text').innerText = "| " + mode.toUpperCase();
        if(mode === 'story') document.getElementById('fire-btn').style.display = 'block';
        toggleLayer('none');
        snake = Array(20).fill({x: 0, y: 0});
        spawnFruit();
    }

    function fireBall() {
        if(gameMode !== 'story') return;
        fireballs.push({x: snake[0].x, y: snake[0].y, vx: Math.cos(currAngle)*10, vy: Math.sin(currAngle)*10});
    }

    function die() {
        isGame = false;
        toggleLayer('game-over');
    }

    function spawnFruit() { fruit = { x: snake[0].x + (Math.random()*800-400), y: snake[0].y + (Math.random()*800-400) }; }

    window.addEventListener('touchmove', e => {
        angle = Math.atan2(e.touches[0].clientY - window.innerHeight/2, e.touches[0].clientX - window.innerWidth/2);
    });

    function drawEyes(h, ang) {
        const drawE = (side) => {
            let ex = h.x + Math.cos(ang + 0.5 * side) * 10;
            let ey = h.y + Math.sin(ang + 0.5 * side) * 10;
            ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(ex, ey, 6, 0, 7); ctx.fill();
            ctx.fillStyle = 'black'; ctx.beginPath(); ctx.arc(ex + Math.cos(ang)*2.5, ey + Math.sin(ang)*2.5, 3, 0, 7); ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.beginPath(); ctx.arc(ex-1, ey-1, 1.5, 0, 7); ctx.fill();
        };
        drawE(1); drawE(-1);
    }

    function loop() {
        requestAnimationFrame(loop);
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        ctx.fillStyle = '#020208'; ctx.fillRect(0,0,canvas.width,canvas.height);

        if(!isGame) return;

        cam.x += (snake[0].x - canvas.width/2 - cam.x) * 0.1;
        cam.y += (snake[0].y - canvas.height/2 - cam.y) * 0.1;

        // Normal Mode Red Zone
        if(gameMode === 'normal') {
            ctx.strokeStyle = 'red'; ctx.lineWidth = 5;
            ctx.strokeRect(-1000 - cam.x, -1000 - cam.y, 2000, 2000);
            if(Math.abs(snake[0].x) > 1000 || Math.abs(snake[0].y) > 1000) die();
        }

        ctx.save(); ctx.translate(-cam.x, -cam.y);

        // Movement
        let d = angle - currAngle;
        while(d < -Math.PI) d += Math.PI*2; while(d > Math.PI) d -= Math.PI*2;
        currAngle += d * 0.08;
        const h = { x: snake[0].x + Math.cos(currAngle)*4, y: snake[0].y + Math.sin(currAngle)*4 };
        snake.unshift(h);
        if(Math.hypot(h.x-fruit.x, h.y-fruit.y) < 25) { spawnFruit(); gems++; document.getElementById('gem-count').innerText = gems; }
        else { snake.pop(); }

        // Normal Mode: Body Collision
        if(gameMode === 'normal') {
           for(let i=5; i<snake.length; i++) if(Math.hypot(h.x-snake[i].x, h.y-snake[i].y) < 10) die();
        }

        // Story Mode Logic
        if(gameMode === 'story') {
            if(Math.random() < 0.02) enemies.push({x: snake[0].x + 800, y: snake[0].y + (Math.random()*600-300), hp: level});
            enemies.forEach((e, ei) => {
                e.x -= 2;
                ctx.fillStyle = level === 30 ? 'purple' : 'red';
                ctx.beginPath(); ctx.rect(e.x, e.y, 30, 30); ctx.fill();
                if(Math.hypot(h.x-e.x, h.y-e.y) < 30) die();
            });
            fireballs.forEach((f, fi) => {
                f.x += f.vx; f.y += f.vy;
                ctx.fillStyle = 'orange'; ctx.beginPath(); ctx.arc(f.x, f.y, 8, 0, 7); ctx.fill();
                enemies.forEach((e, ei) => {
                    if(Math.hypot(f.x-e.x, f.y-e.y) < 30) { enemies.splice(ei, 1); fireballs.splice(fi, 1); storyProgress++; }
                });
            });
            if(storyProgress > 10) { level++; storyProgress = 0; }
        }

        // Render Snake
        let g = ctx.createLinearGradient(snake[0].x, snake[0].y, snake[snake.length-1].x, snake[snake.length-1].y);
        g.addColorStop(0, myConfig.color1); g.addColorStop(1, myConfig.color2);
        ctx.lineCap='round'; ctx.lineWidth=24; ctx.strokeStyle=g;
        ctx.beginPath(); snake.forEach(p=>ctx.lineTo(p.x,p.y)); ctx.stroke();
        drawEyes(snake[0], currAngle);

        // Apple
        ctx.fillStyle = '#ff4d4d'; ctx.beginPath(); ctx.arc(fruit.x, fruit.y, 12, 0, 7); ctx.fill();

        ctx.restore();
    }
    loop();
</script>
</body>
</html>
