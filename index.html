<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snakie - Midnight Connection</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; background: #050510; color: #fff; font-family: 'Verdana', sans-serif; overflow: hidden; touch-action: none; }
        canvas { display: block; position: absolute; top: 0; left: 0; }
        
        .ui { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 100; pointer-events: none; }
        .panel { 
            background: rgba(20, 20, 35, 0.95); border: 1px solid #445; 
            padding: 30px; border-radius: 15px; pointer-events: auto; width: 280px; text-align: center;
        }
        h1 { font-weight: normal; letter-spacing: 3px; margin: 0 0 20px 0; }
        
        button { 
            background: #2a2a40; border: 1px solid #445; color: #fff; 
            padding: 12px; margin: 5px 0; width: 100%; border-radius: 8px; cursor: pointer;
        }
        button:active { background: #445; }
        
        input { background: #151520; border: 1px solid #445; color: #fff; padding: 12px; width: 85%; border-radius: 8px; text-align: center; margin-bottom: 10px; }
        .hidden { display: none !important; }
        
        #status-overlay { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.8); padding: 20px; border-radius: 10px; display: none; z-index: 200; }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>
<div id="status-overlay">Connecting to friend...</div>

<div id="menu" class="ui">
    <div class="panel">
        <h1>SNAKIE</h1>
        <button onclick="startSingle()">SINGLE PLAYER</button>
        <button onclick="showMulti()">MULTIPLAYER</button>
        <button onclick="changeColor()">CHANGE COLOR</button>
        <div id="color-preview" style="width:100%; height:5px; background:#6c5ce7; margin-top:10px;"></div>
    </div>
</div>

<div id="multi-panel" class="ui hidden">
    <div class="panel">
        <p style="font-size: 10px; color: #889;">YOUR CODE</p>
        <h2 id="my-pin" style="font-size: 36px; margin: 10px 0;">....</h2>
        <input type="number" id="friend-pin" placeholder="FRIEND CODE">
        <button onclick="connectPeer()">JOIN GAME</button>
        <button onclick="location.reload()" style="background:transparent; border:none; color:#667;">Back</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let peer, conn, isGame = false, isMulti = false;
    
    let snake = [], otherSnake = [], fruit = {x:0, y:0};
    let angle = 0, currAngle = 0, score = 0;
    let cam = {x: 0, y: 0};
    
    const colors = ['#6c5ce7', '#00b894', '#0984e3', '#e17055', '#fdcb6e'];
    let colorIdx = 0;
    let myColor = colors[0];
    let otherColor = '#fff';

    // --- CONNECTION LOGIC FIX ---
    function initPeer() {
        const pin = Math.floor(1000 + Math.random() * 8999);
        peer = new Peer('snk-' + pin);
        peer.on('open', id => document.getElementById('my-pin').innerText = pin);
        
        peer.on('connection', c => {
            conn = c;
            isMulti = true;
            setupConnEvents();
            // Host starts game when client connects
            startGame();
        });
    }

    function showMulti() {
        document.getElementById('menu').classList.add('hidden');
        document.getElementById('multi-panel').classList.remove('hidden');
        initPeer();
    }

    function connectPeer() {
        const p = document.getElementById('friend-pin').value;
        if(!p) return;
        
        document.getElementById('status-overlay').style.display = 'block';
        conn = peer.connect('snk-' + p);
        
        conn.on('open', () => {
            document.getElementById('status-overlay').style.display = 'none';
            isMulti = true;
            setupConnEvents();
            startGame();
        });

        conn.on('error', () => {
            alert("Friend not found! Check the code.");
            document.getElementById('status-overlay').style.display = 'none';
        });
    }

    function setupConnEvents() {
        conn.on('data', d => {
            if(d.t === 'm') { otherSnake = d.pos; otherColor = d.col; }
        });
    }

    function changeColor() {
        colorIdx = (colorIdx + 1) % colors.length;
        myColor = colors[colorIdx];
        document.getElementById('color-preview').style.background = myColor;
    }

    function startSingle() { isMulti = false; startGame(); }

    function startGame() {
        isGame = true;
        document.querySelectorAll('.ui').forEach(u => u.classList.add('hidden'));
        snake = Array(20).fill({x: 0, y: 0});
        spawnFruit();
    }

    function spawnFruit() {
        fruit = { x: snake[0].x + (Math.random()*600-300), y: snake[0].y + (Math.random()*600-300) };
    }

    // Input & Environment
    window.addEventListener('touchmove', e => {
        angle = Math.atan2(e.touches[0].clientY - window.innerHeight/2, e.touches[0].clientX - window.innerWidth/2);
    });

    let stars = Array(150).fill(0).map(() => ({x: Math.random()*2000, y: Math.random()*2000, s: Math.random()*2}));
    let moonRot = 0;

    function loop() {
        requestAnimationFrame(loop);
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        ctx.fillStyle = '#050510'; ctx.fillRect(0,0,canvas.width,canvas.height);

        if(!isGame) return;

        cam.x += (snake[0].x - canvas.width/2 - cam.x) * 0.1;
        cam.y += (snake[0].y - canvas.height/2 - cam.y) * 0.1;

        // Moon (Calm & Spinning)
        ctx.save();
        ctx.translate(canvas.width - 100, 100);
        moonRot += 0.005; ctx.rotate(moonRot);
        ctx.fillStyle = '#dfe6e9'; ctx.beginPath(); ctx.arc(0,0,40,0,7); ctx.fill();
        ctx.fillStyle = '#b2bec3'; // Craters
        ctx.beginPath(); ctx.arc(10, 10, 6, 0, 7); ctx.fill();
        ctx.beginPath(); ctx.arc(-15, -5, 10, 0, 7); ctx.fill();
        ctx.restore();

        ctx.save(); ctx.translate(-cam.x, -cam.y);

        // Stars (Flowing correctly)
        ctx.fillStyle = '#fff';
        stars.forEach(s => {
            let sx = (s.x - cam.x * 0.3) % 2000; if(sx<0) sx+=2000;
            let sy = (s.y - cam.y * 0.3) % 2000; if(sy<0) sy+=2000;
            ctx.beginPath(); ctx.arc(cam.x + sx - 1000, cam.y + sy - 1000, s.s, 0, 7); ctx.fill();
        });

        // Snake Movement
        let diff = angle - currAngle;
        while(diff < -Math.PI) diff += Math.PI*2;
        while(diff > Math.PI) diff -= Math.PI*2;
        currAngle += diff * 0.08;

        const head = { x: snake[0].x + Math.cos(currAngle)*3.5, y: snake[0].y + Math.sin(currAngle)*3.5 };
        snake.unshift(head);
        if(Math.hypot(head.x - fruit.x, head.y - fruit.y) < 25) spawnFruit(); else snake.pop();

        if(isMulti && conn && conn.open) conn.send({t:'m', pos:snake, col:myColor});

        // Draw Snakes
        const drawS = (body, c) => {
            if(!body.length) return;
            ctx.lineCap='round'; ctx.lineWidth=22; ctx.strokeStyle=c;
            ctx.beginPath(); body.forEach(p => ctx.lineTo(p.x, p.y)); ctx.stroke();
            // 2 Canvas Eyes
            const h = body[0];
            ctx.fillStyle = 'white';
            ctx.beginPath(); ctx.arc(h.x + Math.cos(currAngle+0.5)*8, h.y + Math.sin(currAngle+0.5)*8, 5, 0, 7); ctx.fill();
            ctx.beginPath(); ctx.arc(h.x + Math.cos(currAngle-0.5)*8, h.y + Math.sin(currAngle-0.5)*8, 5, 0, 7); ctx.fill();
        };

        drawS(otherSnake, otherColor);
        drawS(snake, myColor);
        
        ctx.fillStyle = '#e17055'; ctx.beginPath(); ctx.arc(fruit.x, fruit.y, 12, 0, 7); ctx.fill();
        ctx.restore();

        // Top-Center Arrow
        if(isMulti && otherSnake.length) {
            let dx = otherSnake[0].x - snake[0].x, dy = otherSnake[0].y - snake[0].y;
            let dist = Math.hypot(dx, dy);
            if(dist > 200) {
                ctx.save(); ctx.translate(canvas.width/2, 80);
                ctx.rotate(Math.atan2(dy, dx));
                ctx.fillStyle = '#ff7675';
                ctx.beginPath(); ctx.moveTo(15,0); ctx.lineTo(-10,-8); ctx.lineTo(-10,8); ctx.fill();
                ctx.restore();
            }
        }
    }
    loop();
</script>
</body>
</html>
