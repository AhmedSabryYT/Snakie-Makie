<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snakie - Find Friend</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; background: #050510; color: #fff; font-family: 'Verdana', sans-serif; overflow: hidden; touch-action: none; }
        canvas { display: block; position: absolute; top: 0; left: 0; }
        
        .ui { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 100; pointer-events: none; }
        .panel { 
            background: rgba(25, 25, 40, 0.95); border: 1px solid #556; 
            padding: 30px; border-radius: 20px; pointer-events: auto; width: 280px; text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }
        h1 { font-weight: normal; margin: 0 0 10px 0; font-size: 24px; color: #a29bfe; }
        
        button { 
            background: #341f97; border: none; color: #fff; 
            padding: 14px; margin: 8px 0; width: 100%; border-radius: 8px; 
            font-size: 14px; font-weight: bold; cursor: pointer;
        }
        button:active { background: #5f27cd; }
        
        input { background: #101018; border: 1px solid #445; color: #fff; padding: 12px; width: 85%; border-radius: 6px; text-align: center; margin-bottom: 15px; }
        .hidden { display: none !important; }
        
        #status { position: fixed; top: 10px; left: 10px; font-size: 12px; color: #00b894; display: none; }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>
<div id="status">● Connected</div>

<div id="menu" class="ui">
    <div class="panel">
        <h1>SNAKIE</h1>
        <div style="height: 10px;"></div>
        <button onclick="startGame()">SINGLE PLAYER</button>
        <button onclick="showMulti()">MULTIPLAYER</button>
        <button onclick="changeColor()">CHANGE COLOR</button>
        <div id="color-preview" style="width: 100%; height: 4px; background: #6c5ce7; margin-top: 15px; border-radius: 10px;"></div>
    </div>
</div>

<div id="multi-panel" class="ui hidden">
    <div class="panel">
        <p style="font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: #889;">Your Code</p>
        <h2 id="my-pin" style="font-size: 40px; margin: 5px 0 20px 0; color: #fff;">...</h2>
        <input type="number" id="friend-pin" placeholder="ENTER FRIEND CODE">
        <button onclick="connectPeer()">JOIN FRIEND</button>
        <button onclick="location.reload()" style="background: transparent; border: 1px solid #445; color: #889; margin-top: 10px;">CANCEL</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let peer, conn, isGame = false, isMulti = false;
    
    // Game State
    let snake = [], otherSnake = [], fruit = {x:0, y:0};
    let angle = 0, currAngle = 0, score = 0;
    let cam = {x: 0, y: 0};
    
    // Colors
    const colors = ['#6c5ce7', '#00b894', '#0984e3', '#e17055', '#fdcb6e', '#a29bfe'];
    let colorIdx = 0;
    let myColor = colors[0];
    let otherColor = '#ff7675';

    // --- 1. ROBUST CONNECTION (Auto-Retry) ---
    function initPeer() {
        const pin = Math.floor(Math.random() * 8999) + 1000;
        peer = new Peer('snk-' + pin); // Short ID prefix
        
        peer.on('open', (id) => {
            document.getElementById('my-pin').innerText = pin;
        });

        peer.on('connection', (c) => {
            conn = c; isMulti = true; setupConn(); startGame();
        });
        
        peer.on('error', (err) => {
            // If ID taken, try again silently
            if(err.type === 'unavailable-id') initPeer();
        });
    }

    function showMulti() {
        document.getElementById('menu').classList.add('hidden');
        document.getElementById('multi-panel').classList.remove('hidden');
        initPeer();
    }

    function connectPeer() {
        const p = document.getElementById('friend-pin').value;
        if(!p) return alert("Enter the 4-digit code");
        conn = peer.connect('snk-' + p);
        isMulti = true; setupConn(); startGame();
    }

    function setupConn() {
        document.getElementById('status').style.display = 'block';
        conn.on('open', () => {
            // Send initial "Hello" packet to force arrow to appear
            conn.send({t: 'm', pos: snake, col: myColor});
        });
        conn.on('data', (d) => {
            if(d.t === 'm') { 
                otherSnake = d.pos; 
                otherColor = d.col; 
            }
        });
    }

    function changeColor() {
        colorIdx = (colorIdx + 1) % colors.length;
        myColor = colors[colorIdx];
        document.getElementById('color-preview').style.background = myColor;
    }

    // --- 2. GAME SETUP ---
    function startGame() {
        isGame = true;
        document.querySelectorAll('.ui').forEach(u => u.classList.add('hidden'));
        snake = Array(20).fill({x: 0, y: 0});
        spawnFruit();
    }

    function spawnFruit() {
        // Spawn near player
        fruit = {
            x: snake[0].x + (Math.random() * 600 - 300), 
            y: snake[0].y + (Math.random() * 600 - 300)
        };
    }

    window.addEventListener('touchmove', e => {
        let dx = e.touches[0].clientX - window.innerWidth/2;
        let dy = e.touches[0].clientY - window.innerHeight/2;
        angle = Math.atan2(dy, dx);
    });

    let stars = Array(150).fill(0).map(() => ({x: Math.random()*2000, y: Math.random()*2000, s: Math.random()*2}));
    let moonRot = 0;

    function loop() {
        requestAnimationFrame(loop);
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        
        // Deep Night Background
        ctx.fillStyle = '#050510';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        if(!isGame) return;

        // Camera Follow
        cam.x += (snake[0].x - canvas.width/2 - cam.x) * 0.1;
        cam.y += (snake[0].y - canvas.height/2 - cam.y) * 0.1;

        // --- DRAW MOON (Top Right Fixed) ---
        ctx.save();
        ctx.translate(canvas.width - 100, 100);
        moonRot += 0.001;
        ctx.rotate(moonRot);
        ctx.fillStyle = '#dfe6e9'; 
        ctx.beginPath(); ctx.arc(0, 0, 40, 0, 7); ctx.fill();
        ctx.fillStyle = '#b2bec3'; // Craters
        ctx.beginPath(); ctx.arc(-10, -5, 8, 0, 7); ctx.fill();
        ctx.beginPath(); ctx.arc(15, 10, 5, 0, 7); ctx.fill();
        ctx.restore();

        // --- WORLD DRAWING ---
        ctx.save();
        ctx.translate(-cam.x, -cam.y);

        // Stars (Parallax Background)
        ctx.fillStyle = '#fff';
        stars.forEach(s => {
            let sx = (s.x - cam.x * 0.2) % 2000; if(sx < 0) sx += 2000;
            let sy = (s.y - cam.y * 0.2) % 2000; if(sy < 0) sy += 2000;
            ctx.beginPath(); ctx.arc(cam.x + sx - 1000, cam.y + sy - 1000, s.s, 0, 7); ctx.fill();
        });

        // Movement
        let diff = angle - currAngle;
        while(diff < -Math.PI) diff += Math.PI*2;
        while(diff > Math.PI) diff -= Math.PI*2;
        currAngle += diff * 0.08;

        const head = { x: snake[0].x + Math.cos(currAngle)*3.5, y: snake[0].y + Math.sin(currAngle)*3.5 };
        snake.unshift(head);

        if(Math.hypot(head.x - fruit.x, head.y - fruit.y) < 20) { spawnFruit(); score++; } else { snake.pop(); }

        // Send Position
        if(isMulti && conn && conn.open) {
            conn.send({t: 'm', pos: snake, col: myColor});
        }

        // Draw Snakes
        function drawSnake(body, c) {
            if(!body.length) return;
            ctx.lineCap = 'round'; ctx.lineWidth = 20; ctx.strokeStyle = c;
            ctx.beginPath(); body.forEach(p => ctx.lineTo(p.x, p.y)); ctx.stroke();
            
            // Eyes
            let h = body[0];
            ctx.fillStyle = 'white';
            ctx.beginPath(); ctx.arc(h.x, h.y, 8, 0, 7); ctx.fill();
            ctx.fillStyle = 'black';
            ctx.beginPath(); ctx.arc(h.x + Math.cos(currAngle)*3, h.y + Math.sin(currAngle)*3, 3, 0, 7); ctx.fill();
        }

        drawSnake(otherSnake, otherColor);
        drawSnake(snake, myColor);
        
        // Fruit
        ctx.fillStyle = '#ff7675'; ctx.beginPath(); ctx.arc(fruit.x, fruit.y, 10, 0, 7); ctx.fill();
        
        ctx.restore();

        // --- THE ARROW (HUD) ---
        // This is drawn ON TOP of everything else so it never disappears
        if(isMulti && otherSnake.length > 0) {
            let dx = otherSnake[0].x - snake[0].x;
            let dy = otherSnake[0].y - snake[0].y;
            let dist = Math.hypot(dx, dy);
            let pointAngle = Math.atan2(dy, dx);

            // Only show arrow if friend is off-screen (distance > 300)
            if(dist > 300) {
                let arrowDist = 100; // Distance from center of screen
                let cx = canvas.width / 2 + Math.cos(pointAngle) * arrowDist;
                let cy = canvas.height / 2 + Math.sin(pointAngle) * arrowDist;

                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(pointAngle);
                
                // Draw Arrow Shape
                ctx.fillStyle = '#ff4757';
                ctx.beginPath();
                ctx.moveTo(10, 0);
                ctx.lineTo(-10, -7);
                ctx.lineTo(-10, 7);
                ctx.fill();
                
                // Draw Distance Text
                ctx.rotate(-pointAngle); // Un-rotate for text
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 12px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(Math.round(dist/10) + "m", 0, 25);
                
                ctx.restore();
            }
        }
    }
    loop();
</script>
</body>
</html>
