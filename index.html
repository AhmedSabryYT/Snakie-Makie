<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snakie - The Great Shop</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --accent: #a29bfe; --panel: rgba(15, 15, 25, 0.98); }
        body { margin: 0; background: #020208; color: #fff; font-family: 'Verdana', sans-serif; overflow: hidden; touch-action: none; }
        canvas { display: block; }
        
        /* UI Layers */
        .ui { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 100; pointer-events: none; }
        .panel { background: var(--panel); border: 1px solid #334; padding: 25px; border-radius: 20px; pointer-events: auto; width: 300px; text-align: center; max-height: 80vh; overflow-y: auto; }
        
        button { background: #2f3640; border: 1px solid #445; color: #fff; padding: 12px; margin: 5px 0; width: 100%; border-radius: 10px; cursor: pointer; font-weight: bold; }
        button:hover { background: #3d4654; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .shop-item { background: #1e272e; padding: 10px; border-radius: 8px; font-size: 10px; border: 1px solid #334; cursor: pointer; }
        .shop-item:active { border-color: var(--accent); }
        
        #hud { position: fixed; top: 20px; left: 20px; font-size: 18px; z-index: 50; }
        .hidden { display: none !important; }
        
        /* Potion Timer Bar */
        #p-timer { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); width: 200px; height: 6px; background: #111; border-radius: 10px; display: none; }
        #p-fill { width: 100%; height: 100%; background: #00d2d3; border-radius: 10px; }
    </style>
</head>
<body>

<canvas id="g"></canvas>
<div id="hud">Gems: <span id="gem-count">0</span></div>
<div id="p-timer"><div id="p-fill"></div></div>

<div id="m" class="ui">
    <div class="panel">
        <h1 style="letter-spacing:5px; color:var(--accent)">SNAKIE</h1>
        <button onclick="start(false)">SINGLE PLAYER</button>
        <button onclick="showM()">MULTIPLAYER</button>
        <button onclick="openShop()">THE SHOP</button>
    </div>
</div>

<div id="shop" class="ui hidden">
    <div class="panel">
        <h3>SKINS & POTIONS</h3>
        <p style="font-size:10px; opacity:0.6">Select a style (40 available)</p>
        <div class="grid" id="skin-list">
            </div>
        <button onclick="closeShop()" style="margin-top:20px; background:var(--accent)">DONE</button>
    </div>
</div>

<div id="mp" class="ui hidden">
    <div class="panel">
        <p>YOUR PIN: <b id="pin" style="color:var(--accent)">....</b></p>
        <input type="number" id="fpin" placeholder="FRIEND PIN" style="background:#000; color:#fff; padding:10px; width:80%; border:1px solid #445; margin-bottom:10px">
        <button onclick="join()">JOIN FRIEND</button>
        <button onclick="location.reload()" style="border:none; opacity:0.5">BACK</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('g'), ctx = canvas.getContext('2d');
    let peer, conn, isGame = false, isMulti = false;
    let snake = [], otherSnake = [], fruit = {x:0, y:0}, potion = {x:0, y:0, type:null};
    let angle = 0, currAngle = 0, otherAngle = 0;
    let cam = {x: 0, y: 0}, gems = 0;
    
    // Potion State
    let activePotion = null;
    let potionTicks = 0;
    const POTION_DURATION = 300; // ~5 seconds

    // Skin System
    let mySkin = { base: '#a29bfe', spots: null };
    const skins = [];
    const colors = ['#55efc4','#81ecec','#74b9ff','#a29bfe','#dfe6e9','#ffeaa7','#fab1a0','#ff7675','#fd79a8'];
    
    // Generate 40 Skins
    for(let i=0; i<40; i++) {
        skins.push({
            name: "Skin " + (i+1),
            base: colors[i % colors.length],
            spots: i > 10 ? colors[(i+5) % colors.length] : null
        });
    }

    // --- SHOP LOGIC ---
    function openShop() { document.getElementById('m').classList.add('hidden'); document.getElementById('shop').classList.remove('hidden'); }
    function closeShop() { document.getElementById('shop').classList.add('hidden'); document.getElementById('m').classList.remove('hidden'); }
    
    const skinList = document.getElementById('skin-list');
    skins.forEach((s, i) => {
        let div = document.createElement('div');
        div.className = 'shop-item';
        div.innerHTML = `<div style="width:20px; height:20px; background:${s.base}; margin:auto; border-radius:50%; border:2px solid ${s.spots||'transparent'}"></div>${s.name}`;
        div.onclick = () => { mySkin = s; alert("Skin Selected!"); };
        skinList.appendChild(div);
    });

    // --- PEERJS ---
    function init() {
        const p = Math.floor(1000 + Math.random() * 8999);
        peer = new Peer('snk-' + p);
        peer.on('open', () => document.getElementById('pin').innerText = p);
        peer.on('connection', c => { conn = c; isMulti = true; listen(); start(true); });
    }
    function showM() { document.getElementById('m').classList.add('hidden'); document.getElementById('mp').classList.remove('hidden'); init(); }
    function join() {
        const p = document.getElementById('fpin').value;
        conn = peer.connect('snk-' + p);
        conn.on('open', () => { isMulti = true; listen(); start(true); });
    }
    function listen() { conn.on('data', d => { if(d.t==='m'){ otherSnake=d.p; otherSkin=d.s; otherAngle=d.a; } }); }

    // --- GAME LOGIC ---
    function start(m) {
        isGame = true; isMulti = m;
        document.querySelectorAll('.ui').forEach(u => u.classList.add('hidden'));
        snake = Array(15).fill({x: 0, y: 0});
        spawnF();
        spawnP();
    }

    function spawnF() { fruit = { x: snake[0].x + (Math.random()*600-300), y: snake[0].y + (Math.random()*600-300) }; }
    
    function spawnP() {
        const types = ['SPEED', 'HEALTH', 'GHOST', 'SHIELD', 'SIZE', 'GLOW', 'MAGNET', 'BOOST', 'SLOW', 'WARP'];
        potion = { 
            x: snake[0].x + (Math.random()*800-400), 
            y: snake[0].y + (Math.random()*800-400),
            type: types[Math.floor(Math.random()*types.length)]
        };
    }

    window.addEventListener('touchmove', e => {
        angle = Math.atan2(e.touches[0].clientY - window.innerHeight/2, e.touches[0].clientX - window.innerWidth/2);
    });

    function drawApple(x, y) {
        ctx.save(); ctx.translate(x, y);
        ctx.fillStyle = '#ff4d4d'; ctx.beginPath(); ctx.arc(0,0,12,0,7); ctx.fill();
        ctx.strokeStyle = '#4d2600'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0,-8); ctx.lineTo(0,-14); ctx.stroke();
        ctx.fillStyle = '#2ecc71'; ctx.beginPath(); ctx.ellipse(3,-11,5,2,1,0,7); ctx.fill();
        ctx.restore();
    }

    function drawPotion(p) {
        ctx.save(); ctx.translate(p.x, p.y);
        ctx.fillStyle = '#55efc4'; ctx.beginPath(); ctx.moveTo(-8,8); ctx.lineTo(8,8); ctx.lineTo(4,-4); ctx.lineTo(-4,-4); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.font = '8px Arial'; ctx.textAlign='center'; ctx.fillText(p.type, 0, 18);
        ctx.restore();
    }

    function loop() {
        requestAnimationFrame(loop);
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        ctx.fillStyle = '#050510'; ctx.fillRect(0,0,canvas.width,canvas.height);
        if(!isGame) return;

        cam.x += (snake[0].x - canvas.width/2 - cam.x) * 0.1;
        cam.y += (snake[0].y - canvas.height/2 - cam.y) * 0.1;

        ctx.save(); ctx.translate(-cam.x, -cam.y);

        // Move
        let d = angle - currAngle;
        while(d < -Math.PI) d += Math.PI*2; while(d > Math.PI) d -= Math.PI*2;
        currAngle += d * 0.08;
        
        let moveSpeed = (activePotion === 'SPEED') ? 7 : 4;
        const h = { x: snake[0].x + Math.cos(currAngle)*moveSpeed, y: snake[0].y + Math.sin(currAngle)*moveSpeed };
        snake.unshift(h);

        // Collision Checks
        if(Math.hypot(h.x-fruit.x, h.y-fruit.y) < 25) { spawnF(); gems++; document.getElementById('gem-count').innerText = gems; }
        else if(Math.hypot(h.x-potion.x, h.y-potion.y) < 25) { activePotion = potion.type; potionTicks = POTION_DURATION; potion.type = null; setTimeout(spawnP, 5000); }
        else if(Math.hypot(h.x-fruit.x, h.y-fruit.y) > 1200) { spawnF(); }
        else { snake.pop(); }

        // Potion Timer Logic
        if(potionTicks > 0) {
            potionTicks--;
            document.getElementById('p-timer').style.display = 'block';
            document.getElementById('p-fill').style.width = (potionTicks/POTION_DURATION)*100 + '%';
            if(potionTicks <= 0) { activePotion = null; document.getElementById('p-timer').style.display = 'none'; }
        }

        if(isMulti && conn && conn.open) conn.send({t:'m', p:snake, s:mySkin, a:currAngle});

        const drawS = (b, skin, ang, opac = 1) => {
            if(!b.length) return;
            ctx.globalAlpha = opac;
            ctx.lineCap='round'; ctx.lineWidth=22; ctx.strokeStyle=skin.base;
            ctx.beginPath(); b.forEach(p=>ctx.lineTo(p.x,p.y)); ctx.stroke();
            if(skin.spots) {
                ctx.lineWidth=8; ctx.strokeStyle=skin.spots; ctx.setLineDash([5, 15]);
                ctx.beginPath(); b.forEach(p=>ctx.lineTo(p.x,p.y)); ctx.stroke(); ctx.setLineDash([]);
            }
            // Eyes
            const head = b[0];
            ctx.fillStyle='white'; ctx.beginPath(); ctx.arc(head.x+Math.cos(ang+0.6)*8, head.y+Math.sin(ang+0.6)*8, 5, 0, 7); ctx.fill();
            ctx.beginPath(); ctx.arc(head.x+Math.cos(ang-0.6)*8, head.y+Math.sin(ang-0.6)*8, 5, 0, 7); ctx.fill();
            ctx.globalAlpha = 1;
        };

        drawS(otherSnake, (window.otherSkin || {base:'#fff'}), otherAngle);
        drawS(snake, mySkin, currAngle, activePotion === 'GHOST' ? 0.3 : 1);
        
        drawApple(fruit.x, fruit.y);
        if(potion.type) drawPotion(potion);

        ctx.restore();
    }
    loop();
</script>
</body>
</html>
