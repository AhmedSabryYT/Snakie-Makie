<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snakie Makie P2P</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; background: #000; color: #00ffcc; font-family: sans-serif; overflow: hidden; touch-action: none; }
        canvas { display: block; }
        .menu { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
        input { background: #111; border: 2px solid #00ffcc; color: #00ffcc; padding: 15px; margin: 10px; border-radius: 8px; width: 80%; max-width: 300px; }
        button { background: #00ffcc; color: #000; border: none; padding: 15px 30px; font-weight: bold; border-radius: 8px; margin-top: 10px; }
        #controls-hint { position: fixed; bottom: 20px; width: 100%; text-align: center; opacity: 0.5; pointer-events: none; }
    </style>
</head>
<body>

<div id="menu" class="menu">
    <h1>SNAKIE MAKIE</h1>
    <p>Your ID: <b id="my-id">...</b></p>
    <input type="text" id="join-id" placeholder="Friend's ID">
    <button onclick="startJoin()">CONNECT & PLAY</button>
    <p style="font-size: 12px; margin-top: 20px;">Tap and drag anywhere to move</p>
</div>

<div id="controls-hint">DRAG ANYWHERE TO STEER</div>
<canvas id="c"></canvas>

<script>
    const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
    let peer = new Peer(), conn, isPlaying = false;
    let mySnake = [], otherSnake = [], angle = 0;

    peer.on('open', id => { document.getElementById('my-id').innerText = id; });
    peer.on('connection', c => { conn = c; setupConn(); start(); });

    function startJoin() {
        let id = document.getElementById('join-id').value;
        if(!id) return alert("Enter ID!");
        conn = peer.connect(id);
        setupConn(); start();
    }

    function setupConn() {
        conn.on('data', data => { otherSnake = data; });
    }

    function start() {
        isPlaying = true;
        mySnake = Array(15).fill({x: window.innerWidth/2, y: window.innerHeight/2});
        document.getElementById('menu').style.display = 'none';
    }

    // MOBILE CONTROLS: Detects where you touch and calculates the angle
    window.addEventListener('touchmove', e => {
        e.preventDefault();
        const touch = e.touches[0];
        // Calculate direction from center of screen to your finger
        const dx = touch.clientX - (window.innerWidth / 2);
        const dy = touch.clientY - (window.innerHeight / 2);
        angle = Math.atan2(dy, dx);
    }, { passive: false });

    function loop() {
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        ctx.fillStyle = 'black'; ctx.fillRect(0,0,canvas.width,canvas.height);

        if(isPlaying) {
            // Move Head
            const head = { 
                x: mySnake[0].x + Math.cos(angle) * 4, 
                y: mySnake[0].y + Math.sin(angle) * 4 
            };
            
            // Screen Wrap (go off one side, come out the other)
            if(head.x < 0) head.x = canvas.width;
            if(head.x > canvas.width) head.x = 0;
            if(head.y < 0) head.y = canvas.height;
            if(head.y > canvas.height) head.y = 0;

            mySnake.unshift(head);
            mySnake.pop();

            // Send data to friend
            if(conn && conn.open) conn.send(mySnake);

            // Draw Friend (Pink)
            if(otherSnake.length) {
                ctx.strokeStyle = '#ff0055'; ctx.lineWidth = 15; ctx.lineCap = 'round';
                ctx.beginPath(); otherSnake.forEach(p => ctx.lineTo(p.x, p.y)); ctx.stroke();
            }

            // Draw Me (Cyan)
            ctx.strokeStyle = '#00ffcc'; ctx.lineWidth = 15; ctx.lineCap = 'round';
            ctx.beginPath(); mySnake.forEach(p => ctx.lineTo(p.x, p.y)); ctx.stroke();
        }
        requestAnimationFrame(loop);
    }
    loop();
</script>
</body>
</html>
