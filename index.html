<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Snaike Maike</title>
    <style>
        :root { --neon: #00ffcc; --pink: #ff0055; --gold: #ffcc00; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; touch-action: none; font-family: 'Courier New', Courier, monospace; color: white; }
        
        canvas { position: absolute; top: 0; left: 0; z-index: 5; }
        .ui-layer { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); }
        .hidden { display: none !important; }

        h1 { font-size: 12vw; color: var(--neon); text-shadow: 0 0 20px var(--neon); margin: 0; animation: glow 2s infinite alternate; }
        @keyframes glow { from { text-shadow: 0 0 10px var(--neon); } to { text-shadow: 0 0 30px var(--neon), 0 0 40px #fff; } }
        .dev { font-size: 12px; color: #666; letter-spacing: 3px; margin-bottom: 20px; }

        #hud { position: fixed; top: 20px; left: 20px; z-index: 50; font-size: 18px; color: var(--neon); pointer-events: none; text-shadow: 0 0 5px #000; }
        #joy { position: fixed; bottom: 50px; left: 50px; width: 100px; height: 100px; border-radius: 50%; border: 2px solid var(--neon); z-index: 50; background: rgba(0,255,204,0.1); }
        #stick { position: absolute; top: 25px; left: 25px; width: 50px; height: 50px; border-radius: 50%; background: var(--neon); box-shadow: 0 0 20px var(--neon); }

        .btn { padding: 15px 40px; border: 2px solid var(--neon); background: transparent; color: var(--neon); border-radius: 10px; font-weight: bold; margin: 10px; cursor: pointer; font-family: inherit; }
        .btn-red { border-color: var(--pink); color: var(--pink); }

        .stat-box { background: rgba(255,255,255,0.05); padding: 20px; border-radius: 15px; border: 1px solid var(--gold); margin-bottom: 20px; min-width: 200px; }
    </style>
</head>
<body>

    <div id="hud" class="hidden">
        SCORE: <span id="score-val">0</span><br>
        BEST: <span id="high-val">0</span><br>
        COINS: 💰<span id="bank-val">0</span>
    </div>

    <div id="menu-screen" class="ui-layer">
        <h1>Snaike Maike</h1>
        <div class="dev">STRICKERJOY STUDIOS</div>
        <div style="margin-bottom: 20px; color: var(--gold);">BEST SCORE: <span id="menu-high">0</span></div>
        <button class="btn" onclick="playGame()">START GAME</button>
        <button class="btn btn-red" onclick="showShop(true)">SHOP</button>
    </div>

    <div id="shop-screen" class="ui-layer hidden">
        <h2 style="color:var(--gold)">EQUIPMENT</h2>
        <div style="margin-bottom: 10px;">BALANCE: 💰<span id="shop-bank">0</span></div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; width:80%;">
            <div style="background:#111; padding:15px; border:1px solid #333;">🌈 SKIN<br><small>500 💰</small></div>
            <div style="background:#111; padding:15px; border:1px solid #333;">🛡️ SHIELD<br><small>200 💰</small></div>
            <div style="background:#111; padding:15px; border:1px solid #333;">⚡ SPEED<br><small>150 💰</small></div>
            <div style="background:#111; padding:15px; border:1px solid #333;">🧲 MAGNET<br><small>300 💰</small></div>
        </div>
        <button class="btn" onclick="showShop(false)">BACK</button>
    </div>

    <div id="death-screen" class="ui-layer hidden">
        <h2 style="color:var(--pink); font-size: 40px;">MISSION FAILED</h2>
        <div class="stat-box">
            Score: <span id="final-score">0</span><br>
            New Coins: +<span id="earn-val">0</span>
        </div>
        <button class="btn" onclick="playGame()">REDEPLOY</button>
        <button class="btn btn-red" onclick="location.reload()">MENU</button>
    </div>

    <div id="joy" class="hidden"><div id="stick"></div></div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let w, h, isPlaying = false, score = 0, lastTime = 0;
        let snake = [], food = {}, angle = 0, speed = 0.17;
        let spawnTimer = 0, bgShapes = [];

        // LOAD DATA
        let bank = parseInt(localStorage.getItem('snaike_coins')) || 0;
        let highScore = parseInt(localStorage.getItem('snaike_high')) || 0;

        function updateDataDisplay() {
            document.getElementById('bank-val').innerText = bank;
            document.getElementById('shop-bank').innerText = bank;
            document.getElementById('high-val').innerText = highScore;
            document.getElementById('menu-high').innerText = highScore;
        }
        updateDataDisplay();

        function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
            initShapes();
        }

        function initShapes() {
            bgShapes = [];
            for(let i=0; i<20; i++) {
                bgShapes.push({
                    x: Math.random()*w, y: Math.random()*h,
                    size: Math.random()*20+5,
                    speed: Math.random()*0.5+0.1,
                    type: Math.floor(Math.random()*3),
                    color: `hsla(${Math.random()*360}, 70%, 50%, 0.1)`
                });
            }
        }

        function showShop(open) {
            document.getElementById('shop-screen').classList.toggle('hidden', !open);
            document.getElementById('menu-screen').classList.toggle('hidden', open);
        }

        function gameOver() {
            if(!isPlaying) return;
            isPlaying = false;
            const earned = Math.floor(score / 5);
            bank += earned;
            if(score > highScore) highScore = score;

            // SAVE TO DISK
            localStorage.setItem('snaike_coins', bank);
            localStorage.setItem('snaike_high', highScore);

            document.getElementById('final-score').innerText = score;
            document.getElementById('earn-val').innerText = earned;
            updateDataDisplay();
            
            document.getElementById('death-screen').classList.remove('hidden');
            document.getElementById('joy').classList.add('hidden');
        }

        function playGame() {
            score = 0; isPlaying = true; snake = [];
            spawnTimer = 100; // Protection from self-collision
            for(let i=0; i<20; i++) snake.push({x: w/2, y: h/2});
            
            document.querySelectorAll('.ui-layer').forEach(l => l.classList.add('hidden'));
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('joy').classList.remove('hidden');
            spawnFood();
        }

        function spawnFood() {
            food = { 
                x: 80 + Math.random()*(w-160), 
                y: 80 + Math.random()*(h-160), 
                t: ['🍎','🍓','🍇','🍍','🍉'][Math.floor(Math.random()*5)] 
            };
        }

        // CONTROL LOGIC
        const joy = document.getElementById('joy'), stick = document.getElementById('stick');
        window.addEventListener('touchmove', (e) => {
            if(!isPlaying) return;
            const t = e.touches[0], r = joy.getBoundingClientRect();
            const dx = t.clientX - (r.left + 50), dy = t.clientY - (r.top + 50);
            const dist = Math.hypot(dx, dy);
            if(dist > 5) {
                angle = Math.atan2(dy, dx);
                const l = Math.min(dist, 30);
                stick.style.transform = `translate(${(dx/dist)*l}px, ${(dy/dist)*l}px)`;
            }
        }, {passive: false});

        function loop(time) {
            const dt = time - lastTime; lastTime = time;
            ctx.fillStyle = '#000'; ctx.fillRect(0,0,w,h);
            
            // DRAW NEON GRID
            ctx.strokeStyle = '#0a0a0a'; ctx.lineWidth = 1;
            for(let x=0; x<w; x+=40) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke(); }
            for(let y=0; y<h; y+=40) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }

            // DRAW FALLING SHAPES
            bgShapes.forEach(s => {
                ctx.strokeStyle = s.color;
                ctx.beginPath();
                if(s.type === 0) ctx.arc(s.x, s.y, s.size, 0, 7);
                else if(s.type === 1) ctx.strokeRect(s.x, s.y, s.size, s.size);
                else { ctx.moveTo(s.x, s.y); ctx.lineTo(s.x+s.size, s.y+s.size); ctx.lineTo(s.x-s.size, s.y+s.size); ctx.closePath(); }
                ctx.stroke();
                s.y += s.speed; if(s.y > h) s.y = -20;
            });

            // DRAW BORDER
            ctx.strokeStyle = 'rgba(255, 0, 85, 0.6)';
            ctx.lineWidth = 6;
            ctx.strokeRect(10, 10, w-20, h-20);

            if(isPlaying) {
                if(spawnTimer > 0) spawnTimer--;

                const head = { x: snake[0].x + Math.cos(angle)*speed*dt, y: snake[0].y + Math.sin(angle)*speed*dt };
                
                // BOUNDARY CHECK (Improved math to prevent "Ghost deaths")
                if(head.x < 15 || head.x > w-15 || head.y < 15 || head.y > h-15) { gameOver(); }

                snake.unshift(head);
                if(Math.hypot(head.x - food.x, head.y - food.y) < 32) {
                    score += 10; document.getElementById('score-val').innerText = score;
                    spawnFood();
                } else { snake.pop(); }

                // SELF-COLLISION
                if(spawnTimer <= 0) {
                    for(let i=18; i<snake.length; i++) {
                        if(Math.hypot(head.x - snake[i].x, head.y - snake[i].y) < 10) gameOver();
                    }
                }

                // DRAW SNAKE
                ctx.shadowBlur = 10; ctx.shadowColor = '#00ffcc';
                ctx.strokeStyle = '#00ffcc'; ctx.lineWidth = 14; ctx.lineCap = 'round';
                ctx.beginPath(); ctx.moveTo(snake[0].x, snake[0].y);
                snake.forEach(p => ctx.lineTo(p.x, p.y)); ctx.stroke();
                ctx.shadowBlur = 0;
                
                // DRAW FOOD
                ctx.font = '34px Arial'; ctx.textAlign = 'center';
                ctx.fillText(food.t, food.x, food.y+12);
            }
            requestAnimationFrame(loop);
        }

        window.addEventListener('resize', resize);
        resize();
        requestAnimationFrame(loop);
    </script>
</body>
</html>
