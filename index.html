<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snakie Makie - StrikerJoy</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; background: #000b18; color: #00d4ff; font-family: 'Segoe UI', sans-serif; overflow: hidden; touch-action: none; }
        canvas { display: block; position: absolute; top: 0; left: 0; }
        .ui { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; pointer-events: none; text-align: center; }
        .panel { background: rgba(0, 15, 40, 0.9); border: 2px solid #00d4ff; padding: 25px; border-radius: 15px; pointer-events: auto; width: 280px; box-shadow: 0 0 30px rgba(0, 212, 255, 0.2); }
        button, input { background: #001d3d; border: 1px solid #00d4ff; color: #00d4ff; padding: 12px; margin: 8px; width: 100%; border-radius: 5px; font-weight: bold; }
        #leaderboard { position: fixed; top: 15px; right: 15px; background: rgba(0, 29, 61, 0.7); padding: 10px; border: 1px solid #00d4ff; border-radius: 8px; font-size: 14px; z-index: 110; display: none; }
        #chat-ui { position: fixed; bottom: 80px; left: 10px; width: 200px; pointer-events: auto; z-index: 110; display: none; }
        #msgs { height: 70px; overflow-y: auto; background: rgba(0,0,0,0.6); font-size: 11px; padding: 5px; color: #fff; }
        .hidden { display: none !important; }
        #colorPicker { width: 100%; height: 40px; border: none; cursor: pointer; }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="leaderboard">YOU: 0 | THEM: 0</div>

<div id="menu" class="ui">
    <div class="panel">
        <h1 style="margin:0; font-size: 28px;">SNAKIE MAKIE</h1>
        <p style="font-size:10px; margin-bottom:20px;">STRIKERJOY STUDIOS</p>
        <p>💰 COINS: <span id="coin-count">0</span></p>
        <button onclick="showModeSelect(false)">SINGLE PLAYER</button>
        <button onclick="showModeSelect(true)">MULTIPLAYER</button>
        <button onclick="showCustomizer()">CHANGE COLOR (10 💰)</button>
        <div style="font-size: 9px; margin-top: 20px; opacity: 0.6;">Ahmed Sabry --- StrikerJoy Studios</div>
    </div>
</div>

<div id="mode-select" class="ui hidden">
    <div class="panel">
        <h3>SELECT MODE</h3>
        <button onclick="setGameMode('peaceful')">PEACEFUL MODE</button>
        <button onclick="setGameMode('survival')">3 LIVES MODE</button>
        <button onclick="closeUI()" style="border:none;">BACK</button>
    </div>
</div>

<div id="customizer" class="ui hidden">
    <div class="panel">
        <h3>CHOOSE SKIN COLOR</h3>
        <input type="color" id="colorPicker" value="#00d4ff">
        <button onclick="applyColor()">APPLY & SAVE</button>
        <button onclick="closeUI()" style="background:transparent; border:none;">BACK</button>
    </div>
</div>

<div id="multi-panel" class="ui hidden">
    <div class="panel">
        <p>YOUR ROOM PIN: <b id="my-pin">----</b></p>
        <input type="number" id="join-pin" placeholder="FRIEND'S PIN">
        <button onclick="startJoin()">JOIN ROOM</button>
        <button onclick="closeUI()" style="background:transparent;">BACK</button>
    </div>
</div>

<div id="chat-ui">
    <div id="msgs"></div>
    <input type="text" id="chat-in" placeholder="Message..." onkeypress="if(event.key==='Enter') sendChat()">
</div>

<script>
    const canvas = document.getElementById('gameCanvas'), ctx = canvas.getContext('2d');
    let peer, conn, isPlaying = false, isMulti = false, angle = 0;
    let mySnake = [], otherSnake = [], fruit = {x: 200, y: 200};
    let camera = {x: 0, y: 0}, lives = 3, mode = 'peaceful';
    let myScore = 0, enemyScore = 0;
    
    let data = JSON.parse(localStorage.getItem('snakie_pro')) || { coins: 0, skin: '#00d4ff' };
    const badWords = ['harmful', 'badword1', 'badword2']; 

    function save() { localStorage.setItem('snakie_pro', JSON.stringify(data)); document.getElementById('coin-count').innerText = data.coins; }
    save();

    let stars = [], breezes = [];
    function initEnv() {
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        // Exactly 80 stars and 10 breeze lines from your favorite version
        stars = Array(80).fill(0).map(() => ({x: Math.random()*2000-1000, y: Math.random()*2000-1000, s: Math.random()*2}));
        breezes = Array(10).fill(0).map(() => ({x: Math.random()*2000-1000, y: Math.random()*2000-1000, l: 30 + Math.random()*50}));
    }
    initEnv();

    const pin = Math.floor(1000 + Math.random()*9000).toString();
    peer = new Peer('snakie-' + pin);
    peer.on('open', () => document.getElementById('my-pin').innerText = pin);
    peer.on('connection', c => { 
        conn = c; isMulti = true; 
        conn.on('open', () => { conn.send({type:'sync-req'}); });
        setupConn(); 
    });

    function setupConn() {
        conn.on('data', d => {
            if(d.type === 'move') { otherSnake = d.body; }
            if(d.type === 'chat') addMsg("Player 2: " + censor(d.txt));
            if(d.type === 'sync-req') { conn.send({type:'sync-mode', m: mode}); startGame(); }
            if(d.type === 'sync-mode') { mode = d.m; startGame(); }
            if(d.type === 'score-up') { enemyScore = d.val; updateLeaderboard(); }
        });
        conn.on('close', () => { alert("Player 2 has exited"); location.reload(); });
    }

    function showModeSelect(multi) { isMulti = multi; document.getElementById('menu').classList.add('hidden'); document.getElementById('mode-select').classList.remove('hidden'); }
    function setGameMode(m) { mode = m; if(isMulti) { document.getElementById('mode-select').classList.add('hidden'); document.getElementById('multi-panel').classList.remove('hidden'); } else { startGame(); } }
    function startJoin() { conn = peer.connect('snakie-' + document.getElementById('join-pin').value); setupConn(); }
    function showCustomizer() { document.getElementById('menu').classList.add('hidden'); document.getElementById('customizer').classList.remove('hidden'); }
    function closeUI() { document.querySelectorAll('.ui').forEach(u => u.classList.add('hidden')); document.getElementById('menu').classList.remove('hidden'); }

    function startGame() {
        lives = 3; myScore = 0; enemyScore = 0; isPlaying = true;
        mySnake = []; // Fix: Resets body to prevent "Long Snake" bug
        for(let i=0; i<15; i++) mySnake.push({x: canvas.width/2, y: canvas.height/2});
        document.querySelectorAll('.ui').forEach(u => u.classList.add('hidden'));
        document.getElementById('leaderboard').style.display = 'block';
        if(isMulti) document.getElementById('chat-ui').style.display = 'block';
        updateLeaderboard();
    }

    function updateLeaderboard() {
        document.getElementById('leaderboard').innerText = isMulti ? `YOU: ${myScore} | THEM: ${enemyScore}` : `SCORE: ${myScore}`;
    }

    function applyColor() {
        if(data.coins >= 10) { data.coins -= 10; data.skin = document.getElementById('colorPicker').value; save(); closeUI(); }
        else { alert("Need 10 coins!"); }
    }

    function censor(t) {
        let clean = t;
        badWords.forEach(w => { let r = new RegExp(w, 'gi'); clean = clean.replace(r, "****"); });
        return clean;
    }

    function sendChat() {
        const i = document.getElementById('chat-in'); if(!i.value) return;
        let c = censor(i.value); addMsg("You: " + c);
        if(conn) conn.send({type:'chat', txt: c}); i.value = '';
    }

    function addMsg(t) { const m = document.getElementById('msgs'); m.innerHTML += `<div>${t}</div>`; m.scrollTop = m.scrollHeight; }

    function drawHeart(x, y) {
        ctx.fillStyle = '#ff0055'; ctx.beginPath();
        ctx.moveTo(x, y); ctx.bezierCurveTo(x, y-3, x-5, y-3, x-5, y);
        ctx.bezierCurveTo(x-5, y+5, x, y+8, x, y+10);
        ctx.bezierCurveTo(x, y+8, x+5, y+5, x+5, y);
        ctx.bezierCurveTo(x+5, y-3, x, y-3, x, y); ctx.fill();
    }

    window.addEventListener('touchmove', e => {
        angle = Math.atan2(e.touches[0].clientY - window.innerHeight/2, e.touches[0].clientX - window.innerWidth/2);
    });

    function loop() {
        ctx.fillStyle = '#000b18'; ctx.fillRect(0,0,canvas.width,canvas.height);

        if(isPlaying) {
            // Infinite Camera Follow
            camera.x += (mySnake[0].x - canvas.width/2 - camera.x) * 0.1;
            camera.y += (mySnake[0].y - canvas.height/2 - camera.y) * 0.1;
            
            ctx.save(); ctx.translate(-camera.x, -camera.y);

            // Restored: 80 Stars & Moon
            ctx.fillStyle = "white"; stars.forEach(s => { ctx.beginPath(); ctx.arc(s.x, s.y, s.s, 0, 7); ctx.fill(); });
            
            // Breeze Animation
            ctx.strokeStyle = "rgba(255,255,255,0.05)";
            breezes.forEach(b => { ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x+b.l, b.y); ctx.stroke(); b.x+=1; if(b.x>1500) b.x=-1000; });

            const head = { x: mySnake[0].x + Math.cos(angle)*1.8, y: mySnake[0].y + Math.sin(angle)*1.8 };
            mySnake.unshift(head);
            if(Math.hypot(head.x - fruit.x, head.y - fruit.y) < 20) {
                fruit = {x: Math.random()*2000-1000, y: Math.random()*2000-1000};
                data.coins++; myScore++; save(); updateLeaderboard();
                if(conn) conn.send({type: 'score-up', val: myScore});
            } else { mySnake.pop(); }

            if(isMulti && conn) conn.send({type:'move', body:mySnake});

            ctx.lineWidth = 14; ctx.lineCap = 'round';
            if(isMulti && otherSnake.length) { ctx.strokeStyle = '#ff0055'; ctx.beginPath(); otherSnake.forEach(p => ctx.lineTo(p.x, p.y)); ctx.stroke(); }
            ctx.strokeStyle = data.skin; ctx.beginPath(); mySnake.forEach(p => ctx.lineTo(p.x, p.y)); ctx.stroke();

            // Fruit
            ctx.fillStyle = '#ff3333'; ctx.beginPath(); ctx.arc(fruit.x, fruit.y, 10, 0, 7); ctx.fill();
            ctx.fillStyle = '#44ff44'; ctx.fillRect(fruit.x-2, fruit.y-14, 4, 6);

            ctx.restore();

            // Static HUD - Moon
            ctx.fillStyle = '#fff'; ctx.shadowBlur = 30; ctx.shadowColor = '#fff';
            ctx.beginPath(); ctx.arc(80, 80, 30, 0, 7); ctx.fill(); ctx.shadowBlur = 0;

            if(mode === 'survival') { for(let i=0; i<lives; i++) drawHeart(30 + i*15, canvas.height - 30); }
        }
        requestAnimationFrame(loop);
    }
    loop();
</script>
</body>
</html>
