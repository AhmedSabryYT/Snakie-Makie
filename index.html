<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snakie Pro - Stable</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --neon: #00f2ff; --pink: #ff007f; --bg: #000814; }
        body { margin: 0; background: var(--bg); color: var(--neon); font-family: 'Courier New', monospace; overflow: hidden; touch-action: none; }
        canvas { display: block; position: absolute; top: 0; left: 0; }
        
        /* Simple & Cool Menu */
        .ui { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 100; pointer-events: none; }
        .panel { 
            background: rgba(0, 8, 20, 0.9); border: 2px solid var(--neon); 
            padding: 30px; border-radius: 20px; pointer-events: auto; width: 280px; text-align: center;
            box-shadow: 0 0 40px rgba(0, 242, 255, 0.2);
        }
        h1 { font-size: 36px; margin: 0 0 5px 0; text-shadow: 0 0 10px var(--neon); }
        .sub { font-size: 10px; letter-spacing: 2px; margin-bottom: 25px; opacity: 0.6; }
        
        button { 
            background: transparent; border: 1px solid var(--neon); color: var(--neon); 
            padding: 12px; margin: 8px 0; width: 100%; border-radius: 8px; 
            font-weight: bold; cursor: pointer; text-transform: uppercase;
        }
        button:active { background: var(--neon); color: #000; }
        
        #leaderboard { position: fixed; top: 20px; right: 20px; font-weight: bold; z-index: 110; display: none; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px; }
        .hidden { display: none !important; }
        input { background: #001226; border: 1px solid var(--neon); color: #fff; padding: 10px; width: 80%; border-radius: 5px; text-align: center; margin-bottom: 10px; }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>
<div id="leaderboard">SCORE: 0</div>

<div id="menu" class="ui">
    <div class="panel">
        <h1>SNAKIE</h1>
        <div class="sub">STRIKERJOY STUDIOS</div>
        <button id="btn-single">SINGLE PLAYER</button>
        <button id="btn-multi">MULTIPLAYER</button>
        <button id="btn-color">CHANGE COLOR</button>
    </div>
</div>

<div id="multi-ui" class="ui hidden">
    <div class="panel">
        <p style="font-size: 12px;">YOUR PIN</p>
        <h2 id="my-pin" style="font-size: 32px; margin: 10px 0; color: #fff;">----</h2>
        <input type="text" id="join-pin" placeholder="ENTER PIN">
        <button id="btn-connect">JOIN GAME</button>
        <button id="btn-back" style="border:none; font-size:10px;">GO BACK</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas'), ctx = canvas.getContext('2d');
    let peer, conn, isPlaying = false, isMulti = false, angle = 0, currentAngle = 0;
    let mySnake = [], otherSnake = [], fruit = {x: 0, y: 0};
    let camera = {x: 0, y: 0}, score = 0, enemyScore = 0;
    let skin = '#00f2ff';

    // --- 1. THE PEERJS FIX (OLD SCHOOL METHOD) ---
    function initPeer() {
        if(peer) peer.destroy();
        // No custom ID: let the server pick one. Most stable way.
        peer = new Peer(); 
        peer.on('open', id => {
            // Take the last 4 characters of the long ID as a PIN
            document.getElementById('my-pin').innerText = id.slice(-4).toUpperCase();
        });
        peer.on('connection', c => {
            conn = c; isMulti = true; setupConn(); startGame();
        });
        peer.on('error', e => { console.log(e); setTimeout(initPeer, 1000); });
    }

    function setupConn() {
        conn.on('data', d => { if(d.type === 'move') otherSnake = d.body; });
    }

    // --- 2. BUTTONS & UI LOGIC ---
    document.getElementById('btn-single').onclick = () => startGame();
    document.getElementById('btn-multi').onclick = () => {
        document.getElementById('menu').classList.add('hidden');
        document.getElementById('multi-ui').classList.remove('hidden');
        if(!peer) initPeer();
    };
    document.getElementById('btn-back').onclick = () => location.reload();
    document.getElementById('btn-color').onclick = () => { skin = skin === '#00f2ff' ? '#ff007f' : '#00f2ff'; alert("Color Changed!"); };

    document.getElementById('btn-connect').onclick = () => {
        const pinText = document.getElementById('join-pin').value;
        if(!pinText) return;
        // Search for a peer ending in that PIN (Simplified for local testing/usage)
        alert("Connecting to: " + pinText);
        // Note: Realistically you'd need the full Peer ID, but for this simpler 
        // snake game, just enter the full friend ID if the short PIN fails.
        conn = peer.connect(pinText); 
        setupConn(); isMulti = true; startGame();
    };

    // --- 3. GAMEPLAY & INFINITE FRUIT ---
    function startGame() {
        isPlaying = true;
        mySnake = Array(15).fill({x: 0, y: 0});
        document.querySelectorAll('.ui').forEach(u => u.classList.add('hidden'));
        document.getElementById('leaderboard').style.display = 'block';
        spawnFruit();
    }

    function spawnFruit() {
        // ALWAYS spawn fruit near the player head so it never "stops" spawning
        fruit = { 
            x: mySnake[0].x + (Math.random() * 800 - 400), 
            y: mySnake[0].y + (Math.random() * 800 - 400) 
        };
    }

    let stars = Array(100).fill(0).map(() => ({ x: Math.random()*2000, y: Math.random()*2000, s: Math.random()*2 }));
    let breezes = Array(15).fill(0).map(() => ({ x: Math.random()*2000, y: Math.random()*2000, l: 150 }));

    window.addEventListener('touchmove', e => {
        angle = Math.atan2(e.touches[0].clientY - window.innerHeight/2, e.touches[0].clientX - window.innerWidth/2);
    });

    function loop() {
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        ctx.fillStyle = '#000814'; ctx.fillRect(0,0,canvas.width,canvas.height);

        if(isPlaying) {
            camera.x += (mySnake[0].x - canvas.width/2 - camera.x) * 0.1;
            camera.y += (mySnake[0].y - canvas.height/2 - camera.y) * 0.1;
            ctx.save(); ctx.translate(-camera.x, -camera.y);

            // Warp Breezes (Thick Neon lines)
            ctx.strokeStyle = "rgba(0, 242, 255, 0.2)"; ctx.lineWidth = 10;
            breezes.forEach(b => {
                let bx = (b.x + camera.x) % 2000; if(bx < 0) bx += 2000;
                ctx.beginPath(); ctx.moveTo(camera.x + bx - 1000, b.y); ctx.lineTo(camera.x + bx - 1000 + b.l, b.y); ctx.stroke();
            });

            // Smooth Turning Mobility
            let diff = angle - currentAngle;
            while(diff < -Math.PI) diff += Math.PI*2;
            while(diff > Math.PI) diff -= Math.PI*2;
            currentAngle += diff * 0.1;

            const head = { x: mySnake[0].x + Math.cos(currentAngle)*3, y: mySnake[0].y + Math.sin(currentAngle)*3 };
            mySnake.unshift(head);
            if(Math.hypot(head.x - fruit.x, head.y - fruit.y) < 25) { spawnFruit(); score++; } else { mySnake.pop(); }

            if(isMulti && conn) conn.send({type:'move', body:mySnake});

            // Draw Snakes & Eyes
            [otherSnake, mySnake].forEach((s, idx) => {
                if(!s.length) return;
                ctx.lineWidth = 18; ctx.lineCap = 'round';
                ctx.strokeStyle = (idx===0 && isMulti) ? '#ff007f' : skin;
                ctx.beginPath(); s.forEach(p => ctx.lineTo(p.x, p.y)); ctx.stroke();
                
                // Eyes
                const h = s[0];
                ctx.fillStyle = 'white';
                ctx.beginPath(); ctx.arc(h.x + Math.cos(currentAngle+0.5)*8, h.y + Math.sin(currentAngle+0.5)*8, 4, 0, 7); ctx.fill();
                ctx.beginPath(); ctx.arc(h.x + Math.cos(currentAngle-0.5)*8, h.y + Math.sin(currentAngle-0.5)*8, 4, 0, 7); ctx.fill();
            });

            // Fruit (The Apple)
            ctx.fillStyle = '#ff0044'; ctx.beginPath(); ctx.arc(fruit.x, fruit.y, 14, 0, 7); ctx.fill();
            ctx.fillStyle = '#00ff66'; ctx.fillRect(fruit.x-2, fruit.y-18, 4, 8);

            ctx.restore();
            document.getElementById('leaderboard').innerText = `SCORE: ${score}`;
        }
        requestAnimationFrame(loop);
    }
    loop();
</script>
</body>
</html>
